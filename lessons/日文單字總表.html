<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E3%81%82%3C/text%3E%3C/svg%3E" />
<title>日文單字總表</title>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
  --accent:#111827; --soft:#eef2f7; --hl:#f2f4f7;
  --fs:18px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1f2329; --text:#e6e7ea; --muted:#9aa1ab; --line:#333842;
    --accent:#e6e7ea; --soft:#2a2f37; --hl:#2a2f37;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1f2329; --text:#e6e7ea; --muted:#9aa1ab; --line:#333842;
  --accent:#e6e7ea; --soft:#2a2f37; --hl:#2a2f37;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
:lang(ja){font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Segoe UI",sans-serif}
.app{max-width:1000px;margin:0 auto;padding:0 16px 100px}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 0 8px;margin-bottom:14px}
.backlink{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;padding:2px 0;margin-bottom:4px}
.backlink:hover{color:var(--text)}
h1{font-size:1.1rem;margin:0 0 8px;display:flex;align-items:center;gap:8px}
h1 .n{font-size:.8rem;color:var(--muted);font-weight:400}
.gear{margin-left:auto;font-size:16px;padding:6px 10px;min-height:0;line-height:1}

button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:11px 13px;min-height:44px;font-size:15px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

.ctl-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ctl-row:last-child{margin-bottom:0}
.ctl-row .lbl{font-size:12px;color:var(--muted);flex:0 0 auto}
/* 搜尋框：font-size 16px 讓 iOS 對焦時不會自動放大整頁 */
.search{flex:1;min-width:0;padding:9px 12px;min-height:40px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.iconbtn{flex:0 0 auto;min-height:40px;padding:8px 12px;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{min-height:36px;padding:6px 12px;font-size:13px}
.empty{color:var(--muted);padding:24px 4px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}
.sheet{width:100%;max-width:880px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:1.4rem}
.sheet-close{float:right;min-height:0;padding:6px 10px}
.setrow{display:flex;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap}
.setrow .lab{flex:0 0 100%;font-weight:600;margin-bottom:2px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){
  .app{padding-top:8px}
  .sheet{border-radius:20px;margin-bottom:20px}
  .modal{align-items:center}
}

@media print{
  header{position:static;border:0;margin-bottom:8px}
  .backlink,.gear,.ctl-row{display:none}
  .vt .play{display:none}
  body{background:#fff;color:#000;line-height:1.45}
  .vt{border:1px solid #000!important}
  .vt th,.vt td{border-bottom:1px solid #999!important;font-size:10.5pt!important}
  .vt thead th{background:#eee!important;color:#000!important}
  .vt .vt-read{color:#333!important}
  /* 列印一律顯示讀音，不管畫面上是否關掉 */
  body.fg-none .vt .vt-read,body.fg-target .vt .vt-read{visibility:visible!important;display:table-cell!important}
  .vt-group{break-after:avoid}
  .vt tbody tr{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
<header>
  <a class="backlink" href="../">← 回目錄</a>
  <h1>日文單字總表 <span class="n" id="count"></span>
    <button class="gear" id="gearBtn" aria-label="設定">⚙︎</button>
  </h1>

  <div class="ctl-row">
    <input class="search" id="search" type="search" placeholder="搜尋 單字／讀音／中文／例句…" aria-label="搜尋單字" />
    <button class="iconbtn active" id="fgBtn" aria-pressed="true" title="顯示／隱藏注音">注音</button>
    <button class="iconbtn" id="printBtn" aria-label="列印" title="列印／存 PDF">🖨</button>
  </div>
  <div class="ctl-row" id="lessonRow" hidden>
    <span class="lbl">課程</span>
    <span class="filters" id="lessonFilter"></span>
  </div>
</header>

<div id="list"></div>
<p class="empty" id="loadState">載入中…（需用本機伺服器或線上版開啟）</p>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="../assets/vocab-table.js"></script>
<script>
const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,v);}catch{}}
};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 主題 / 字級（與課文一致） ---------- */
function applyTheme(){
  const t=LS.get("vocabtable-theme","auto");
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}
function applyFont(){
  document.documentElement.style.setProperty("--fs",LS.get("vocabtable-fs","18")+"px");
}
applyTheme(); applyFont();

const modal=document.getElementById("modal"), sheet=document.getElementById("sheet");
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") modal.classList.remove("show"); });
document.getElementById("gearBtn").onclick=()=>{
  const t=LS.get("vocabtable-theme","auto"), fs=LS.get("vocabtable-fs","18");
  sheet.innerHTML=`
    <button class="sheet-close" data-act="close">關閉</button>
    <h3>設定</h3>
    <div class="setrow"><span class="lab">深色模式</span>
      <button data-set="theme" data-val="auto" class="${t==="auto"?"active":""}">跟系統</button>
      <button data-set="theme" data-val="light" class="${t==="light"?"active":""}">淺色</button>
      <button data-set="theme" data-val="dark" class="${t==="dark"?"active":""}">深色</button>
    </div>
    <div class="setrow"><span class="lab">字級</span>
      <button data-set="fs" data-val="16" class="${fs==="16"?"active":""}">小</button>
      <button data-set="fs" data-val="18" class="${fs==="18"?"active":""}">中</button>
      <button data-set="fs" data-val="20" class="${fs==="20"?"active":""}">大</button>
      <button data-set="fs" data-val="23" class="${fs==="23"?"active":""}">特大</button>
    </div>`;
  modal.classList.add("show");
};
sheet.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-set]"); if(!b) return;
  if(b.dataset.act==="close"){ modal.classList.remove("show"); return; }
  if(b.dataset.set==="theme"){ LS.set("vocabtable-theme",b.dataset.val); applyTheme(); }
  else if(b.dataset.set==="fs"){ LS.set("vocabtable-fs",b.dataset.val); applyFont(); }
  document.getElementById("gearBtn").onclick();
});

/* ---------- 注音顯示（沿用 body.fg-* class，與課文一致） ---------- */
let fgOn=LS.get("vocabtable-fg","on")!=="off";
const fgBtn=document.getElementById("fgBtn");
function applyFg(){
  document.body.classList.toggle("fg-all",fgOn);
  document.body.classList.toggle("fg-none",!fgOn);
  fgBtn.classList.toggle("active",fgOn);
  fgBtn.setAttribute("aria-pressed",String(fgOn));
  fgBtn.textContent=fgOn?"注音":"注音｜關";
}
fgBtn.onclick=()=>{ fgOn=!fgOn; LS.set("vocabtable-fg",fgOn?"on":"off"); applyFg(); };
applyFg();
document.getElementById("printBtn").onclick=()=>window.print();

/* ---------- 語音 ---------- */
let AUDIO={}, voicesCache=[];
function loadVoices(){ try{voicesCache=speechSynthesis.getVoices()||[];}catch{} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
fetch("../audio/manifest.json").then(r=>r.ok?r.json():{}).then(m=>{AUDIO=m||{};}).catch(()=>{});
let curAudio=null;
function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; u.rate=.85;
  const ja=voicesCache.find(v=>/^ja(-|_)/i.test(v.lang));
  if(ja) u.voice=ja;
  speechSynthesis.speak(u);
}
function play(text){
  if(!text) return;
  const file=AUDIO[text];
  if(file && /^[0-9a-f]{8,40}\.mp3$/.test(file)){
    try{
      if(curAudio){ curAudio.pause(); curAudio=null; }
      if("speechSynthesis" in window) speechSynthesis.cancel();
      curAudio=new Audio("../audio/"+file);
      curAudio.play().catch(()=>speak(text));
      return;
    }catch{}
  }
  speak(text);
}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button.play"); if(b) play(b.dataset.audio);
});

/* ---------- 資料 + 渲染 ---------- */
let DATA=[], lessonSel="__all__", query="";
function render(){
  const q=query.trim().toLowerCase();
  const rows=DATA.filter(w=>{
    if(lessonSel!=="__all__" && !(w.lessons||[]).includes(lessonSel)) return false;
    if(!q) return true;
    return [w.dict,w.key,w.reading,w.zh,w.pos,w.ex].some(s=>String(s||"").toLowerCase().includes(q));
  });
  document.getElementById("count").textContent=`${rows.length} 字`;
  const host=document.getElementById("list");
  if(!window.vocabTableHTML){ host.innerHTML=`<p class="empty">表格元件載入失敗，請重新整理。</p>`; return; }
  if(!rows.length){ host.innerHTML=`<p class="empty">沒有符合「${esc(query.trim())}」的單字。</p>`; return; }
  host.innerHTML=window.vocabTableHTML(rows,{group:lessonSel==="__all__"});
}
document.getElementById("search").addEventListener("input",e=>{ query=e.target.value; render(); });

fetch("../data/vocab.json")
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(list=>{
    DATA=list;
    document.getElementById("loadState").remove();
    const lessons=[...new Set(DATA.flatMap(w=>w.lessons||[]))];
    if(lessons.length>1){
      const fh=document.getElementById("lessonFilter");
      fh.innerHTML=`<button class="active" data-l="__all__">全部</button>`
        +lessons.map(L=>`<button data-l="${esc(L)}">${esc(L)}</button>`).join("");
      fh.addEventListener("click",e=>{
        const b=e.target.closest("button[data-l]"); if(!b) return;
        lessonSel=b.dataset.l;
        fh.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
        render();
      });
      document.getElementById("lessonRow").hidden=false;
    }
    render();
  })
  .catch(err=>{
    console.error(err);
    document.getElementById("loadState").textContent=
      "單字資料載入失敗。請用本機伺服器（python3 -m http.server）或線上版開啟，不能直接雙擊檔案。";
  });
</script>
</body>
</html>
