<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>日文 70 單字學習器 v2</title>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb;
  --accent:#111827; --soft:#eef2f7; --good:#eaf7ef; --warn:#fff7e6; --bad:#fff0f0;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);line-height:1.75}
.app{max-width:880px;margin:0 auto;padding:14px 14px 100px}
header{position:sticky;top:0;z-index:10;background:rgba(247,247,248,.94);backdrop-filter:blur(10px);padding:12px 0 10px}
h1{font-size:1.25rem;margin:0 0 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:11px 13px;min-height:44px;font-size:15px;cursor:pointer;touch-action:manipulation}
button:focus-visible,.word:focus-visible{outline:3px solid #9ca3af;outline-offset:2px}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45}
.progress-wrap{margin-top:10px}
.progressbar{height:8px;background:#e8eaed;border-radius:999px;overflow:hidden}
.progressbar>div{height:100%;background:#3f4754;width:0}
.progresstext{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.section{display:none}.section.active{display:block}
.story-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.story-card h2{margin-top:0;font-size:1.18rem}
.story-text{font-size:18px}
.story-text p{margin:0 0 1.15em}
.word{font-weight:700;border-bottom:2px dotted #8b95a1;cursor:pointer;padding:1px 2px;border-radius:4px}.word:hover{background:#f2f4f7}
.word.hidden-word,.word.zh-mode{display:inline-block;min-width:4em;text-align:center;background:var(--soft);border-radius:6px;border-bottom:0;padding:0 5px}
.word.hidden-reading .reading{background:var(--soft);color:transparent;border-radius:4px;user-select:none}
.reading{font-weight:500}
.legend{font-size:13px;color:var(--muted);margin-bottom:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}
.sheet{width:100%;max-width:880px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:1.4rem}
.meta{color:var(--muted);font-size:14px}
.kv{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.example{background:#f8fafc;border-radius:10px;padding:10px 12px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status-btn.good.active{background:var(--good)}
.status-btn.mid.active{background:var(--warn)}
.status-btn.bad.active{background:var(--bad)}
.quiz-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.quiz-q{font-size:1.5rem;font-weight:700;margin:8px 0 16px}
.quiz-hint{color:var(--muted);min-height:28px}
.quiz-answer{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#f8fafc}
.quiz-answer.show{display:block}
.quiz-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.grammar table{width:100%;border-collapse:collapse;font-size:14px}
.grammar th,.grammar td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.small{font-size:13px;color:var(--muted)}
.reset{margin-top:14px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:16px}.stat span{font-size:12px;color:var(--muted)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tip{background:#f8fafc;border-left:4px solid #9ca3af;padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

@media (min-width:700px){
  .app{padding-top:20px}
  .story-text{font-size:19px}
  .sheet{border-radius:20px;margin-bottom:20px}
  .modal{align-items:center}
}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>日文 70 單字學習器</h1>
  <div class="toolbar" id="modeButtons">
    <button class="active" data-mode="read">閱讀</button>
    <button data-mode="reading">遮假名</button>
    <button data-mode="hide">遮單字</button>
    <button data-mode="zh">中文提示</button>
  </div>
  <div class="progress-wrap">
    <div class="progressbar" aria-label="學習進度"><div id="progressFill"></div></div>
    <div class="progresstext" id="progressText">已熟悉 0 / 70</div>
    <div class="stats">
      <div class="stat"><b id="statGood">0</b><span>記得</span></div>
      <div class="stat"><b id="statMid">0</b><span>模糊</span></div>
      <div class="stat"><b id="statBad">0</b><span>不記得</span></div>
      <div class="stat"><b id="statNew">70</b><span>未標記</span></div>
    </div>
  </div>
</header>

<div class="tabs">
  <button class="active" data-tab="stories">故事</button>
  <button data-tab="quiz">單字測驗</button>
  <button data-tab="grammar">文法</button>
</div>

<section id="stories" class="section active">
  <div class="legend">點擊粗體目標單字，可查看中文、讀音、詞性、辭書形、本文變化與例句。</div><div class="tip">建議順序：先用「遮假名」練讀音，再用「中文提示」做主動回想；真正不熟的字再進「單字測驗」集中複習。</div>
  <article class="story-card">
    <h2>篇一：父が倒れた日</h2>
    <div class="story-text" id="story1"></div>
  </article>
  <article class="story-card">
    <h2>篇二：引っ越しの一週間</h2>
    <div class="story-text" id="story2"></div>
  </article>
</section>

<section id="quiz" class="section">
  <div class="panel">
    <div class="toolbar">
      <button class="active" id="quizJpZh">日文 → 中文</button>
      <button id="quizZhJp">中文 → 日文</button>
      <button id="quizShuffle">重新洗牌</button>
    </div>
    <div class="filter-row" aria-label="測驗篩選">
      <button class="active" data-qfilter="all">全部 70 字</button>
      <button data-qfilter="weak">只複習模糊／不記得</button>
      <button data-qfilter="new">只看未標記</button>
    </div>
    <div class="small" id="filterInfo" style="margin-top:8px">目前題庫：70 字</div>
  </div>
  <div class="quiz-card">
    <div class="small" id="quizCount">1 / 70</div>
    <div class="quiz-q" id="quizQuestion"></div>
    <div class="quiz-hint" id="quizHint"></div>
    <button id="showAnswer">顯示答案</button>
    <div class="quiz-answer" id="quizAnswer"></div>
    <div class="quiz-controls">
      <button class="status-btn good" data-status="good">記得</button>
      <button class="status-btn mid" data-status="mid">有點模糊</button>
      <button class="status-btn bad" data-status="bad">不記得</button>
    </div>
    <div class="quiz-controls">
      <button id="prevQuiz">上一題</button>
      <button id="speakQuiz">播放</button>
      <button id="nextQuiz">下一題</button>
    </div>
  </div>
</section>

<section id="grammar" class="section grammar">
  <div class="story-card">
    <h2>篇一文法</h2>
    <table><thead><tr><th>文法</th><th>例句</th><th>意思</th></tr></thead><tbody id="grammar1"></tbody></table>
  </div>
  <div class="story-card">
    <h2>篇二文法</h2>
    <table><thead><tr><th>文法</th><th>例句</th><th>意思</th></tr></thead><tbody id="grammar2"></tbody></table>
  </div>
  <button class="reset" id="resetProgress">重設學習紀錄</button>
</section>
</div>

<div class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>

const S = (key,label,reading=null)=>`<span class="word" tabindex="0" role="button" data-key="${key}" data-label="${label}" data-reading="${reading||""}">${label}${reading?`<span class="reading">（${reading}）</span>`:""}</span>`;

const story1 = [
`先週（せんしゅう）の日曜日（にちようび）、家（いえ）で父（ちち）が急（きゅう）に${S("倒れる","倒れて","たおれて")}しまいました。父（ちち）の${S("様子","様子","ようす")}がおかしかったので、私（わたし）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びました。父（ちち）は自分（じぶん）の部屋（へや）の${S("隅","隅","すみ")}で倒（たお）れていました。`,

["～なければならない","注射をしなければならない","必須～"],
["～ことになる","入院することになりました","事情演變成～、被決定為～"],

["～てもらう・～てくれる","検査をしてくれました","請對方為自己做～／對方為我做～"],
["～ておく","本を棚に戻しておきました","事先做好、先保持某狀態"],

function renderStory(id, paras){ document.getElementById(id).innerHTML = paras.map(p=>`<p>${p}</p>`).join(""); }
renderStory("story1",story1); renderStory("story2",story2);

function fillGrammar(id,rows){
  document.getElementById(id).innerHTML = rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("");
}
fillGrammar("grammar1",grammar1); fillGrammar("grammar2",grammar2);

let mode="read";
function wordNormalHTML(w){
  const label=w.dataset.label, reading=w.dataset.reading;
  return `${label}${reading?`<span class="reading">（${reading}）</span>`:""}`;
}
function renderWord(w){
  const v=vocab[w.dataset.key];
  w.classList.remove("hidden-word","hidden-reading","zh-mode");
  if(w.dataset.revealed==="1" || mode==="read"){
    w.innerHTML=wordNormalHTML(w);
    return;
  }
  if(mode==="reading"){
    w.innerHTML=wordNormalHTML(w);
    w.classList.add("hidden-reading");
  } else if(mode==="hide"){
    w.textContent="＿＿＿＿";
    w.classList.add("hidden-word");
  } else if(mode==="zh"){
    w.textContent=`【${v.zh.split("、")[0]}】`;
    w.classList.add("zh-mode");
  }
}
function applyMode(){
  document.querySelectorAll(".word").forEach(w=>{w.dataset.revealed="0";renderWord(w);});
}
document.querySelectorAll("#modeButtons button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#modeButtons button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); mode=b.dataset.mode; applyMode();
});
function activateWord(w){
  if((mode==="hide"||mode==="zh") && w.dataset.revealed!=="1"){
    w.dataset.revealed="1"; renderWord(w); return;
  }
  openCard(w.dataset.key);
}
document.addEventListener("click",e=>{
  const w=e.target.closest(".word"); if(!w) return; activateWord(w);
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ") && e.target.classList.contains("word")){
    e.preventDefault(); activateWord(e.target);
  }
});

const modal=document.getElementById("modal"), sheet=document.getElementById("sheet");
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("show"); });

function speak(text){
  if(!("speechSynthesis" in window)){ alert("此瀏覽器不支援語音朗讀"); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; u.rate=.85;
  const jaVoice=speechSynthesis.getVoices().find(v=>/^ja(-|_)/i.test(v.lang));
  if(jaVoice) u.voice=jaVoice;
  speechSynthesis.speak(u);
}
function progressData(){ try{return JSON.parse(localStorage.getItem("jp70-progress")||"{}")}catch{return{}}}
function saveProgress(d){ localStorage.setItem("jp70-progress",JSON.stringify(d)); updateProgress(); }
function openCard(key){
  const v=vocab[key], d=progressData(), st=d[key]||"";
  sheet.innerHTML=`
    <button onclick="document.getElementById('modal').classList.remove('show')" style="float:right">關閉</button>
    <h3>${v.dict}</h3>
    <div class="meta">${v.reading}｜${v.pos}</div>
    <div class="kv"><strong>中文</strong><div>${v.zh}</div></div>
    <div class="kv"><strong>本文形式</strong><div>${v.form}</div></div>
    <div class="kv"><strong>故事例句</strong><div class="example">${v.ex}</div></div>
    <div class="actions">
      <button onclick="speak('${v.dict.replaceAll("'","\\'")}')">播放單字</button>
      <button onclick="speak('${v.ex.replaceAll("'","\\'")}')">播放例句</button>
    </div>
    <div class="kv"><strong>熟悉度</strong>
      <div class="actions">
        <button class="status-btn good ${st==="good"?"active":""}" onclick="setStatus('${key}','good')">記得</button>
        <button class="status-btn mid ${st==="mid"?"active":""}" onclick="setStatus('${key}','mid')">有點模糊</button>
        <button class="status-btn bad ${st==="bad"?"active":""}" onclick="setStatus('${key}','bad')">不記得</button>
      </div>
    </div>`;
  modal.classList.add("show");
}
window.speak=speak;
window.setStatus=(key,status)=>{
  const d=progressData(); d[key]=status; saveProgress(d); openCard(key);
};
function updateProgress(){
  const d=progressData(), keys=Object.keys(vocab);
  const good=keys.filter(k=>d[k]==="good").length;
  const mid=keys.filter(k=>d[k]==="mid").length;
  const bad=keys.filter(k=>d[k]==="bad").length;
  const fresh=keys.length-good-mid-bad;
  document.getElementById("progressText").textContent=`已熟悉 ${good} / ${keys.length}`;
  document.getElementById("progressFill").style.width=`${good/keys.length*100}%`;
  document.getElementById("statGood").textContent=good;
  document.getElementById("statMid").textContent=mid;
  document.getElementById("statBad").textContent=bad;
  document.getElementById("statNew").textContent=fresh;
}
updateProgress();
applyMode();

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); document.getElementById(b.dataset.tab).classList.add("active");
});

let quizKeys=Object.keys(vocab), qi=0, quizDir="jpzh", quizFilter="all";
function getFilteredKeys(){
  const d=progressData(), all=Object.keys(vocab);
  if(quizFilter==="weak") return all.filter(k=>d[k]==="mid"||d[k]==="bad");
  if(quizFilter==="new") return all.filter(k=>!d[k]);
  return all;
}
function shuffle(){
  quizKeys=[...getFilteredKeys()].sort(()=>Math.random()-.5); qi=0; renderQuiz();
}
function renderQuiz(){
  const ans=document.getElementById("quizAnswer");
  document.getElementById("filterInfo").textContent=`目前題庫：${quizKeys.length} 字`;
  if(!quizKeys.length){
    document.getElementById("quizCount").textContent="0 / 0";
    document.getElementById("quizQuestion").textContent="目前沒有符合條件的單字";
    document.getElementById("quizHint").textContent=quizFilter==="weak" ? "先把幾個單字標成「模糊」或「不記得」，就會出現在這裡。" : "目前所有單字都已經標記過。";
    ans.classList.remove("show"); ans.innerHTML="";
    return;
  }
  const k=quizKeys[qi], v=vocab[k];
  document.getElementById("quizCount").textContent=`${qi+1} / ${quizKeys.length}`;
  if(quizDir==="jpzh"){
    document.getElementById("quizQuestion").textContent=v.dict;
    document.getElementById("quizHint").textContent=`讀音：${v.reading}`;
    ans.innerHTML=`<strong>${v.zh}</strong><div class="example">${v.ex}</div>`;
  }else{
    document.getElementById("quizQuestion").textContent=v.zh.split("、")[0];
    document.getElementById("quizHint").textContent="請先回想日文，再顯示答案";
    ans.innerHTML=`<strong>${v.dict}</strong>（${v.reading}）<div class="example">${v.ex}</div>`;
  }
  ans.classList.remove("show");
  const d=progressData(),st=d[k]||"";
  document.querySelectorAll(".quiz-controls .status-btn").forEach(b=>b.classList.toggle("active",b.dataset.status===st));
}
document.getElementById("showAnswer").onclick=()=>document.getElementById("quizAnswer").classList.add("show");
document.getElementById("nextQuiz").onclick=()=>{if(!quizKeys.length)return;qi=(qi+1)%quizKeys.length;renderQuiz()};
document.getElementById("prevQuiz").onclick=()=>{if(!quizKeys.length)return;qi=(qi-1+quizKeys.length)%quizKeys.length;renderQuiz()};
document.getElementById("quizShuffle").onclick=shuffle;
document.getElementById("quizJpZh").onclick=()=>{
  quizDir="jpzh"; document.getElementById("quizJpZh").classList.add("active"); document.getElementById("quizZhJp").classList.remove("active"); renderQuiz();
};
document.getElementById("quizZhJp").onclick=()=>{
  quizDir="zhjp"; document.getElementById("quizZhJp").classList.add("active"); document.getElementById("quizJpZh").classList.remove("active"); renderQuiz();
};
document.getElementById("speakQuiz").onclick=()=>{ if(!quizKeys.length)return; const v=vocab[quizKeys[qi]]; speak(v.dict); };
document.querySelectorAll("[data-qfilter]").forEach(b=>b.onclick=()=>{
  quizFilter=b.dataset.qfilter;
  document.querySelectorAll("[data-qfilter]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  shuffle();
});
document.querySelectorAll(".quiz-controls .status-btn").forEach(b=>b.onclick=()=>{
  if(!quizKeys.length)return;
  const current=quizKeys[qi], d=progressData(); d[current]=b.dataset.status; saveProgress(d);
  if(quizFilter!=="all"){ quizKeys=getFilteredKeys(); if(qi>=quizKeys.length) qi=Math.max(0,quizKeys.length-1); }
  renderQuiz();
});
document.getElementById("resetProgress").onclick=()=>{
  if(confirm("確定要清除全部 70 個單字的學習紀錄嗎？")){localStorage.removeItem("jp70-progress");updateProgress();renderQuiz();}
};
shuffle();
</script>
