かったからです。", "hint": "八月（はちがつ）、夏休（なつやす）みに近（ちか）くの幼稚園（ようちえん）でボランティアをしました。いつか留学（りゅうがく）したいので、その前（まえ）にいろいろな経験をしたかったからです。", "file": "cb9b8d21235e6dd1.mp3", "new": false}, {"sec": "故事", "text": "初めての日、園長先生が幼稚園の中を案内してくれました。園長先生はゆっくり話してくれて、とてもわかりやすかったです。", "hint": "初（はじ）めての日（ひ）、園長先生（えんちょうせんせい）が幼稚園（ようちえん）の中（なか）を案内してくれました。園長先生（えんちょうせんせい）はゆっくり話（はな）してくれて、とてもわかりやすかったです。", "file": "30bccb352dde0a77.mp3", "new": false}, {"sec": "故事", "text": "子どもたちは元気で、教室でいつも騒いでいます。「みんな、元気すぎるなあ」と思いました。", "hint": "子（こ）どもたちは元気（げんき）で、教室（きょうしつ）でいつも騒いでいます。「みんな、元気（げんき）すぎるなあ」と思（おも）いました。", "file": "841c06e0f4d2947f.mp3", "new": false}, {"sec": "故事", "text": "ある日、大きい男の子が、小さい子をいじめていました。先生は「友達をたたいてはいけないよ」と、優しく言いました。男の子は、すぐに謝りました。", "hint": "ある日（ひ）、大（おお）きい男（おとこ）の子（こ）が、小（ちい）さい子（こ）をいじめていました。先生（せんせい）は「友達（ともだち）をたたいてはいけないよ」と、優しく言（い）いました。男（おとこ）の子（こ）は、すぐに謝りました。", "file": "0111ef483744290a.mp3", "new": false}, {"sec": "故事", "text": "午後は、火事のときの訓練でした。この幼稚園では、毎月この訓練を行います。ベルが鳴って、みんなで教室から庭に移りました。階段は危険なので、先生は「走ってはいけないよ」と言いました。", "hint": "午後（ごご）は、火事のときの訓練（くんれん）でした。この幼稚園（ようちえん）では、毎月（まいつき）この訓練（くんれん）を行います。ベルが鳴（な）って、みんなで教室（きょうしつ）から庭（にわ）に移りました。階段（かいだん）は危険なので、先生（せんせい）は「走（はし）ってはいけないよ」と言（い）いました。", "file": "44d241379d26a238.mp3", "new": false}, {"sec": "故事", "text": "訓練の後、女の子の服のボタンが取れていました。私は、すぐに付けてあげました。その子は次の日、絵を描いて私にくれました。", "hint": "訓練（くんれん）の後（あと）、女（おんな）の子（こ）の服（ふく）のボタンが取れていました。私（わたし）は、すぐに付（つ）けてあげました。その子（こ）は次（つぎ）の日（ひ）、絵（え）を描（か）いて私（わたし）にくれました。", "file": "c18ef04d9a617513.mp3", "new": false}, {"sec": "故事", "text": "十月、大学からメールが来ました。留学の試験に合格しました！来年の九月、イギリスの大学に入学します。", "hint": "十月（じゅうがつ）、大学（だいがく）からメールが来（き）ました。留学（りゅうがく）の試験（しけん）に合格しました！来年（らいねん）の九月（くがつ）、イギリスの大学（だいがく）に入学します。", "file": "d129611aff4cfcd1.mp3", "new": false}, {"sec": "故事", "text": "でも、留学にはお金がかかります。「一年は無理かな」と、私は少し心配でした。", "hint": "でも、留学（りゅうがく）にはお金（かね）がかかります。「一年（いちねん）は無理かな」と、私（わたし）は少（すこ）し心配（しんぱい）でした。", "file": "b95d08ee8d1f1105.mp3", "new": false}, {"sec": "故事", "text": "父は、イギリスから紅茶を輸入する会社に勤めています。日本の緑茶を輸出する仕事もしています。父は「お金のことは大丈夫。半年でも一年でもいいよ」と言いました。「じゃあ、一年行くことにする」と答えました。", "hint": "父（ちち）は、イギリスから紅茶（こうちゃ）を輸入する会社（かいしゃ）に勤（つと）めています。日本（にほん）の緑茶（りょくちゃ）を輸出する仕事（しごと）もしています。父（ちち）は「お金（かね）のことは大丈夫（だいじょうぶ）。半年（はんとし）でも一年（いちねん）でもいいよ」と言（い）いました。「じゃあ、一年（いちねん）行（い）くことにする」と答（こた）えました。", "file": "35c3e3b5e7b4da89.mp3", "new": false}, {"sec": "故事", "text": "次の日、佐藤先生にお礼を言いに行きました。先生に「イギリスでは、小説の翻訳を勉強するつもりです」と話しました。先生はうれしそうでした。姉にもメッセージを送りました。", "hint": "次（つぎ）の日（ひ）、佐藤先生（さとうせんせい）にお礼を言（い）いに行（い）きました。先生（せんせい）に「イギリスでは、小説（しょうせつ）の翻訳（ほんやく）を勉強（べんきょう）するつもりです」と話（はな）しました。先生（せんせい）はうれしそうでした。姉（あね）にもメッセージを送りました。", "file": "bcbc0afed351d953.mp3", "new": false}, {"sec": "故事", "text": "春から、私の毎日は随分変わりました。十二月になって、もうすぐ冬休みです。休みの間は、英語の本を読んだり、映画を見たりするつもりです。", "hint": "春（はる）から、私（わたし）の毎日（まいにち）は随分（ずいぶん）変わりました。十二月（じゅうにがつ）になって、もうすぐ冬休（ふゆやす）みです。休（やす）みの間（あいだ）は、英語（えいご）の本（ほん）を読（よ）んだり、映画（えいが）を見（み）たりするつもりです。", "file": "e0507f8c57501654.mp3", "new": false}, {"sec": "故事", "text": "「毎日、英語のニュースも聞くようにする」と決めました。「イギリスの冬は寒すぎるかな」と思いながら、準備を始めました。出発が楽しみです。", "hint": "「毎日（まいにち）、英語（えいご）のニュースも聞（き）くようにする」と決（き）めました。「イギリスの冬（ふゆ）は寒（さむ）すぎるかな」と思（おも）いながら、準備を始（はじ）めました。出発（しゅっぱつ）が楽しみです。", "file": "d12600b475006a2c.mp3", "new": false}, {"sec": "會話", "text": "合格、おめでとう。毎朝、図書館でよく勉強していましたね。", "hint": "【佐藤先生】合格（ごうかく）、おめでとう。毎朝（まいあさ）、図書館でよく勉強（べんきょう）していましたね。", "file": "105d127c4aea8540.mp3", "new": false}, {"sec": "會話", "text": "ありがとうございます。先生の詳しい説明のおかげです。", "hint": "【私】ありがとうございます。先生（せんせい）の詳しい説明（せつめい）のおかげです。", "file": "07b9521f9ecc4ee7.mp3", "new": false}, {"sec": "會話", "text": "イギリスに行っても、いつでも連絡してね。", "hint": "【真由】イギリスに行（い）っても、いつでも連絡（れんらく）してね。", "file": "93def47b3fcecd2e.mp3", "new": false}, {"sec": "會話", "text": "うん。真由に遊びに来てほしいな。", "hint": "【私】うん。真由（まゆ）に遊（あそ）びに来（き）てほしいな。", "file": "f45864776c9d9e84.mp3", "new": false}, {"sec": "會話", "text": "向こうでは、どんな本を読むつもりですか。", "hint": "【佐藤先生】向（む）こうでは、どんな本（ほん）を読むつもりですか。", "file": "bb45ab8688eeeccb.mp3", "new": false}, {"sec": "會話", "text": "イギリス文学の古い小説を、もっと翻訳してみたいです。", "hint": "【私】イギリス文学の古（ふる）い小説（しょうせつ）を、もっと翻訳してみたいです。", "file": "21efc15cfa8d8287.mp3", "new": false}, {"sec": "會話", "text": "すごいね。私も、英語の発音をもっと練習しようかな。", "hint": "【真由】すごいね。私（わたし）も、英語（えいご）の発音をもっと練習しようかな。", "file": "fe92be919ac94a8e.mp3", "new": false}, {"sec": "會話", "text": "二人とも、無理をしないで、がんばってくださいね。", "hint": "【佐藤先生】二人（ふたり）とも、無理をしないで、がんばってくださいね。", "file": "1e126109ffa4e891.mp3", "new": false}, {"sec": "故事", "text": "私は台湾から来た留学生のリンです。木曜日の昼休み、友達の美咲と教室でお弁当を食べていました。", "hint": "私（わたし）は台湾（たいわん）から来（き）た留学生（りゅうがくせい）のリンです。木曜日（もくようび）の昼休（ひるやす）み、友達（ともだち）の美咲（みさき）と教室（きょうしつ）でお弁当（べんとう）を食（た）べていました。", "file": "0dd89c226e174023.mp3", "new": false}, {"sec": "故事", "text": "「ねえ、これ、知ってる？」美咲の話では、英語の山田先生が来月休むそうです。「結婚するから！」「えっ、本当？」", "hint": "「ねえ、これ、知（し）ってる？」美咲（みさき）の話（はなし）では、英語（えいご）の山田先生（やまだせんせい）が来月（らいげつ）休（やす）むそうです。「結婚するから！」「えっ、本当？」", "file": "6cad786dcd1819ed.mp3", "new": false}, {"sec": "故事", "text": "「昔、この学校にプールがあったでしょ？そこで学生が死んだそうだよ」「やめて、怖いよ！」と言うと、美咲は笑いました。「うそ。先輩も『作り話だ』と言っていたよ」", "hint": "「昔、この学校（がっこう）にプールがあったでしょ？そこで学生（がくせい）が死んだそうだよ」「やめて、怖いよ！」と言（い）うと、美咲（みさき）は笑（わら）いました。「うそ。先輩（せんぱい）も『作（つく）り話（ばなし）だ』と言（い）っていたよ」", "file": "35554d760a3fad81.mp3", "new": false}, {"sec": "故事", "text": "美咲の弟は高校生で、学校のサッカーのチームで練習しています。私は「日曜日の大会、どうだった？」と聞きました。「一試合目は勝ったよ。でも、二試合目で負けた」", "hint": "美咲（みさき）の弟（おとうと）は高校生で、学校（がっこう）のサッカーのチームで練習（れんしゅう）しています。私（わたし）は「日曜日（にちようび）の大会、どうだった？」と聞（き）きました。「一試合目（いちしあいめ）は勝ったよ。でも、二試合目（にしあいめ）で負けた」", "file": "286e57693b8a3c24.mp3", "new": false}, {"sec": "故事", "text": "それから、美咲は少し静かになりました。「実は、おばあちゃんが入院していて……。去年、おじいちゃんが亡くなったから……」美咲は、おばあちゃんのことがとても心配でした。", "hint": "それから、美咲（みさき）は少（すこ）し静（しず）かになりました。「実（じつ）は、おばあちゃんが入院していて……。去年（きょねん）、おじいちゃんが亡くなったから……」美咲（みさき）は、おばあちゃんのことがとても心配でした。", "file": "a5cf3cce096abc04.mp3", "new": false}, {"sec": "故事", "text": "金曜日の夕方。空は朝からずっと曇りでした。窓の外では、もう風の音が聞こえます。アルバイトから帰って、テレビのニュースを見ました。", "hint": "金曜日（きんようび）の夕方。空（そら）は朝（あさ）からずっと曇りでした。窓（まど）の外（そと）では、もう風の音（おと）が聞（き）こえます。アルバイトから帰（かえ）って、テレビのニュースを見（み）ました。", "file": "e74585156ad62287.mp3", "new": false}, {"sec": "故事", "text": "ニュースによると、大きい台風が来るそうです。雨は今夜から降るでしょう。風がいちばん強くなるのは、今夜です。", "hint": "ニュースによると、大（おお）きい台風が来（く）るそうです。雨（あめ）は今夜（こんや）から降るでしょう。風（かぜ）がいちばん強くなるのは、今夜（こんや）です。", "file": "6a5e4ddde9bb82c2.mp3", "new": false}, {"sec": "故事", "text": "午後には、九州で小さい地震もあったそうです。建物が少し揺れただけで、けがをした人はいませんでした。それから、駅の近くの道で、車の事故もありました。", "hint": "午後（ごご）には、九州（きゅうしゅう）で小（ちい）さい地震もあったそうです。建物（たてもの）が少（すこ）し揺れただけで、けがをした人（ひと）はいませんでした。それから、駅（えき）の近（ちか）くの道（みち）で、車（くるま）の事故もありました。", "file": "aa01499fa4ce838d.mp3", "new": false}, {"sec": "故事", "text": "ニュースのあと、美咲から電話がありました。明日の花火大会は、中止になったそうです。私は「たぶん来週やるよね」と言いました。美咲は「明日は電車も動かないかもしれないから、気をつけてね」と言いました。", "hint": "ニュースのあと、美咲（みさき）から電話（でんわ）がありました。明日（あした）の花火（はなび）大会は、中止になったそうです。私（わたし）は「たぶん来週（らいしゅう）やるよね」と言（い）いました。美咲（みさき）は「明日（あした）は電車（でんしゃ）も動（うご）かないかもしれないから、気（き）をつけてね」と言（い）いました。", "file": "a07b4e2506d032ab.mp3", "new": false}, {"sec": "故事", "text": "電話のあと、私はコンビニで水とパンを買っておきました。スマホも、しっかり充電しておきました。これできっと大丈夫でしょう。", "hint": "電話（でんわ）のあと、私（わたし）はコンビニで水（みず）とパンを買（か）っておきました。スマホも、しっかり充電（じゅうでん）しておきました。これできっと大丈夫（だいじょうぶ）でしょう。", "file": "d9b9b42a653fc399.mp3", "new": false}, {"sec": "故事", "text": "夜九時、雨と風がもっと強くなりました。私は、帰ってからずっと開けていた窓を全部閉めました。でも、お風呂の小さい窓だけは、しっかり閉まりません。", "hint": "夜（よる）九時（くじ）、雨（あめ）と風がもっと強くなりました。私（わたし）は、帰（かえ）ってからずっと開けていた窓（まど）を全部（ぜんぶ）閉めました。でも、お風呂（ふろ）の小（ちい）さい窓（まど）だけは、しっかり閉まりません。", "file": "d23387f19e91df01.mp3", "new": false}, {"sec": "故事", "text": "ベランダの花は、夕方に部屋の中に入れておきました。でも、閉まらない窓から、少し雨が入ります。私はタオルを出して、床をふきました。", "hint": "ベランダの花（はな）は、夕方に部屋（へや）の中（なか）に入れておきました。でも、閉まらない窓（まど）から、少（すこ）し雨（あめ）が入ります。私（わたし）はタオルを出して、床（ゆか）をふきました。", "file": "b0a3ac4d56f81dfa.mp3", "new": false}, {"sec": "故事", "text": "十時ごろ、急に電気が消えました。部屋の中は真っ暗です。私はスマホのライトをつけて、窓から外を見ました。近所の家の電気も、全部消えています。", "hint": "十時（じゅうじ）ごろ、急（きゅう）に電気（でんき）が消えました。部屋（へや）の中（なか）は真（ま）っ暗（くら）です。私（わたし）はスマホのライトをつけて、窓（まど）から外（そと）を見（み）ました。近所（きんじょ）の家（いえ）の電気（でんき）も、全部（ぜんぶ）消（き）えています。", "file": "75248a84c70b9d57.mp3", "new": false}, {"sec": "故事", "text": "机の上には、水とパンが置いてあります。電池が心配なので、ライトはすぐ消しました。", "hint": "机（つくえ）の上（うえ）には、水（みず）とパンが置（お）いてあります。電池（でんち）が心配なので、ライトはすぐ消しました。", "file": "ae932d6137b20b9b.mp3", "new": false}, {"sec": "故事", "text": "その時、「バタン！」と大きい音がしました。お風呂の窓が、風で大きく開きました。「ガラスは大丈夫かな」。見に行くと、ガラスは割れていませんでした。", "hint": "その時（とき）、「バタン！」と大（おお）きい音（おと）がしました。お風呂（ふろ）の窓（まど）が、風（かぜ）で大（おお）きく開きました。「ガラスは大丈夫（だいじょうぶ）かな」。見（み）に行（い）くと、ガラスは割れていませんでした。", "file": "9fcd9ac061a5cb70.mp3", "new": false}, {"sec": "故事", "text": "十二時ごろ、やっと電気がつきました。ニュースを見ると、電車はもう全部止まっています。隣の家の車は、駐車場の奥に止めてあります。", "hint": "十二時（じゅうにじ）ごろ、やっと電気（でんき）がつきました。ニュースを見（み）ると、電車（でんしゃ）はもう全部（ぜんぶ）止まっています。隣（となり）の家（いえ）の車（くるま）は、駐車場（ちゅうしゃじょう）の奥（おく）に止めてあります。", "file": "278f101632c43bfc.mp3", "new": false}, {"sec": "故事", "text": "次の朝、雨はもうやんでいました。空はきれいに晴れています。「町はどうなったかな」と思って、九時ごろ家を出ました。", "hint": "次（つぎ）の朝（あさ）、雨（あめ）はもうやんでいました。空（そら）はきれいに晴れています。「町（まち）はどうなったかな」と思（おも）って、九時（くじ）ごろ家（いえ）を出ました。", "file": "73e49f88819b4550.mp3", "new": false}, {"sec": "故事", "text": "公園の前では、大きい木が倒れていました。道には、木の枝がたくさん落ちています。パン屋の看板も壊れて、店の前は泥で汚れていました。", "hint": "公園（こうえん）の前（まえ）では、大（おお）きい木（き）が倒れていました。道（みち）には、木（き）の枝（えだ）がたくさん落ちています。パン屋（や）の看板（かんばん）も壊れて、店（みせ）の前（まえ）は泥（どろ）で汚れていました。", "file": "ab7b8bb41faae839.mp3", "new": false}, {"sec": "故事", "text": "パン屋のドアには、紙が貼ってあります。でも、字は雨でよく見えません。店の中も暗いです。今日はお休みらしいです。", "hint": "パン屋（や）のドアには、紙（かみ）が貼（は）ってあります。でも、字（じ）は雨（あめ）でよく見（み）えません。店（みせ）の中（なか）も暗（くら）いです。今日（きょう）はお休（やす）みらしいです。", "file": "9c91cbc01b6a1182.mp3", "new": false}, {"sec": "故事", "text": "公園には、近所の人が集まっていました。みんなで、落ちた枝を集めています。私も掃除を始めました。", "hint": "公園（こうえん）には、近所（きんじょ）の人（ひと）が集まっていました。みんなで、落（お）ちた枝（えだ）を集めています。私（わたし）も掃除（そうじ）を始めました。", "file": "9acc6cbfae8933f1.mp3", "new": false}, {"sec": "故事", "text": "一時間ぐらいで、公園はきれいになりました。公園の入口の紙には、「日曜日　フリーマーケット」と書いてありました。朝十時に始まります。入るのは無料です。", "hint": "一時間（いちじかん）ぐらいで、公園（こうえん）はきれいになりました。公園（こうえん）の入口（いりぐち）の紙（かみ）には、「日曜日（にちようび）　フリーマーケット」と書（か）いてありました。朝（あさ）十時（じゅうじ）に始まります。入（はい）るのは無料です。", "file": "50e2a2864e5c0325.mp3", "new": false}, {"sec": "故事", "text": "私はすぐ美咲にメッセージを送りました。それから、「暑くならないうちに帰ろう」と思って、家に戻りました。", "hint": "私（わたし）はすぐ美咲（みさき）にメッセージを送（おく）りました。それから、「暑（あつ）くならないうちに帰（かえ）ろう」と思（おも）って、家（いえ）に戻（もど）りました。", "file": "54a7a77fbab37c8e.mp3", "new": false}, {"sec": "故事", "text": "日曜日は、美咲と二人でフリーマーケットへ行きます。台風の片付けで、フリーマーケットは十一時から始まることになりました。美咲の雑誌によると、駅の前に、新しいカフェができたらしいです。「帰りに行ってみよう」", "hint": "日曜日（にちようび）は、美咲（みさき）と二人（ふたり）でフリーマーケットへ行（い）きます。台風（たいふう）の片付（かたづ）けで、フリーマーケットは十一時（じゅういちじ）から始（はじ）まることになりました。美咲（みさき）の雑誌（ざっし）によると、駅（えき）の前（まえ）に、新（あたら）しいカフェができたらしいです。「帰（かえ）りに行（い）ってみよう」", "file": "87a18f666760aeca.mp3", "new": false}, {"sec": "故事", "text": "公園へ行くバスは、あと三分で来ます。「急いで！」二人で走って、なんとかバスに間に合いました。", "hint": "公園（こうえん）へ行（い）くバスは、あと三分（さんぷん）で来（き）ます。「急いで！」二人（ふたり）で走（はし）って、なんとかバスに間に合いました。", "file": "297629457914a2c8.mp3", "new": false}, {"sec": "故事", "text": "バスの中は、とても混んでいました。席は一つもありません。「台風のあとだから、みんな出かけているかもしれないね」でも、二つ目のバス停で人がたくさん降りて、バスはすきました。", "hint": "バスの中（なか）は、とても混んでいました。席は一（ひと）つもありません。「台風（たいふう）のあとだから、みんな出（で）かけているかもしれないね」でも、二（ふた）つ目（め）のバス停（てい）で人（ひと）がたくさん降（お）りて、バスはすきました。", "file": "359d56e876506a8e.mp3", "new": false}, {"sec": "故事", "text": "美咲は、フリーマーケットでかわいいストラップを探しています。店の値札には、「三十パーセント引き」と書いてあります。「もし二つ買ったら、もっと安くしますよ」と店の人が言いました。", "hint": "美咲（みさき）は、フリーマーケットでかわいいストラップを探しています。店（みせ）の値札（ねふだ）には、「三十（さんじゅっ）パーセント引き」と書（か）いてあります。「もし二（ふた）つ買（か）ったら、もっと安（やす）くしますよ」と店（みせ）の人（ひと）が言（い）いました。", "file": "6e5b1f4cb079e0bc.mp3", "new": false}, {"sec": "故事", "text": "お昼には、もう人でいっぱい。「混まないうちに、カフェに行こう」私たちは雑誌のカフェに行ってみました。そこで、アルバイト先の健太先輩に会いました。", "hint": "お昼（ひる）には、もう人（ひと）でいっぱい。「混まないうちに、カフェに行（い）こう」私（わたし）たちは雑誌（ざっし）のカフェに行（い）ってみました。そこで、アルバイト先（さき）の健太（けんた）先輩（せんぱい）に会（あ）いました。", "file": "143888a3ca7aa21f.mp3", "new": false}, {"sec": "會話", "text": "あれ、リンさん？こんにちは。", "hint": "【健太】あれ、リンさん？こんにちは。", "file": "d62e9fe6fa369eae.mp3", "new": false}, {"sec": "會話", "text": "健太先輩！こちらは友達の美咲です。フリーマーケットの帰りです。", "hint": "【私】健太（けんた）先輩（せんぱい）！こちらは友達（ともだち）の美咲（みさき）です。フリーマーケットの帰（かえ）りです。", "file": "064abee735eb591c.mp3", "new": false}, {"sec": "會話", "text": "台風の夜、大丈夫だった？店長の話では、店のガラスが割れたそうだよ。", "hint": "【健太】台風（たいふう）の夜（よる）、大丈夫（だいじょうぶ）だった？店長（てんちょう）の話（はなし）では、店（みせ）のガラスが割れたそうだよ。", "file": "e1fbd447a6afc82e.mp3", "new": false}, {"sec": "會話", "text": "本当ですか。私の部屋は電気が消えて、少し怖かったです。", "hint": "【私】本当ですか。私（わたし）の部屋（へや）は電気（でんき）が消えて、少（すこ）し怖かったです。", "file": "3fa21bb521c96f9a.mp3", "new": false}, {"sec": "會話", "text": "ガラスを直すから、明日のアルバイトは休むことになったよ。店長が「直す人が明日来る」と言っていた。", "hint": "【健太】ガラスを直（なお）すから、明日（あした）のアルバイトは休（やす）むことになったよ。店長（てんちょう）が「直（なお）す人（ひと）が明日（あした）来（く）る」と言（い）っていた。", "file": "490eb1c5fdcd76db.mp3", "new": false}, {"sec": "會話", "text": "先輩、よかったら一緒にここのケーキを食べてみませんか。", "hint": "【美咲】先輩（せんぱい）、よかったら一緒（いっしょ）にここのケーキを食（た）べてみませんか。", "file": "e67d05897ac67e7f.mp3", "new": false}, {"sec": "會話", "text": "いいね。でも、この店は人気があるから、席があるかな。", "hint": "【健太】いいね。でも、この店（みせ）は人気（にんき）があるから、席があるかな。", "file": "6d2e267e64b0bb1c.mp3", "new": false}, {"sec": "會話", "text": "大丈夫です。窓のそばに、大きいテーブルがありますよ。", "hint": "【私】大丈夫（だいじょうぶ）です。窓（まど）のそばに、大（おお）きいテーブルがありますよ。", "file": "e5b855613147b63d.mp3", "new": false}, {"sec": "故事", "text": "私は台湾の大学生のリンです。冬休みに、フリープランで日本へ行きました。最初の四日間は、友達のさくらの家に泊まります。さくらの家は田舎にあります。", "hint": "私（わたし）は台湾（たいわん）の大学生（だいがくせい）のリンです。冬休（ふゆやす）みに、フリープランで日本（にほん）へ行（い）きました。最初（さいしょ）の四日間（よっかかん）は、友達（ともだち）のさくらの家（いえ）に泊（と）まります。さくらの家（いえ）は田舎にあります。", "file": "6433fee25276b990.mp3", "new": true}, {"sec": "故事", "text": "空港では、たくさんの人が並んでいました。私もパスポートを出して、順番を待ちました。外は思ったより寒かったです。", "hint": "空港（くうこう）では、たくさんの人（ひと）が並んでいました。私（わたし）もパスポートを出（だ）して、順番（じゅんばん）を待（ま）ちました。外（そと）は思ったより寒（さむ）かったです。", "file": "30fe35429044dd4a.mp3", "new": true}, {"sec": "故事", "text": "空港から電車で東京へ。東京の駅は路線がたくさんあって、とても複雑です。案内の字も小さくて、困りました。でも、日本の交通は本当に便利です。", "hint": "空港（くうこう）から電車（でんしゃ）で東京（とうきょう）へ。東京（とうきょう）の駅（えき）は路線（ろせん）がたくさんあって、とても複雑です。案内（あんない）の字も小（ちい）さくて、困（こま）りました。でも、日本（にほん）の交通は本当（ほんとう）に便利です。", "file": "73e3ea83f717d734.mp3", "new": true}, {"sec": "故事", "text": "田舎の駅からさくらの家までは遠いので、お父さんが車で迎えに来てくれました。お父さんは「シートベルトをしてね」と言いました。「日本では、後ろの席でもしなければならないよ。」", "hint": "田舎（いなか）の駅（えき）からさくらの家（いえ）までは遠（とお）いので、お父（とう）さんが車（くるま）で迎（むか）えに来（き）てくれました。お父（とう）さんは「シートベルトをしてね」と言（い）いました。「日本（にほん）では、後（うし）ろの席（せき）でもしなければならないよ。」", "file": "2912c56a23fe9336.mp3", "new": true}, {"sec": "故事", "text": "一時間ぐらい走って、お父さんは家の前に車を止めました。周りは山と畑だけ。外の空気は冷たくて、とてもきれいです。「ここはお店も駅も遠くて、不便だよ」とさくらが笑いました。でも私は、静かでいい所だと思いました。", "hint": "一時間（いちじかん）ぐらい走（はし）って、お父（とう）さんは家（いえ）の前（まえ）に車（くるま）を止めました。周（まわ）りは山（やま）と畑（はたけ）だけ。外（そと）の空気は冷（つめ）たくて、とてもきれいです。「ここはお店（みせ）も駅（えき）も遠（とお）くて、不便だよ」とさくらが笑（わら）いました。でも私（わたし）は、静（しず）かでいい所（ところ）だと思（おも）いました。", "file": "0e6b63480b36f6f3.mp3", "new": true}, {"sec": "故事", "text": "さくらの家は、古い木の家です。玄関には、夏の風鈴がまだかかっていました。私がそっと触ってみたら、きれいな音がしました。さくらがドアを開けて、「どうぞ」と言いました。", "hint": "さくらの家（いえ）は、古（ふる）い木（き）の家（いえ）です。玄関には、夏（なつ）の風鈴がまだかかっていました。私（わたし）がそっと触ってみたら、きれいな音（おと）がしました。さくらがドアを開（あ）けて、「どうぞ」と言（い）いました。", "file": "72018b7c998d60f4.mp3", "new": true}, {"sec": "故事", "text": "部屋の真ん中には、こたつがあります。「スイッチを入れると、すぐ暖かくなるよ。」足を入れて、私は「もう出たくない」と思いました。", "hint": "部屋（へや）の真（ま）ん中（なか）には、こたつがあります。「スイッチを入（い）れると、すぐ暖（あたた）かくなるよ。」足（あし）を入（い）れて、私（わたし）は「もう出（で）たくない」と思（おも）いました。", "file": "8b7114c0b138bc59.mp3", "new": true}, {"sec": "故事", "text": "夕方、お母さんがスイッチを押すと、電気がつきました。お母さんは湯たんぽにお湯を入れて、ふたを回して閉めました。「熱いから、まだ触ってはいけないよ。」湯たんぽは、そのまま布団の中へ。", "hint": "夕方（ゆうがた）、お母（かあ）さんがスイッチを押（お）すと、電気がつきました。お母（かあ）さんは湯たんぽにお湯を入（い）れて、ふたを回して閉（し）めました。「熱（あつ）いから、まだ触（さわ）ってはいけないよ。」湯（ゆ）たんぽは、そのまま布団の中（なか）へ。", "file": "a8e582b790a5c8ee.mp3", "new": true}, {"sec": "故事", "text": "夜、さくらのお兄さんの翔太さんは、テレビの番組を見ていました。隣の部屋では、お父さんがギターを弾いています。「お父さん、うるさいよ！」と翔太さんが言って、みんなで笑いました。", "hint": "夜（よる）、さくらのお兄（にい）さんの翔太（しょうた）さんは、テレビの番組を見（み）ていました。隣（となり）の部屋（へや）では、お父（とう）さんがギターを弾いています。「お父（とう）さん、うるさいよ！」と翔太（しょうた）さんが言（い）って、みんなで笑（わら）いました。", "file": "1bca0cfe304e1f03.mp3", "new": true}, {"sec": "故事", "text": "寝る前に、さくらが「明日、ポケットに入れてね」とカイロをくれました。窓の外は雲が多くて、雪が降りそうです。", "hint": "寝（ね）る前（まえ）に、さくらが「明日（あした）、ポケットに入（い）れてね」とカイロをくれました。窓（まど）の外（そと）は雲（くも）が多（おお）くて、雪（ゆき）が降（ふ）りそうです。", "file": "f5f4a6933a9d8f34.mp3", "new": true}, {"sec": "故事", "text": "次の日、さくらと町のうどん屋へ行きました。店の前に立つと、ドアが開きました。入り口には、食券の機械があります。", "hint": "次（つぎ）の日（ひ）、さくらと町（まち）のうどん屋（や）へ行（い）きました。店（みせ）の前（まえ）に立（た）つと、ドアが開きました。入（い）り口（ぐち）には、食券の機械（きかい）があります。", "file": "e69789aedfe1e7ca.mp3", "new": true}, {"sec": "故事", "text": "「食券の買い方が分からない」と言うと、さくらが「簡単だよ。まず、お金を入れて」と教えてくれました。機械には、うどんやそばのボタンがたくさんあります。きつねうどんのボタンを押すと、食券が出てきました。", "hint": "「食券（しょっけん）の買（か）い方（かた）が分（わ）からない」と言（い）うと、さくらが「簡単（かんたん）だよ。まず、お金（かね）を入（い）れて」と教（おし）えてくれました。機械（きかい）には、うどんやそばのボタンがたくさんあります。きつねうどんのボタンを押（お）すと、食券（しょっけん）が出てきました。", "file": "fd0073fccbd0faba.mp3", "new": true}, {"sec": "故事", "text": "でも、お釣りが出てきません。もう少し待った方がいいかどうか、分かりません。「このレバーを下げると、出てくるよ。」レバーを下げると、百円玉が二枚出てきました。", "hint": "でも、お釣りが出（で）てきません。もう少（すこ）し待（ま）った方（ほう）がいいかどうか、分（わ）かりません。「このレバーを下（さ）げると、出（で）てくるよ。」レバーを下（さ）げると、百円玉（ひゃくえんだま）が二枚（にまい）出（で）てきました。", "file": "07594a0dd64f4840.mp3", "new": true}, {"sec": "故事", "text": "席に座って、二人で「いただきます」。私はきつねうどん、さくらはそば。テーブルには唐辛子の瓶があります。「辛いから、たくさん入れてはいけないよ。」さくらのそばもおいしそうだったので、少し分けてもらいました。", "hint": "席（せき）に座（すわ）って、二人（ふたり）で「いただきます」。私（わたし）はきつねうどん、さくらはそば。テーブルには唐辛子の瓶（びん）があります。「辛（から）いから、たくさん入（い）れてはいけないよ。」さくらのそばもおいしそうだったので、少（すこ）し分けてもらいました。", "file": "626eb3663f199a3f.mp3", "new": true}, {"sec": "故事", "text": "食べ終わって、店の人に「ごちそうさまでした」と言いました。一杯五百円。安くて、とてもおいしいうどんでした。", "hint": "食（た）べ終（お）わって、店（みせ）の人（ひと）に「ごちそうさまでした」と言（い）いました。一杯（いっぱい）五百円（ごひゃくえん）。安（やす）くて、とてもおいしいうどんでした。", "file": "154b802375205a07.mp3", "new": true}, {"sec": "故事", "text": "三日目の朝、さくらは鏡の前で化粧していました。今日は二人で都会へ遊びに行きます。電車で二時間。駅はとても混んでいました。", "hint": "三日目（みっかめ）の朝（あさ）、さくらは鏡（かがみ）の前（まえ）で化粧していました。今日（きょう）は二人（ふたり）で都会へ遊（あそ）びに行（い）きます。電車（でんしゃ）で二時間（にじかん）。駅（えき）はとても混んでいました。", "file": "ed639fe27264d13c.mp3", "new": true}, {"sec": "故事", "text": "最初に、大きい神社へ行きました。ちょうど結婚式をしていて、白い着物の人が歩いていました。写真を撮ってもいいかどうか、さくらに聞きました。「遠くからならいいと思うよ。」", "hint": "最初（さいしょ）に、大（おお）きい神社（じんじゃ）へ行（い）きました。ちょうど結婚式をしていて、白（しろ）い着物（きもの）の人（ひと）が歩（ある）いていました。写真（しゃしん）を撮ってもいいかどうか、さくらに聞（き）きました。「遠（とお）くからならいいと思（おも）うよ。」", "file": "e152c2ed0bc1d6e6.mp3", "new": true}, {"sec": "故事", "text": "それから、おしゃれな店が多い通りを歩きました。歩いている人のファッションはみんな違っていて、自由です。私はデザインがかわいいセーターを見つけました。でも、セール中なのに、一万円もしました。", "hint": "それから、おしゃれな店（みせ）が多（おお）い通（とお）りを歩（ある）きました。歩（ある）いている人（ひと）のファッションはみんな違（ちが）っていて、自由です。私（わたし）はデザインがかわいいセーターを見（み）つけました。でも、セール中（ちゅう）なのに、一万円（いちまんえん）もしました。", "file": "1f7a54130a22c770.mp3", "new": true}, {"sec": "故事", "text": "お昼はファストフードの店でハンバーガー。店の中は外国の人が多くて、さくらは「外国から来る人が増えているね」と言いました。「兄も『田舎の店にも外国のお客さんが来る』と言っていたよ。」", "hint": "お昼（ひる）はファストフードの店（みせ）でハンバーガー。店（みせ）の中（なか）は外国（がいこく）の人（ひと）が多（おお）くて、さくらは「外国（がいこく）から来（く）る人（ひと）が増えているね」と言（い）いました。「兄（あに）も『田舎（いなか）の店（みせ）にも外国（がいこく）のお客（きゃく）さんが来（く）る』と言（い）っていたよ。」", "file": "5ca882d5ea0839d9.mp3", "new": true}, {"sec": "故事", "text": "帰る前に、さくらは美容院で髪を切りました。「短い髪も似合うと思うよ」と私は言いました。一日中歩いたのに、帰りの電車でもずっと話していました。", "hint": "帰（かえ）る前（まえ）に、さくらは美容院（びよういん）で髪（かみ）を切りました。「短（みじか）い髪（かみ）も似合（にあ）うと思（おも）うよ」と私（わたし）は言（い）いました。一日中（いちにちじゅう）歩（ある）いたのに、帰（かえ）りの電車（でんしゃ）でもずっと話（はな）していました。", "file": "69f765e7d6b2b3b7.mp3", "new": true}, {"sec": "故事", "text": "四日目の朝、翔太さんはバイクでアルバイトに出かけました。ヘルメットもきちんとかぶっています。「バイクに乗るときは、ヘルメットをかぶらなければならないからね。」", "hint": "四日目（よっかめ）の朝（あさ）、翔太（しょうた）さんはバイクでアルバイトに出（で）かけました。ヘルメットもきちんとかぶっています。「バイクに乗（の）るときは、ヘルメットをかぶらなければならないからね。」", "file": "0ac14d97cadc2c54.mp3", "new": true}, {"sec": "故事", "text": "翔太さんは駅前のカフェで働いています。時給は千百円。黒い制服を着て働きます。「カフェでいろいろなことを経験したよ」と言っていました。", "hint": "翔太（しょうた）さんは駅前（えきまえ）のカフェで働（はたら）いています。時給は千百円（せんひゃくえん）。黒（くろ）い制服を着（き）て働（はたら）きます。「カフェでいろいろなことを経験したよ」と言（い）っていました。", "file": "bfa08c77752a1b0d.mp3", "new": true}, {"sec": "故事", "text": "午後は、さくらと美術館へ行きました。入場料は大人八百円です。「ほら、見て。」入り口に「高校生以下と大学生は無料」と書いてあります。", "hint": "午後（ごご）は、さくらと美術館（びじゅつかん）へ行（い）きました。入場料は大人（おとな）八百円（はっぴゃくえん）です。「ほら、見（み）て。」入（い）り口（ぐち）に「高校生（こうこうせい）以下と大学生（だいがくせい）は無料（むりょう）」と書（か）いてあります。", "file": "d1a5ef2fdcd868dc.mp3", "new": true}, {"sec": "故事", "text": "「じゃあ、私たちは払わなくてもいいね」とさくらが言いました。でも、受付の人が「学生の身分証を見せてください」と言いました。台湾の学生証でも、料金はかかりませんでした。", "hint": "「じゃあ、私（わたし）たちは払（はら）わなくてもいいね」とさくらが言（い）いました。でも、受付（うけつけ）の人（ひと）が「学生（がくせい）の身分証を見（み）せてください」と言（い）いました。台湾（たいわん）の学生証（がくせいしょう）でも、料金はかかりませんでした。", "file": "15e9e64d4f8ddb5c.mp3", "new": true}, {"sec": "故事", "text": "中に入ると、さくらが小さい声で「写真は撮ってはいけないよ」と言いました。でも、庭では写真が撮れます。「ここはいつでも静かで、ゆっくり見ることができるよ。」明日はもう、東京のホテルへ行く日です。", "hint": "中（なか）に入（はい）ると、さくらが小（ちい）さい声（こえ）で「写真（しゃしん）は撮（と）ってはいけないよ」と言（い）いました。でも、庭（にわ）では写真（しゃしん）が撮（と）れます。「ここはいつでも静（しず）かで、ゆっくり見（み）ることができるよ。」明日（あした）はもう、東京（とうきょう）のホテルへ行（い）く日（ひ）です。", "file": "a9879d0b309f42d9.mp3", "new": true}, {"sec": "會話", "text": "リンさん、田舎の生活はどうだった？", "hint": "【お父さん】リンさん、田舎（いなか）の生活（せいかつ）はどうだった？", "file": "c199f57a6a3dce44.mp3", "new": true}, {"sec": "會話", "text": "空気がきれいで、とてもいい所だと思います。", "hint": "【私】空気がきれいで、とてもいい所（ところ）だと思（おも）います。", "file": "45de2acbc5b91a10.mp3", "new": true}, {"sec": "會話", "text": "でも、お店も駅も遠くて、不便でしょう？", "hint": "【さくら】でも、お店（みせ）も駅（えき）も遠（とお）くて、不便でしょう？", "file": "4e9967160ed81578.mp3", "new": true}, {"sec": "會話", "text": "うーん。でも、夏は風鈴の音がきれいで、涼しいよ。", "hint": "【お父さん】うーん。でも、夏（なつ）は風鈴の音（おと）がきれいで、涼（すず）しいよ。", "file": "a91d6f4571db1a85.mp3", "new": true}, {"sec": "會話", "text": "そうなんですか。夏にも来てみたいです。", "hint": "【私】そうなんですか。夏（なつ）にも来（き）てみたいです。", "file": "9346d7aae137c4b4.mp3", "new": true}, {"sec": "會話", "text": "あれ？お父さん、去年の夏は『暑くて虫が多い』と言っていたよ。", "hint": "【さくら】あれ？お父（とう）さん、去年（きょねん）の夏（なつ）は『暑（あつ）くて虫（むし）が多（おお）い』と言（い）っていたよ。", "file": "decebb778c0c668c.mp3", "new": true}, {"sec": "會話", "text": "それでも、都会より田舎のほうがいいよ。リンさんはどう思う？", "hint": "【お父さん】それでも、都会より田舎（いなか）のほうがいいよ。リンさんはどう思（おも）う？", "file": "4184b0a8115d57ec.mp3", "new": true}, {"sec": "會話", "text": "私もそう思います。……それに今は、おなかがいっぱいで、こたつから出られません。", "hint": "【私】私（わたし）もそう思（おも）います。……それに今（いま）は、おなかがいっぱいで、こたつから出（で）られません。", "file": "01d43fda109e9279.mp3", "new": true}, {"sec": "基礎", "text": "一杯", "hint": "一杯＝いっぱい", "file": "ad8e571ba19336b7.mp3", "new": false}, {"sec": "基礎", "text": "二杯", "hint": "二杯＝にはい", "file": "212676823cbef1e8.mp3", "new": false}, {"sec": "基礎", "text": "三杯", "hint": "三杯＝さんばい", "file": "6d9a66ff5148eba1.mp3", "new": false}, {"sec": "基礎", "text": "四杯", "hint": "四杯＝よんはい", "file": "898cdc11fe27b92b.mp3", "new": false}, {"sec": "基礎", "text": "五杯", "hint": "五杯＝ごはい", "file": "20cf7953b006af5d.mp3", "new": false}, {"sec": "基礎", "text": "六杯", "hint": "六杯＝ろっぱい", "file": "c79c2a2b34da6c0c.mp3", "new": false}, {"sec": "基礎", "text": "七杯", "hint": "七杯＝ななはい", "file": "9c4a0812352fe2b5.mp3", "new": false}, {"sec": "基礎", "text": "八杯", "hint": "八杯＝はっぱい", "file": "7d73926f12a5c2c4.mp3", "new": false}, {"sec": "基礎", "text": "九杯", "hint": "九杯＝きゅうはい", "file": "18fb05deb9c7bc34.mp3", "new": false}, {"sec": "基礎", "text": "十杯", "hint": "十杯＝じゅっぱい", "file": "b1d5cd3f67a02d8d.mp3", "new": false}, {"sec": "基礎", "text": "何杯", "hint": "何杯＝なんばい", "file": "bd98c80fb7763b7c.mp3", "new": false}, {"sec": "基礎", "text": "父", "hint": "父＝ちち", "file": "ac8581b7b3ecaf00.mp3", "new": false}, {"sec": "基礎", "text": "母", "hint": "母＝はは", "file": "b776b1e1cfad52c0.mp3", "new": false}, {"sec": "基礎", "text": "兄", "hint": "兄＝あに", "file": "e59925dfb2a2e597.mp3", "new": false}, {"sec": "基礎", "text": "姉", "hint": "姉＝あね", "file": "c3dc01141942c483.mp3", "new": false}, {"sec": "基礎", "text": "お父さん", "hint": "お父さん＝おとうさん", "file": "65132efc2e01cd2a.mp3", "new": false}, {"sec": "基礎", "text": "お母さん", "hint": "お母さん＝おかあさん", "file": "dd4a8debe863ac25.mp3", "new": false}, {"sec": "基礎", "text": "お兄さん", "hint": "お兄さん＝おにいさん", "file": "b4a44a38ec315e5e.mp3", "new": false}, {"sec": "基礎", "text": "お姉さん", "hint": "お姉さん＝おねえさん", "file": "379e83bf35da042c.mp3", "new": false}, {"sec": "基礎", "text": "お兄ちゃん", "hint": "お兄ちゃん＝おにいちゃん", "file": "e01e5b9616bf79f4.mp3", "new": false}, {"sec": "基礎", "text": "お姉ちゃん", "hint": "お姉ちゃん＝おねえちゃん", "file": "e1e72f32a52a8697.mp3", "new": false}, {"sec": "基礎例句", "text": "コーヒーを一杯ください。", "hint": "コーヒーを一杯ください。（念作：コーヒーをいっぱいください。）", "file": "9dae7030a423c008.mp3", "new": false}, {"sec": "基礎例句", "text": "水を二杯飲みました。", "hint": "水を二杯飲みました。（念作：水をにはい飲みました。）", "file": "e23ecde238f71d12.mp3", "new": false}, {"sec": "基礎例句", "text": "毎朝コーヒーを三杯飲みます。", "hint": "毎朝コーヒーを三杯飲みます。（念作：毎朝コーヒーをさんばい飲みます。）", "file": "10de5721e8c438ba.mp3", "new": false}, {"sec": "基礎例句", "text": "ご飯を何杯食べましたか。", "hint": "ご飯を何杯食べましたか。（念作：ご飯をなんばい食べましたか。）", "file": "8162f827247b3d28.mp3", "new": false}, {"sec": "基礎例句", "text": "お茶をもう一杯いかがですか。", "hint": "お茶をもう一杯いかがですか。（念作：お茶をもういっぱいいかがですか。）", "file": "bc8e976e5abff0ac.mp3", "new": false}, {"sec": "基礎例句", "text": "今日は水を十杯飲みました。", "hint": "今日は水を十杯飲みました。（念作：今日は水をじゅっぱい飲みました。）", "file": "12ea35b70173a2d4.mp3", "new": false}, {"sec": "基礎例句", "text": "何杯飲みましたか。", "hint": "何杯飲みましたか。（念作：なんばい飲みましたか。）", "file": "38f38a8dc1f41fb8.mp3", "new": false}, {"sec": "基礎例句", "text": "父は会社員です。", "hint": "父は会社員です。", "file": "2c1625aa2fb4757d.mp3", "new": false}, {"sec": "基礎例句", "text": "母は料理が上手です。", "hint": "母は料理が上手です。", "file": "d9b01e5345132bf6.mp3", "new": false}, {"sec": "基礎例句", "text": "田中さんのお父さんは先生ですか。", "hint": "田中さんのお父さんは先生ですか。", "file": "14917a6989463d67.mp3", "new": false}, {"sec": "基礎例句", "text": "お母さんはお元気ですか。", "hint": "お母さんはお元気ですか。", "file": "ec720630caaae9c3.mp3", "new": false}, {"sec": "基礎例句", "text": "兄は大学生です。", "hint": "兄は大学生です。", "file": "053b78a49fced26c.mp3", "new": false}, {"sec": "基礎例句", "text": "姉は東京に住んでいます。", "hint": "姉は東京に住んでいます。", "file": "c84a86dc551a023f.mp3", "new": false}, {"sec": "基礎例句", "text": "山田さんのお兄さんは背が高いですね。", "hint": "山田さんのお兄さんは背が高いですね。", "file": "91ffc4838ec64495.mp3", "new": false}, {"sec": "基礎例句", "text": "お姉さんはどこに住んでいますか。", "hint": "お姉さんはどこに住んでいますか。", "file": "188da8e5899d1d1c.mp3", "new": false}, {"sec": "基礎例句", "text": "お母さん、ただいま！", "hint": "お母さん、ただいま！", "file": "29242c3b05432e25.mp3", "new": false}, {"sec": "基礎例句", "text": "お兄ちゃん、ちょっと来て。", "hint": "お兄ちゃん、ちょっと来て。", "file": "f8c6e32f7f896885.mp3", "new": false}, {"sec": "基礎例句", "text": "お父さん、おかえりなさい。", "hint": "お父さん、おかえりなさい。", "file": "747e40ee8b75769a.mp3", "new": false}, {"sec": "基礎例句", "text": "お姉ちゃん、これ見て！", "hint": "お姉ちゃん、これ見て！", "file": "2adc4ad65f40a046.mp3", "new": false}];
const N_NEW = 139, LAST_AT = "2026-10-06";
const KEY = "audiocheck-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
// 有「本次新增」就預設只列那批（課多了以後全部一起聽不完），沒有就列全部
let filter = N_NEW ? "new" : "all";
document.getElementById("newnote").textContent = N_NEW
  ? "本次新增 "+N_NEW+" 段（"+LAST_AT+" 產生）。先聽這批就好；其餘的之前已經聽過。"
  : "沒有「本次新增」清單（generate-audio.py 沒產新檔），顯示全部。";
let audio = new Audio();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function play(f){ audio.pause(); audio = new Audio("audio/"+f); audio.play(); }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let ok=0,ng=0;
  ITEMS.forEach((it,i)=>{
    const st = state[it.file];
    if(st==="ok") ok++; if(st==="ng") ng++;
    if(filter==="new" && !it.new) return;
    if(filter==="todo" && st) return;
    if(filter==="ng" && st!=="ng") return;
    const row = document.createElement("div");
    row.className = "row" + (st==="ok"?" done-ok":st==="ng"?" done-ng":"");
    row.innerHTML =
      '<span class="sec">'+it.sec+'</span>'+
      '<div class="grow"><div class="jp" lang="ja">'+esc(it.text)+'</div>'+
      '<div class="hint">應讀：'+esc(it.hint)+'</div></div>'+
      '<div class="acts">'+
      '<button data-p="'+i+'">▶</button>'+
      '<button data-ok="'+i+'" class="'+(st==="ok"?"on-ok":"")+'">✓</button>'+
      '<button data-ng="'+i+'" class="'+(st==="ng"?"on-ng":"")+'">✗</button>'+
      '</div>';
    list.appendChild(row);
  });
  document.getElementById("prog").textContent =
    "　已檢查 "+(ok+ng)+" / "+ITEMS.length+"（讀錯 "+ng+"）";
  const bad = ITEMS.filter(it=>state[it.file]==="ng");
  document.getElementById("out").value = bad.length
    ? bad.map(it=> it.sec==="單字"
        ? '"'+it.text+'": "'+it.hint+'",'
        : '// '+it.sec+'：'+it.text+'（應讀 '+it.hint+'）\n"": "",'
      ).join("\n")
    : "（目前沒有標記讀錯的）";
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

document.getElementById("list").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.p!=null) play(ITEMS[b.dataset.p].file);
  if(b.dataset.ok!=null){ const f=ITEMS[b.dataset.ok].file; state[f]=state[f]==="ok"?undefined:"ok"; save(); render(); }
  if(b.dataset.ng!=null){ const f=ITEMS[b.dataset.ng].file; state[f]=state[f]==="ng"?undefined:"ng"; save(); render(); }
});
document.querySelector(".bar").addEventListener("click",e=>{
  if(e.target.dataset.f){ filter=e.target.dataset.f; render(); }
  if(e.target.id==="reset" && confirm("清除所有檢查進度？")){ state={}; save(); render(); }
});
render();
</script>
</html>
