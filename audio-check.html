file": "9f5b5dcffc6300ea.mp3", "new": false}, {"sec": "單字", "text": "適当", "hint": "てきとう", "file": "0c0d1b577bd49131.mp3", "new": false}, {"sec": "單字", "text": "泣く", "hint": "なく", "file": "39c7c19ba7b4df25.mp3", "new": false}, {"sec": "單字", "text": "日程", "hint": "にってい", "file": "1af0b618a8108ac3.mp3", "new": false}, {"sec": "單字", "text": "運ぶ", "hint": "はこぶ", "file": "60bb6de0dd810b83.mp3", "new": false}, {"sec": "單字", "text": "離す", "hint": "はなす", "file": "65f64aef4504bc1b.mp3", "new": false}, {"sec": "單字", "text": "びっくりする", "hint": "びっくりする", "file": "e1332b41ce0b845f.mp3", "new": false}, {"sec": "單字", "text": "撒く", "hint": "まく", "file": "7ad5886b193b82a3.mp3", "new": false}, {"sec": "單字", "text": "万年筆", "hint": "まんねんひつ", "file": "5ffca8fef0fcbafb.mp3", "new": false}, {"sec": "單字", "text": "皆", "hint": "みな", "file": "565a8c191c7a2f62.mp3", "new": false}, {"sec": "單字", "text": "南", "hint": "みなみ", "file": "dc25e1ad3c0a578a.mp3", "new": false}, {"sec": "單字", "text": "目方", "hint": "めかた", "file": "71bb4c3682ccf1da.mp3", "new": false}, {"sec": "單字", "text": "夕方", "hint": "ゆうがた", "file": "2896ce550cd0d487.mp3", "new": false}, {"sec": "單字", "text": "ゆっくり", "hint": "ゆっくり", "file": "cd62ee01c359bba1.mp3", "new": false}, {"sec": "單字", "text": "予算", "hint": "よさん", "file": "a883ef00a3d120b7.mp3", "new": false}, {"sec": "單字", "text": "用事", "hint": "ようじ", "file": "5143ce02294429a5.mp3", "new": false}, {"sec": "單字", "text": "忘れ物", "hint": "わすれもの", "file": "c5218cd2a53d757b.mp3", "new": false}, {"sec": "單字", "text": "割れる", "hint": "われる", "file": "10b3bf157ddb3f2d.mp3", "new": false}, {"sec": "例句", "text": "父が急に倒れてしまいました。", "hint": "倒れる＝たおれる", "file": "9eadc11d387b8996.mp3", "new": false}, {"sec": "例句", "text": "父の様子がおかしかったので、救急車を呼びました。", "hint": "様子＝ようす", "file": "2f972f6fecf7b539.mp3", "new": false}, {"sec": "例句", "text": "部屋の隅で倒れていました。", "hint": "隅＝すみ", "file": "c0bf664a18de5e1d.mp3", "new": false}, {"sec": "例句", "text": "医者さんがすぐに検査をしてくれました。", "hint": "医者＝いしゃ", "file": "fc90c11903bab3da.mp3", "new": false}, {"sec": "例句", "text": "頭が痛かったんですね。", "hint": "頭＝あたま", "file": "004bcf947994aef1.mp3", "new": false}, {"sec": "例句", "text": "注射をしなければならないと言われました。", "hint": "注射する＝ちゅうしゃする", "file": "c3a5ca9574e87eb9.mp3", "new": false}, {"sec": "例句", "text": "特別な部屋は空いていませんでした。", "hint": "特別＝とくべつ", "file": "0628f4935c61fcc0.mp3", "new": false}, {"sec": "例句", "text": "入院の支度をしました。", "hint": "支度する＝したくする", "file": "b13a76e13f430b5a.mp3", "new": false}, {"sec": "例句", "text": "着替えや歯ブラシを用意しました。", "hint": "用意する＝よういする", "file": "06b93344ceb7550f.mp3", "new": false}, {"sec": "例句", "text": "お粥を炊いて持っていきました。", "hint": "炊く＝たく", "file": "a469550b64699828.mp3", "new": false}, {"sec": "例句", "text": "病室の電灯がつきました。", "hint": "電灯＝でんとう", "file": "46066fdb376ac481.mp3", "new": false}, {"sec": "例句", "text": "電灯がつく。", "hint": "つく＝つく", "file": "76ff4fc8417e6e40.mp3", "new": false}, {"sec": "例句", "text": "何を召し上がりますか。", "hint": "召し上がる＝めしあがる", "file": "1428d442a2d867bf.mp3", "new": false}, {"sec": "例句", "text": "これはちょっとぬるいね。", "hint": "温い＝ぬるい", "file": "5717005b82daf2f2.mp3", "new": false}, {"sec": "例句", "text": "シーツを取り替えてくれました。", "hint": "取り替える＝とりかえる", "file": "1401325b4afbebfb.mp3", "new": false}, {"sec": "例句", "text": "翌日、お見舞いに行きました。", "hint": "お見舞い＝おみまい", "file": "051b90dc47410aae.mp3", "new": false}, {"sec": "例句", "text": "花屋で花を買いました。", "hint": "花＝はな", "file": "b7a41554cd93ad7f.mp3", "new": false}, {"sec": "例句", "text": "病院の瓶に入れてあげました。", "hint": "瓶＝びん", "file": "651299a78aff5a8c.mp3", "new": false}, {"sec": "例句", "text": "小さい人形も持っていきました。", "hint": "人形＝にんぎょう", "file": "bb59c31be476d594.mp3", "new": false}, {"sec": "例句", "text": "看護師さんが床を掃いていました。", "hint": "掃く＝はく", "file": "42d01b3f8daf840d.mp3", "new": false}, {"sec": "例句", "text": "本を棚に戻しておきました。", "hint": "戻す＝もどす", "file": "d7b3e3c526c804ae.mp3", "new": false}, {"sec": "例句", "text": "薬はとても苦かったです。", "hint": "苦い＝にがい", "file": "f4bec9447bf063bf.mp3", "new": false}, {"sec": "例句", "text": "傷に薬を塗ってもらいました。", "hint": "塗る＝ぬる", "file": "d0307c91c93b6cf9.mp3", "new": false}, {"sec": "例句", "text": "痛みは少しずつなくなっていきました。", "hint": "なくなる＝なくなる", "file": "f7817e265bbf1753.mp3", "new": false}, {"sec": "例句", "text": "疲れは少し残っているようです。", "hint": "残る＝のこる", "file": "7048825c12b30e37.mp3", "new": false}, {"sec": "例句", "text": "お酒は当分止めるように言われました。", "hint": "止める＝やめる", "file": "b16600d7a2fd8648.mp3", "new": false}, {"sec": "例句", "text": "なるべく休んだ方がいいです。", "hint": "なるべく＝なるべく", "file": "8a2303b7628609c7.mp3", "new": false}, {"sec": "例句", "text": "なるほど、少し前から痛かったんですね。", "hint": "なるほど＝なるほど", "file": "434d5c1cb084b23d.mp3", "new": false}, {"sec": "例句", "text": "おばあちゃんから電報が届きました。", "hint": "電報＝でんぽう", "file": "d5c9cadeeb241912.mp3", "new": false}, {"sec": "例句", "text": "父は大分元気になりました。", "hint": "大分＝だいぶ", "file": "55db712275216cce.mp3", "new": false}, {"sec": "例句", "text": "少し痩せてしまいました。", "hint": "痩せる＝やせる", "file": "69b98d197092d8aa.mp3", "new": false}, {"sec": "例句", "text": "来週、退院する予定です。", "hint": "予定＝よてい", "file": "d306ba66977c9bc4.mp3", "new": false}, {"sec": "例句", "text": "次の診察も予約しました。", "hint": "予約する＝よやくする", "file": "74e1746a99cab5f5.mp3", "new": false}, {"sec": "例句", "text": "家に戻ることができました。", "hint": "戻る＝もどる", "file": "f7e03482de532879.mp3", "new": false}, {"sec": "例句", "text": "息子の私は、本当に安心しました。", "hint": "息子＝むすこ", "file": "e03ddd62023a149b.mp3", "new": false}, {"sec": "例句", "text": "新しい町に引っ越しました。", "hint": "引っ越す＝ひっこす", "file": "0b773e95b7fb6c8a.mp3", "new": false}, {"sec": "例句", "text": "学生時代に同じ学校にいたことが分かりました。", "hint": "時代＝じだい", "file": "44d076bbba263f6a.mp3", "new": false}, {"sec": "例句", "text": "天気予報では雨と言っていました。", "hint": "天気予報＝てんきよほう", "file": "d264f35c7045885d.mp3", "new": false}, {"sec": "例句", "text": "新しい部屋の引き出しを開くと…。", "hint": "引き出し＝ひきだし", "file": "a6048534c54f149a.mp3", "new": false}, {"sec": "例句", "text": "引き出しを開くと、指輪が入っていました。", "hint": "開く＝ひらく", "file": "ee8cc215545f22c9.mp3", "new": false}, {"sec": "例句", "text": "引き出しはとても深かったです。", "hint": "深い＝ふかい", "file": "81ecf2bb1ff45e11.mp3", "new": false}, {"sec": "例句", "text": "奥に指輪が入っていました。", "hint": "指輪＝ゆびわ", "file": "fe2e9886a378fd21.mp3", "new": false}, {"sec": "例句", "text": "隣の人と知り合いました。", "hint": "知り合う＝しりあう", "file": "f7b9f24fc7b25834.mp3", "new": false}, {"sec": "例句", "text": "高校の先生に似ている気がしました。", "hint": "似る＝にる", "file": "0876af8093a59417.mp3", "new": false}, {"sec": "例句", "text": "すると、聞いてみたら本当に同じ学校でした。", "hint": "すると＝すると", "file": "02c9f0530e6905fd.mp3", "new": false}, {"sec": "例句", "text": "近くの売店で食料品を買いました。", "hint": "売店＝ばいてん", "file": "80d8e16432f7a924.mp3", "new": false}, {"sec": "例句", "text": "売店で食料品を買いました。", "hint": "食料品＝しょくりょうひん", "file": "40d986ea4aa39800.mp3", "new": false}, {"sec": "例句", "text": "店員さんはとても親切でした。", "hint": "店員＝てんいん", "file": "e956814c5d66b309.mp3", "new": false}, {"sec": "例句", "text": "新しい布団で早く寝ました。", "hint": "布団＝ふとん", "file": "a9d6706d8275c4ba.mp3", "new": false}, {"sec": "例句", "text": "新しいまくらで寝ました。", "hint": "まくら＝まくら", "file": "72eedcad142b07e7.mp3", "new": false}, {"sec": "例句", "text": "近所を散歩してみました。", "hint": "散歩する＝さんぽする", "file": "8b094ba835738e54.mp3", "new": false}, {"sec": "例句", "text": "珍しいカフェを見つけました。", "hint": "珍しい＝めずらしい", "file": "9357df84714acf2a.mp3", "new": false}, {"sec": "例句", "text": "店の中を回ってみました。", "hint": "回る＝まわる", "file": "a756831b74b060b1.mp3", "new": false}, {"sec": "例句", "text": "柔らかすぎるパンを売っていました。", "hint": "柔らかい＝やわらかい", "file": "026062a9e3783059.mp3", "new": false}, {"sec": "例句", "text": "ケーキを一つ注文しました。", "hint": "注文する＝ちゅうもんする", "file": "c4e5d681f04e6c8b.mp3", "new": false}, {"sec": "例句", "text": "半分に切ってもらいました。", "hint": "半分＝はんぶん", "file": "0738014ac57df9c8.mp3", "new": false}, {"sec": "例句", "text": "道の太い木の下にコインがありました。", "hint": "太い＝ふとい", "file": "5edf2072adf3b2cd.mp3", "new": false}, {"sec": "例句", "text": "小さいコインを拾いました。", "hint": "拾う＝ひろう", "file": "d06c333f00f0bc29.mp3", "new": false}, {"sec": "例句", "text": "猫は少し太ってしまったみたいです。", "hint": "太る＝ふとる", "file": "4c7e31e9bb6e7b4c.mp3", "new": false}, {"sec": "例句", "text": "水着を買いに行くことにしました。", "hint": "水着＝みずぎ", "file": "3ea28349f9cef184.mp3", "new": false}, {"sec": "例句", "text": "私に向いている色を選んでくれました。", "hint": "向く＝むく", "file": "572187fae92e15fc.mp3", "new": false}, {"sec": "例句", "text": "値段が普通の倍になっていました。", "hint": "倍＝ばい", "file": "a8f7bc1be922d717.mp3", "new": false}, {"sec": "例句", "text": "普通の道を歩いていました。", "hint": "普通＝ふつう", "file": "ef741dfcf99ff979.mp3", "new": false}, {"sec": "例句", "text": "床が少し汚れていました。", "hint": "汚れる＝よごれる", "file": "059468183dedfaf0.mp3", "new": false}, {"sec": "例句", "text": "引っ越しの時に床を汚してしまいました。", "hint": "汚す＝よごす", "file": "40fe7ffb4b2a9384.mp3", "new": false}, {"sec": "例句", "text": "りんごの皮を剥いて食べました。", "hint": "剥く＝むく", "file": "9c603c826416906e.mp3", "new": false}, {"sec": "例句", "text": "プレゼントを丁寧に包みました。", "hint": "包む＝つつむ", "file": "f5918fc536beebe5.mp3", "new": false}, {"sec": "例句", "text": "別の箱に入れました。", "hint": "別＝べつ", "file": "8ca66c204c975934.mp3", "new": false}, {"sec": "例句", "text": "指でリボンを結びました。", "hint": "指＝ゆび", "file": "5ea098d63e2df4c4.mp3", "new": false}, {"sec": "例句", "text": "引っ越す日は朝から忙しかったです。", "hint": "日＝ひ", "file": "a24001a60c949f8b.mp3", "new": false}, {"sec": "例句", "text": "眠りが浅くて、何度も目が覚めました。", "hint": "浅い＝あさい", "file": "460399a2bce34e9a.mp3", "new": false}, {"sec": "例句", "text": "引っ越しの日は本当に暑かったです。", "hint": "暑い＝あつい", "file": "dd9d3070a651eb00.mp3", "new": false}, {"sec": "例句", "text": "この部屋は壁が粗いです。", "hint": "粗い＝あらい", "file": "b44ade6829156241.mp3", "new": false}, {"sec": "例句", "text": "玄関の暗号を手帳にメモしておきました。", "hint": "暗号＝あんごう", "file": "afcc30d19624f9df.mp3", "new": false}, {"sec": "例句", "text": "いくら安くても、栄養がなければ体に悪いです。", "hint": "いくら＝いくら", "file": "0d15ff0337de5ccd.mp3", "new": false}, {"sec": "例句", "text": "大家さんに野菜の炒め方を教えてもらいました。", "hint": "炒める＝いためる", "file": "8e0da6c7816a56e3.mp3", "new": false}, {"sec": "例句", "text": "一般に危ないと言われる場所は避けています。", "hint": "一般＝いっぱん", "file": "a57c7917cab79cc0.mp3", "new": false}, {"sec": "例句", "text": "取れたボタンを糸と針で直しました。", "hint": "糸＝いと", "file": "199e6171e873f803.mp3", "new": false}, {"sec": "例句", "text": "カレンダーを掛けるために、壁に釘を打ちました。", "hint": "打つ＝うつ", "file": "2675289db7aed53b.mp3", "new": false}, {"sec": "例句", "text": "二人で記念の写真を写しました。", "hint": "写す＝うつす", "file": "900c5decf4ed6099.mp3", "new": false}, {"sec": "例句", "text": "この気持ちは永遠に消えません。", "hint": "永遠＝えいえん", "file": "180178dabf695c01.mp3", "new": false}, {"sec": "例句", "text": "弁当ばかりでは栄養が足りません。", "hint": "栄養＝えいよう", "file": "5d0f4eea8e344ec1.mp3", "new": false}, {"sec": "例句", "text": "二日おきに猫に餌をやっています。", "hint": "餌＝えさ", "file": "bec866e76aa2e9bd.mp3", "new": false}, {"sec": "例句", "text": "大家さんのおかげで食事がよくなりました。", "hint": "おかげ＝おかげ", "file": "2b66cab16138cd25.mp3", "new": false}, {"sec": "例句", "text": "この薬は一日おきに飲んでください。", "hint": "おき＝おき", "file": "58597837bd7aece4.mp3", "new": false}, {"sec": "例句", "text": "大家さんは怒らないで、優しく言ってくれました。", "hint": "怒る＝おこる", "file": "faf3ae504d69fc4f.mp3", "new": false}, {"sec": "例句", "text": "大家さんのお宅で料理をご馳走しました。", "hint": "お宅＝おたく", "file": "4d0f41576a13829a.mp3", "new": false}, {"sec": "例句", "text": "「合格、おめでとうございます」と言われました。", "hint": "おめでとうございます＝おめでとうございます", "file": "33570c2352f73e8d.mp3", "new": false}, {"sec": "例句", "text": "汗でひどい格好になってしまいました。", "hint": "格好＝かっこう", "file": "68a51e194b6bd760.mp3", "new": false}, {"sec": "例句", "text": "その話を聞いて少し悲しかったです。", "hint": "悲しい＝かなしい", "file": "56f295fbe5523f02.mp3", "new": false}, {"sec": "例句", "text": "包丁を使うときは気をつけてください。", "hint": "気＝き", "file": "f6896ee8f000205b.mp3", "new": false}, {"sec": "例句", "text": "帰りに記念の写真を写しました。", "hint": "記念＝きねん", "file": "ea5b214b392cd280.mp3", "new": false}, {"sec": "例句", "text": "窓が大きくて気分のいい部屋です。", "hint": "気分＝きぶん", "file": "08e31b0135c1800c.mp3", "new": false}, {"sec": "例句", "text": "別れても、気持ちは消えません。", "hint": "気持ち＝きもち", "file": "f187277251d54b37.mp3", "new": false}, {"sec": "例句", "text": "学生の部屋探しは競争が激しいです。", "hint": "競争＝きょうそう", "file": "fcf36938447d8a13.mp3", "new": false}, {"sec": "例句", "text": "料理に興味が出てきました。", "hint": "興味＝きょうみ", "file": "5b557d42a37f4e2d.mp3", "new": false}, {"sec": "例句", "text": "壁は粗いです。けれども、気分のいい部屋です。", "hint": "けれども＝けれども", "file": "14d3334ce08190f8.mp3", "new": false}, {"sec": "例句", "text": "大家さんは好意で野菜を分けてくれます。", "hint": "好意＝こうい", "file": "5b35d15719a6e5ec.mp3", "new": false}, {"sec": "例句", "text": "お礼に大家さんに手料理をご馳走しました。", "hint": "ご馳走する＝ごちそうする", "file": "ef37f1eddf7a6dfe.mp3", "new": false}, {"sec": "例句", "text": "この部屋が借りられて、運がよかったです。", "hint": "この＝この", "file": "1a1725ddab404b97.mp3", "new": false}, {"sec": "例句", "text": "揺れがあまりに怖くて、体が動きませんでした。", "hint": "怖い＝こわい", "file": "d0ace4e9a116a635.mp3", "new": false}, {"sec": "例句", "text": "壁にカレンダーを掛けます。", "hint": "掛ける＝かける", "file": "7ab52d327fd9f2f1.mp3", "new": false}, {"sec": "例句", "text": "駅の角を曲がって、まっすぐ行きます。", "hint": "角＝かど", "file": "e03c64bc3d6b1925.mp3", "new": false}, {"sec": "例句", "text": "夕飯はコンビニの弁当か缶詰でした。", "hint": "缶詰＝かんづめ", "file": "b9b33f8afa830b8f.mp3", "new": false}, {"sec": "例句", "text": "地震で電気が消えてしまいました。", "hint": "消える＝きえる", "file": "78cdfd896d759620.mp3", "new": false}, {"sec": "例句", "text": "近所にはスーパーも図書館もあります。", "hint": "近所＝きんじょ", "file": "480eb33c42aa06b0.mp3", "new": false}, {"sec": "例句", "text": "この町で一人で下宿することにしました。", "hint": "下宿する＝げしゅくする", "file": "18b6708925a74f2a.mp3", "new": false}, {"sec": "例句", "text": "この頃は卒業のことばかり考えています。", "hint": "この頃＝このごろ", "file": "0e2f50e2b98ba93c.mp3", "new": false}, {"sec": "例句", "text": "さっき駅で先生に会いました。", "hint": "さっき＝さっき", "file": "17acb80deb5fc66f.mp3", "new": false}, {"sec": "例句", "text": "その言葉で幸せな気持ちになりました。", "hint": "幸せ＝しあわせ", "file": "f84e5ae8dc4c0e4e.mp3", "new": false}, {"sec": "例句", "text": "この一年しっかり勉強しました。", "hint": "しっかり＝しっかり", "file": "71b2627df547ffae.mp3", "new": false}, {"sec": "例句", "text": "母は電話でずいぶん心配していました。", "hint": "心配する＝しんぱいする", "file": "7ceac6d476a61d84.mp3", "new": false}, {"sec": "例句", "text": "忘れないように、すぐメモしておきました。", "hint": "すぐ＝すぐ", "file": "97f1db9349c1a91c.mp3", "new": false}, {"sec": "例句", "text": "要らない物を捨てて、荷物が少なくなりました。", "hint": "捨てる＝すてる", "file": "fee7d692fcac6fc8.mp3", "new": false}, {"sec": "例句", "text": "それで、この町での生活が始まりました。", "hint": "それで＝それで", "file": "651d56bd86dbc5ed.mp3", "new": false}, {"sec": "例句", "text": "料理は楽しいです。それに、体にもいいです。", "hint": "それに＝それに", "file": "33cb65b4b0301f22.mp3", "new": false}, {"sec": "例句", "text": "新しい生活も楽しみです。", "hint": "楽しみ＝たのしみ", "file": "ada61ae6e8f0ec25.mp3", "new": false}, {"sec": "例句", "text": "作ることを楽しむようになりました。", "hint": "楽しむ＝たのしむ", "file": "5c0efdbb2efdf9a2.mp3", "new": false}, {"sec": "例句", "text": "静かな道を通って五分で着きます。", "hint": "通る＝とおる", "file": "0034f618ce9d8ec9.mp3", "new": false}, {"sec": "例句", "text": "眠たくて目を閉じたのに、眠れませんでした。", "hint": "眠たい＝ねむたい", "file": "0a088b8eb61b1b98.mp3", "new": false}, {"sec": "例句", "text": "大家さんと田舎の墓参りに行きました。", "hint": "墓＝はか", "file": "61956a34311a7117.mp3", "new": false}, {"sec": "例句", "text": "指を切ってしまい、恥ずかしかったです。", "hint": "恥ずかしい＝はずかしい", "file": "48c4696ab3d73134.mp3", "new": false}, {"sec": "例句", "text": "東京の会社で働くことになりました。", "hint": "働く＝はたらく", "file": "c281d8050b465866.mp3", "new": false}, {"sec": "例句", "text": "久しぶりに友達に会いました。", "hint": "久しぶり＝ひさしぶり", "file": "2f2cbfefd2061796.mp3", "new": false}, {"sec": "例句", "text": "大家さんは朗らかな人です。", "hint": "朗らか＝ほがらか", "file": "71fa2424f21441af.mp3", "new": false}, {"sec": "例句", "text": "はじめは真似をするだけでした。", "hint": "真似＝まね", "file": "263bb608cb77f827.mp3", "new": false}, {"sec": "例句", "text": "窓を開けたまま寝てしまいました。", "hint": "まま＝まま", "file": "35d44304c1efda14.mp3", "new": false}, {"sec": "例句", "text": "自分で作った物を食べると満足できます。", "hint": "満足＝まんぞく", "file": "f778de333182af60.mp3", "new": false}, {"sec": "例句", "text": "自分でも矛盾していると思います。", "hint": "矛盾＝むじゅん", "file": "7d2f35e09969515a.mp3", "new": false}, {"sec": "例句", "text": "隣の人が迷惑していたらしいです。", "hint": "迷惑する＝めいわくする", "file": "c7dc8994c3c4998e.mp3", "new": false}, {"sec": "例句", "text": "大家さんは優しく言ってくれました。", "hint": "優しい＝やさしい", "file": "c9eb08009edffe0a.mp3", "new": false}, {"sec": "例句", "text": "二人で食べる夕飯はおいしいです。", "hint": "夕飯＝ゆうはん", "file": "f519c5b34ab6faa8.mp3", "new": false}, {"sec": "例句", "text": "二人の夕飯は愉快な時間です。", "hint": "愉快＝ゆかい", "file": "6921c9219530ca28.mp3", "new": false}, {"sec": "例句", "text": "部屋の鍵が少し緩くて心配です。", "hint": "緩い＝ゆるい", "file": "821d11c936f551b2.mp3", "new": false}, {"sec": "例句", "text": "夜、部屋が急に大きく揺れました。", "hint": "揺れる＝ゆれる", "file": "ed868f130a0d8807.mp3", "new": false}, {"sec": "例句", "text": "危ないと言われる場所は避けています。", "hint": "避ける＝さける", "file": "47eed8cce4ab2db0.mp3", "new": false}, {"sec": "例句", "text": "荷物が減って、掃除も楽になりました。", "hint": "楽＝らく", "file": "f29ea59b4e985f93.mp3", "new": false}, {"sec": "例句", "text": "古いですが立派な家が建っています。", "hint": "立派＝りっぱ", "file": "b9555be77be4033e.mp3", "new": false}, {"sec": "例句", "text": "大家さんと別れるのは寂しいです。", "hint": "別れる＝わかれる", "file": "a694483cfb41e3c3.mp3", "new": false}, {"sec": "例句", "text": "この家は家賃も割合に安いです。", "hint": "割合に＝わりあいに", "file": "0df5ec92d60a5948.mp3", "new": false}, {"sec": "例句", "text": "みんなが一緒に集まって、写真を撮った。", "hint": "集まる＝あつまる", "file": "580ed2ecb9f417c7.mp3", "new": false}, {"sec": "例句", "text": "遅れて来た友達は「ごめん」と謝った。", "hint": "謝る＝あやまる", "file": "9d33411dd2aa1336.mp3", "new": false}, {"sec": "例句", "text": "いいよと言ったのに、彼はまだ気にしていた。", "hint": "いい＝いい", "file": "bb1a83ee09cfc59b.mp3", "new": false}, {"sec": "例句", "text": "卒業するために、一生懸命勉強してきた。", "hint": "一生懸命＝いっしょうけんめい", "file": "16dfe69a233019d2.mp3", "new": false}, {"sec": "例句", "text": "鉛筆で書いたメモを見ながら確かめた。", "hint": "鉛筆＝えんぴつ", "file": "03d3e037b69e5315.mp3", "new": false}, {"sec": "例句", "text": "先輩は直接やり方を教えてくれた。", "hint": "教える＝おしえる", "file": "a92c141a3d62b94d.mp3", "new": false}, {"sec": "例句", "text": "学部の講義が、今日で終わりになった。", "hint": "終わり＝おわり", "file": "8692c1cc73ed7368.mp3", "new": false}, {"sec": "例句", "text": "活動の最後の日、みんなが一緒に集まった。", "hint": "活動＝かつどう", "file": "0436fc182ea06a72.mp3", "new": false}, {"sec": "例句", "text": "厳しい先生の質問は簡単ではなかった。", "hint": "簡単＝かんたん", "file": "27ee48c308083997.mp3", "new": false}, {"sec": "例句", "text": "会社の規則はそれほど多くなかった。", "hint": "規則＝きそく", "file": "97407b970f878dc9.mp3", "new": false}, {"sec": "例句", "text": "教室に学生たちが揃った。", "hint": "教室＝きょうしつ", "file": "115a996274bf37f0.mp3", "new": false}, {"sec": "例句", "text": "長時間座っていたので、腰が痛くなった。", "hint": "腰＝こし", "file": "910667f935fed165.mp3", "new": false}, {"sec": "例句", "text": "レポートの事柄について友達に手伝ってもらった。", "hint": "事柄＝ことがら", "file": "f5c2db26ebeb16f6.mp3", "new": false}, {"sec": "例句", "text": "友達に資料を探すのを手伝ってもらった。", "hint": "探す＝さがす", "file": "29848ed867516fd0.mp3", "new": false}, {"sec": "例句", "text": "早退したり残業したりする日もある。", "hint": "残業する＝ざんぎょうする", "file": "4ddf9c163b85571c.mp3", "new": false}, {"sec": "例句", "text": "出発した日から、自信を持って話せるようになった。", "hint": "出発する＝しゅっぱつする", "file": "91a3c2d15960fe3e.mp3", "new": false}, {"sec": "例句", "text": "早く終わらせて準備した後で出掛けた。", "hint": "準備する＝じゅんびする", "file": "8a9b08df015e416f.mp3", "new": false}, {"sec": "例句", "text": "社内コンテストの賞金を受け取ることだ。", "hint": "賞金＝しょうきん", "file": "d14eed0e707c7453.mp3", "new": false}, {"sec": "例句", "text": "向こうの会社の人口データを用いて説明した。", "hint": "人口＝じんこう", "file": "c2af770ccd3bbdc0.mp3", "new": false}, {"sec": "例句", "text": "部長は「大丈夫」と信用してくれた。", "hint": "信用する＝しんようする", "file": "f400933609e359e8.mp3", "new": false}, {"sec": "例句", "text": "信頼できる社員になるまで待つと言ってくれた。", "hint": "信頼する＝しんらいする", "file": "7c856103d4f82a32.mp3", "new": false}, {"sec": "例句", "text": "仕事は少しずつ進んでいる。", "hint": "進む＝すすむ", "file": "375d8fd81207ebe8.mp3", "new": false}, {"sec": "例句", "text": "担当者は留守で、外に出ているらしかった。", "hint": "外＝そと", "file": "da664e893b967a84.mp3", "new": false}, {"sec": "例句", "text": "教室に学生たちが揃ったのを見て、先生は笑った。", "hint": "揃う＝そろう", "file": "d1d842d6a45d7bc9.mp3", "new": false}, {"sec": "例句", "text": "友達に手伝ってもらい、助かった。", "hint": "助かる＝たすかる", "file": "79d0450719381007.mp3", "new": false}, {"sec": "例句", "text": "例えば面接の受け方も教えてくれた。", "hint": "例えば＝たとえば", "file": "98c506a274117a44.mp3", "new": false}, {"sec": "例句", "text": "先生は、みんなのために面接の受け方も教えてくれた。", "hint": "ため＝ため", "file": "4f6fab4adcef3834.mp3", "new": false}, {"sec": "例句", "text": "会社の規則はちゃんと守らなければならない。", "hint": "ちゃんと＝ちゃんと", "file": "14c410482eb0e502.mp3", "new": false}, {"sec": "例句", "text": "先輩が地図を見たら、駅までの時間が分かった。", "hint": "地図＝ちず", "file": "d5d882511541cc86.mp3", "new": false}, {"sec": "例句", "text": "早退したり残業したりする日もあるが、調子はいい。", "hint": "調子＝ちょうし", "file": "a81203b4b0828768.mp3", "new": false}, {"sec": "例句", "text": "駅までちょうど三十分だと分かった。", "hint": "ちょうど＝ちょうど", "file": "667ac60fbff326bb.mp3", "new": false}, {"sec": "例句", "text": "この会社に勤めてまだ半年だ。", "hint": "勤める＝つとめる", "file": "a4220f7c9f6c6f7d.mp3", "new": false}, {"sec": "例句", "text": "仕事が積もっていたが、早く終わらせた。", "hint": "積もる＝つもる", "file": "be856d6ca7e4824c.mp3", "new": false}, {"sec": "例句", "text": "先輩が私を駅まで連れて行ってくれた。", "hint": "連れて行く＝つれていく", "file": "791463acfe2f0128.mp3", "new": false}, {"sec": "例句", "text": "準備した後で出掛けた。", "hint": "出掛ける＝でかける", "file": "8dd808b8e8340663.mp3", "new": false}, {"sec": "例句", "text": "友達に探すのを手伝ってもらい、助かった。", "hint": "手伝う＝てつだう", "file": "52d17b63a9540fb6.mp3", "new": false}, {"sec": "例句", "text": "戸を開けると突然雨が降ってきた。", "hint": "戸＝と", "file": "8880d9bffc1ba897.mp3", "new": false}, {"sec": "例句", "text": "部長はいつも命令をなさる方だ。", "hint": "なさる＝なさる", "file": "b734fe4f186380ee.mp3", "new": false}, {"sec": "例句", "text": "資料の字が小さくて読みにくい。", "hint": "にくい＝にくい", "file": "e7f98a239f96813b.mp3", "new": false}, {"sec": "例句", "text": "仕事が終わると、みんなで二次会に行った。", "hint": "二次会＝にじかい", "file": "dce0562c5a82a385.mp3", "new": false}, {"sec": "例句", "text": "資料を拝見してもいいですか。", "hint": "拝見する＝はいけんする", "file": "762ae66e918a15c7.mp3", "new": false}, {"sec": "例句", "text": "居酒屋の灰皿の横で、部長は窓を閉めた。", "hint": "灰皿＝はいざら", "file": "e5d2b90fda61d6d4.mp3", "new": false}, {"sec": "例句", "text": "窓のガラスに夕日が反射してきれいだった。", "hint": "反射する＝はんしゃする", "file": "35b9f274cb49acd9.mp3", "new": false}, {"sec": "例句", "text": "傘があれば雨を防げると思った。", "hint": "防ぐ＝ふせぐ", "file": "28e9efebae1423af.mp3", "new": false}, {"sec": "例句", "text": "先輩は普段から優しい。", "hint": "普段＝ふだん", "file": "2853b960b61843e8.mp3", "new": false}, {"sec": "例句", "text": "電車の放送を聞きながら資料を読んだ。", "hint": "放送＝ほうそう", "file": "e8bb04a380f308de.mp3", "new": false}, {"sec": "例句", "text": "本社に着くと、挨拶をした。", "hint": "本社＝ほんしゃ", "file": "446ea623514b5bd2.mp3", "new": false}, {"sec": "例句", "text": "「ただいま参りました」と挨拶した。", "hint": "参る＝まいる", "file": "1eff769a3c8b072d.mp3", "new": false}, {"sec": "例句", "text": "見方が合わず、少し摩擦が生まれた。", "hint": "摩擦＝まさつ", "file": "31cf71a0a58bb552.mp3", "new": false}, {"sec": "例句", "text": "向こうの人と見方が合わなかった。", "hint": "見方＝みかた", "file": "3bb74fcde5163330.mp3", "new": false}, {"sec": "例句", "text": "人口データを用いて説明した。", "hint": "用いる＝もちいる", "file": "d508a093727abb0e.mp3", "new": false}, {"sec": "例句", "text": "熱い湯を飲んで少し落ち着いた。", "hint": "湯＝ゆ", "file": "da4ccd6727864b50.mp3", "new": false}, {"sec": "例句", "text": "本社で活躍することが、今の私の夢だ。", "hint": "夢＝ゆめ", "file": "32ebef16c518c924.mp3", "new": false}, {"sec": "例句", "text": "この出張には用がもう一つあった。", "hint": "用＝よう", "file": "e6cd598745bcaeff.mp3", "new": false}, {"sec": "例句", "text": "帰りに領収書をもらうのを忘れないようにした。", "hint": "領収書＝りょうしゅうしょ", "file": "d32ea67f2a102b4f.mp3", "new": false}, {"sec": "例句", "text": "連休の前に本社へ電話した。", "hint": "連休＝れんきゅう", "file": "3efa1dbf4a4083c8.mp3", "new": false}, {"sec": "例句", "text": "部長は冷房が強すぎると言った。", "hint": "冷房＝れいぼう", "file": "f6174a2cb59b26c0.mp3", "new": false}, {"sec": "例句", "text": "夏休みの間に、日本語が上手になりました。", "hint": "間＝あいだ", "file": "a6b06f16bda8168a.mp3", "new": false}, {"sec": "例句", "text": "間違えたところを赤いペンで直します。", "hint": "赤い＝あかい", "file": "576849ac26e255eb.mp3", "new": false}, {"sec": "例句", "text": "いよいよ卒業する日が来ました。", "hint": "いよいよ＝いよいよ", "file": "832d8ec5c0ac9054.mp3", "new": false}, {"sec": "例句", "text": "この辞典は見ていて面白いです。", "hint": "面白い＝おもしろい", "file": "e2fe8d71775061f1.mp3", "new": false}, {"sec": "例句", "text": "教科書をきちんと机に並べます。", "hint": "きちんと＝きちんと", "file": "d06f6aed21de6b75.mp3", "new": false}, {"sec": "例句", "text": "校長先生は生徒の教育を大切にしています。", "hint": "教育＝きょういく", "file": "5989837ad3b82367.mp3", "new": false}, {"sec": "例句", "text": "教科書を机の上に出してください。", "hint": "教科書＝きょうかしょ", "file": "07f1a4730f585c52.mp3", "new": false}, {"sec": "例句", "text": "試験の朝、とても緊張しました。", "hint": "緊張する＝きんちょうする", "file": "7e3276c10b1164af.mp3", "new": false}, {"sec": "例句", "text": "頭が痛いので、薬を飲みました。", "hint": "薬＝くすり", "file": "74c92212b7514718.mp3", "new": false}, {"sec": "例句", "text": "宿題は毎日二時間ぐらいかかります。", "hint": "ぐらい＝ぐらい", "file": "0f0d45244a176ede.mp3", "new": false}, {"sec": "例句", "text": "あの春の経験は今でも忘れません。", "hint": "経験＝けいけん", "file": "b95f5ae109987539.mp3", "new": false}, {"sec": "例句", "text": "数学の時間は計算ばかりです。", "hint": "計算＝けいさん", "file": "e4275e4c112e50b7.mp3", "new": false}, {"sec": "例句", "text": "消しゴムを忘れたので、友達に借りました。", "hint": "消しゴム＝けしゴム", "file": "8128477f5fd24fb3.mp3", "new": false}, {"sec": "例句", "text": "大学の試験に合格しました。", "hint": "合格する＝ごうかくする", "file": "9a8a3a5ab651da31.mp3", "new": false}, {"sec": "例句", "text": "中学校を出て、高校に入りました。", "hint": "高校＝こうこう", "file": "07d1f14a45b7d21d.mp3", "new": false}, {"sec": "例句", "text": "私は今、高校生です。", "hint": "高校生＝こうこうせい", "file": "56d427c68a17e801.mp3", "new": false}, {"sec": "例句", "text": "校長先生が講堂で話をしました。", "hint": "校長＝こうちょう", "file": "7cb313e6ea19848b.mp3", "new": false}, {"sec": "例句", "text": "夕方まで校庭にいました。", "hint": "校庭＝こうてい", "file": "c39bc4765e2982ba.mp3", "new": false}, {"sec": "例句", "text": "卒業式は講堂で行います。", "hint": "講堂＝こうどう", "file": "ed794d84916f9383.mp3", "new": false}, {"sec": "例句", "text": "朝、黒板をきれいにします。", "hint": "黒板＝こくばん", "file": "122bf62322c4c48a.mp3", "new": false}, {"sec": "例句", "text": "担任の先生は国語の先生です。", "hint": "国語＝こくご", "file": "2b1d4f075e3337c7.mp3", "new": false}, {"sec": "例句", "text": "分からない言葉は辞書で調べます。", "hint": "言葉＝ことば", "file": "8eea87962f3a7b40.mp3", "new": false}, {"sec": "例句", "text": "在校生が校庭で練習をしていました。", "hint": "在校生＝ざいこうせい", "file": "7bf3b747c3adb9b5.mp3", "new": false}, {"sec": "例句", "text": "最初にすることは黒板をきれいにすることです。", "hint": "最初＝さいしょ", "file": "5dfbb68f40055abb.mp3", "new": false}, {"sec": "例句", "text": "用事がある人は先に帰りました。", "hint": "先に＝さきに", "file": "568221a4841e818c.mp3", "new": false}, {"sec": "例句", "text": "今週から作文を書き始めました。", "hint": "作文＝さくぶん", "file": "028610fc0cf2e6ec.mp3", "new": false}, {"sec": "例句", "text": "新しい言葉を辞書で調べました。", "hint": "辞書＝じしょ", "file": "97f001b81f6a90ef.mp3", "new": false}, {"sec": "例句", "text": "自信を持って話せるようになりました。", "hint": "自信＝じしん", "file": "b7d5c6757d4f811f.mp3", "new": false}, {"sec": "例句", "text": "父の古い辞典が家にあります。", "hint": "辞典＝じてん", "file": "d301f43431b10345.mp3", "new": false}, {"sec": "例句", "text": "宿題は毎日二時間かかります。", "hint": "宿題＝しゅくだい", "file": "1c4def8a0f8e7c32.mp3", "new": false}, {"sec": "例句", "text": "これからは趣味の時間も取れます。", "hint": "趣味＝しゅみ", "file": "be9063683325a413.mp3", "new": false}, {"sec": "例句", "text": "小学校のころは走るのが嫌いでした。", "hint": "小学校＝しょうがっこう", "file": "af6e097179eecbf6.mp3", "new": false}, {"sec": "例句", "text": "正直に言うと、少し怖かったです。", "hint": "正直＝しょうじき", "file": "72b82edd76dd2c38.mp3", "new": false}, {"sec": "例句", "text": "母は私を信じてくれました。", "hint": "信じる＝しんじる", "file": "4011af0299d0c258.mp3", "new": false}, {"sec": "例句", "text": "数学の時間は数字ばかりです。", "hint": "数学＝すうがく", "file": "15209cf72ca3f994.mp3", "new": false}, {"sec": "例句", "text": "黒板に数字が並んでいます。", "hint": "数字＝すうじ", "file": "996f0f00a8c62896.mp3", "new": false}, {"sec": "例句", "text": "発表の日、すぐにパソコンを開きました。", "hint": "すぐに＝すぐに", "file": "d552006f661dfdf5.mp3", "new": false}, {"sec": "例句", "text": "夏休みは毎日図書館で過ごしました。", "hint": "過ごす＝すごす", "file": "f6798e55d0df44f4.mp3", "new": false}, {"sec": "例句", "text": "成績は思ったより素晴らしかったです。", "hint": "素晴らしい＝すばらしい", "file": "2537c0a0bd5ff0c5.mp3", "new": false}, {"sec": "例句", "text": "今年は成績がよくなりました。", "hint": "成績＝せいせき", "file": "87adfc66627b53c6.mp3", "new": false}, {"sec": "例句", "text": "体育の時間、生徒たちが走ります。", "hint": "生徒＝せいと", "file": "4c0f7899f10d5f80.mp3", "new": false}, {"sec": "例句", "text": "世界的に有名な人の話を聞きました。", "hint": "世界的＝せかいてき", "file": "63d67234ce2a69c7.mp3", "new": false}, {"sec": "例句", "text": "来月、高校を卒業します。", "hint": "卒業する＝そつぎょうする", "file": "7cfacc7c4d482b50.mp3", "new": false}, {"sec": "例句", "text": "体育の時間にグラウンドを走ります。", "hint": "体育＝たいいく", "file": "cf9aeaacef7b9ea0.mp3", "new": false}, {"sec": "例句", "text": "来年から私も大学生です。", "hint": "大学生＝だいがくせい", "file": "0137e3ae1d896d2f.mp3", "new": false}, {"sec": "例句", "text": "単純な間違いが減ってきました。", "hint": "単純＝たんじゅん", "file": "e137b127eb7ab56e.mp3", "new": false}, {"sec": "例句", "text": "担任の先生に相談しました。", "hint": "担任＝たんにん", "file": "7d4ab466839c195c.mp3", "new": false}, {"sec": "例句", "text": "辞典の字はとても小さいです。", "hint": "小さい＝ちいさい", "file": "259056c70269b928.mp3", "new": false}, {"sec": "例句", "text": "自分の知恵を使って考えなさい。", "hint": "知恵＝ちえ", "file": "1b03f0eebe9235b4.mp3", "new": false}, {"sec": "例句", "text": "中学生のころ、ちっとも勉強しませんでした。", "hint": "ちっとも＝ちっとも", "file": "2358d3fb7ca7dce3.mp3", "new": false}, {"sec": "例句", "text": "弟はまだ中学生です。", "hint": "中学生＝ちゅうがくせい", "file": "a9536a195589372d.mp3", "new": false}, {"sec": "例句", "text": "この中学校は家から近いです。", "hint": "中学校＝ちゅうがっこう", "file": "ac4604dbb2b14134.mp3", "new": false}, {"sec": "例句", "text": "毎朝、朝食をきちんと食べます。", "hint": "朝食＝ちょうしょく", "file": "c5ccdf45c1f0c925.mp3", "new": false}, {"sec": "例句", "text": "適当に覚えてはいけません。", "hint": "適当＝てきとう", "file": "752381dc7f2e0c24.mp3", "new": false}, {"sec": "例句", "text": "隣の子は今にも泣きそうでした。", "hint": "泣く＝なく", "file": "133c1f140ae6759f.mp3", "new": false}, {"sec": "例句", "text": "式の日程は先月決まりました。", "hint": "日程＝にってい", "file": "4638c6e32616e0a2.mp3", "new": false}, {"sec": "例句", "text": "講堂に椅子を運びました。", "hint": "運ぶ＝はこぶ", "file": "acc57a349e327144.mp3", "new": false}, {"sec": "例句", "text": "うっかり手を離してしまいました。", "hint": "離す＝はなす", "file": "9f3151ee9dc2fef8.mp3", "new": false}, {"sec": "例句", "text": "自分の番号を見つけてびっくりしました。", "hint": "びっくりする＝びっくりする", "file": "2a694b5c04a04226.mp3", "new": false}, {"sec": "例句", "text": "在校生が花びらを撒きました。", "hint": "撒く＝まく", "file": "547bf8dab49780cc.mp3", "new": false}, {"sec": "例句", "text": "先生から万年筆をもらいました。", "hint": "万年筆＝まんねんひつ", "file": "b3ed7893886b4681.mp3", "new": false}, {"sec": "例句", "text": "皆で講堂に入りました。", "hint": "皆＝みな", "file": "23079aaaba9cacfa.mp3", "new": false}, {"sec": "例句", "text": "南の窓から朝日が入ってきます。", "hint": "南＝みなみ", "file": "8ad642c156ab2308.mp3", "new": false}, {"sec": "例句", "text": "椅子は思ったより目方がありました。", "hint": "目方＝めかた", "file": "fe153ec6a93d1e84.mp3", "new": false}, {"sec": "例句", "text": "夕方になると、空が赤くなります。", "hint": "夕方＝ゆうがた", "file": "c28be13f1aa185f5.mp3", "new": false}, {"sec": "例句", "text": "これからはゆっくり休めます。", "hint": "ゆっくり＝ゆっくり", "file": "fed713f869bb9b5d.mp3", "new": false}, {"sec": "例句", "text": "予算が少ないので、飾りは自分たちで作ります。", "hint": "予算＝よさん", "file": "1609a3fc11096a0f.mp3", "new": false}, {"sec": "例句", "text": "今日は用事があるので、早く帰ります。", "hint": "用事＝ようじ", "file": "63cd3a742b0b8007.mp3", "new": false}, {"sec": "例句", "text": "忘れ物をしないようにかばんを見ました。", "hint": "忘れ物＝わすれもの", "file": "98942f60879ebbaa.mp3", "new": false}, {"sec": "例句", "text": "横にあった花瓶が割れてしまいました。", "hint": "割れる＝われる", "file": "85a307064f14b932.mp3", "new": false}, {"sec": "故事", "text": "先週の日曜日、家で父が急に倒れてしまいました。父の様子がおかしかったので、私はすぐに救急車を呼びました。父は自分の部屋の隅で倒れていました。", "hint": "先週（せんしゅう）の日曜日（にちようび）、家（いえ）で父（ちち）が急（きゅう）に倒れて（たおれて）しまいました。父（ちち）の様子（ようす）がおかしかったので、私（わたし）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びました。父（ちち）は自分（じぶん）の部屋（へや）の隅（すみ）で倒（たお）れていました。", "file": "847a4b020b7deeae.mp3", "new": false}, {"sec": "故事", "text": "病院に着くと、医者さんがすぐに検査をしてくれました。「なるほど、少し前から頭が痛かったんですね」と医者さんは言いました。父は我慢していたそうです。今日は注射をしなければならないと言われて、そのまましばらく入院することになりました。", "hint": "病院（びょういん）に着（つ）くと、医者（いしゃ）さんがすぐに検査（けんさ）をしてくれました。「なるほど、少（すこ）し前（まえ）から頭（あたま）が痛（いた）かったんですね」と医者（いしゃ）さんは言（い）いました。父（ちち）は我慢（がまん）していたそうです。今日（きょう）は注射（ちゅうしゃ）をしなければならないと言（い）われて、そのまましばらく入院（にゅういん）することになりました。", "file": "4407166e8e534fb4.mp3", "new": false}, {"sec": "故事", "text": "特別な部屋は空いていなかったので、父は普通の部屋に入ることになりました。私は一度家に戻って、入院の支度をしました。着替えや歯ブラシを用意して、家族は消化にいいお粥を炊いて持っていきました。", "hint": "特別（とくべつ）な部屋（へや）は空（あ）いていなかったので、父（ちち）は普通（ふつう）の部屋（へや）に入（はい）ることになりました。私（わたし）は一度（いちど）家（いえ）に戻（もど）って、入院（にゅういん）の支度（したく）をしました。着替（きが）えや歯（は）ブラシを用意（ようい）して、家族（かぞく）は消化（しょうか）にいいお粥（かゆ）を炊いて（たいて）持（も）っていきました。", "file": "5162a95d01613a97.mp3", "new": false}, {"sec": "故事", "text": "その夜、病室の電灯がつくと、父の顔色は少し良くなっているように見えました。看護師さんが「何を召し上がりますか」と優しく聞いてくれて、父は温いスープを一口飲みました。「これはちょっとぬるいね」と父は笑いました。看護師さんはベッドのシーツも取り替えてくれました。", "hint": "その夜（よる）、病室（びょうしつ）の電灯（でんとう）がつくと、父（ちち）の顔色（かおいろ）は少（すこ）し良（よ）くなっているように見（み）えました。看護師（かんごし）さんが「何（なに）を召し上がり（めしあがり）ますか」と優（やさ）しく聞（き）いてくれて、父（ちち）は温い（ぬるい）スープを一口（ひとくち）飲（の）みました。「これはちょっとぬるいね」と父（ちち）は笑（わら）いました。看護師（かんごし）さんはベッドのシーツも取り替えて（とりかえて）くれました。", "file": "e7a4fbbeab961bf4.mp3", "new": false}, {"sec": "故事", "text": "翌日、私はお見舞いに行きました。花屋で花を買って、病院の瓶に入れてあげました。それから、小さい人形も一つ持っていくと、父は子供みたいに喜んでくれました。看護師さんが部屋の床を掃いている間、私は読み終わった本を棚に戻しておきました。", "hint": "翌日（よくじつ）、私（わたし）はお見舞い（おみまい）に行（い）きました。花屋（はなや）で花（はな）を買（か）って、病院（びょういん）の瓶（びん）に入（い）れてあげました。それから、小（ちい）さい人形（にんぎょう）も一（ひと）つ持（も）っていくと、父（ちち）は子供（こども）みたいに喜（よろこ）んでくれました。看護師（かんごし）さんが部屋（へや）の床（ゆか）を掃いて（はいて）いる間（あいだ）、私（わたし）は読（よ）み終（お）わった本（ほん）を棚（たな）に戻して（もどして）おきました。", "file": "3ddd661abb2df634.mp3", "new": false}, {"sec": "故事", "text": "薬はとても苦くて、父はいつも顔をしかめていました。傷に薬を塗ってもらってから、痛みは少しずつなくなっていきました。ただ、疲れは少し残っているようで、医者さんに「お酒は当分止めるように」と言われ、なるべく休んだ方がいいとも言われました。", "hint": "薬（くすり）はとても苦くて（にがくて）、父（ちち）はいつも顔（かお）をしかめていました。傷（きず）に薬（くすり）を塗って（ぬって）もらってから、痛（いた）みは少（すこ）しずつなくなっていきました。ただ、疲（つか）れは少（すこ）し残って（のこって）いるようで、医者（いしゃ）さんに「お酒（さけ）は当分（とうぶん）止める（やめる）ように」と言（い）われ、なるべく休（やす）んだ方（ほう）がいいとも言（い）われました。", "file": "3a4552e7ee41f60a.mp3", "new": false}, {"sec": "故事", "text": "入院している間、田舎のおばあちゃんから電報が届きました。「早く元気になりますように」と書いてありました。", "hint": "入院（にゅういん）している間（あいだ）、田舎（いなか）のおばあちゃんから電報（でんぽう）が届（とど）きました。「早（はや）く元気（げんき）になりますように」と書（か）いてありました。", "file": "3364ac3dfea608ab.mp3", "new": false}, {"sec": "故事", "text": "一週間後、父は大分元気になりました。少し痩せてしまいましたが、医者さんに「来週、退院する予定です」と言われました。次の診察も予約して、父はやっと家に戻ることができました。息子の私は、父が元気になった様子を見て、本当に安心しました。", "hint": "一週間後（いっしゅうかんご）、父（ちち）は大分（だいぶ）元気（げんき）になりました。少（すこ）し痩せて（やせて）しまいましたが、医者（いしゃ）さんに「来週（らいしゅう）、退院（たいいん）する予定（よてい）です」と言（い）われました。次（つぎ）の診察（しんさつ）も予約（よやく）して、父（ちち）はやっと家（いえ）に戻る（もどる）ことができました。息子（むすこ）の私（わたし）は、父（ちち）が元気（げんき）になった様子（ようす）を見（み）て、本当（ほんとう）に安心（あんしん）しました。", "file": "4dc46046baf3af09.mp3", "new": false}, {"sec": "故事", "text": "先月、私は新しい町に引っ越しました。引っ越す日は朝から忙しくて、天気予報では雨と言っていましたが、幸い晴れていました。", "hint": "先月（せんげつ）、私（わたし）は新（あたら）しい町（まち）に引っ越し（ひっこし）ました。引っ越す（ひっこす）日（ひ）は朝（あさ）から忙（いそが）しくて、天気予報（てんきよほう）では雨（あめ）と言（い）っていましたが、幸（さいわ）い晴（は）れていました。", "file": "d3d321acea93a8e5.mp3", "new": false}, {"sec": "故事", "text": "新しい部屋の引き出しを開くと、とても深くて、奥に前の人に忘れられた指輪が入っていました。", "hint": "新（あたら）しい部屋（へや）の引き出し（ひきだし）を開く（ひらく）と、とても深くて（ふかくて）、奥（おく）に前（まえ）の人（ひと）に忘（わす）れられた指輪（ゆびわ）が入（はい）っていました。", "file": "c57638b2ef409499.mp3", "new": false}, {"sec": "故事", "text": "荷物を運んでいる時、隣の人と知り合いました。その人は昔、私の高校の先生に似ている気がしました。すると、聞いてみたら本当に学生時代に同じ学校にいたことが分かりました。", "hint": "荷物（にもつ）を運（はこ）んでいる時（とき）、隣（となり）の人（ひと）と知り合いました（しりあいました）。その人（ひと）は昔（むかし）、私（わたし）の高校（こうこう）の先生（せんせい）に似て（にて）いる気（き）がしました。すると、聞（き）いてみたら本当（ほんとう）に学生時代（じだい）に同（おな）じ学校（がっこう）にいたことが分（わ）かりました。", "file": "b5b8d72dc75676cb.mp3", "new": false}, {"sec": "故事", "text": "荷物を片付けながら、近くの売店で食料品を買いました。店員さんはとても親切でした。夜は疲れたので、新しい布団とまくらで早く寝ました。", "hint": "荷物（にもつ）を片付（かたづ）けながら、近（ちか）くの売店（ばいてん）で食料品（しょくりょうひん）を買（か）いました。店員（てんいん）さんはとても親切（しんせつ）でした。夜（よる）は疲（つか）れたので、新（あたら）しい布団（ふとん）とまくらで早（はや）く寝（ね）ました。", "file": "79f1725a74c7465e.mp3", "new": false}, {"sec": "故事", "text": "次の日、近所を散歩してみました。普通の道を歩いていたら、珍しいカフェを見つけました。店の中を回ってみると、大きくて柔らかすぎるパンを売っていました。私はケーキを一つ注文して、店員さんに半分に切ってもらいました。", "hint": "次（つぎ）の日（ひ）、近所（きんじょ）を散歩（さんぽ）してみました。普通（ふつう）の道（みち）を歩（ある）いていたら、珍しい（めずらしい）カフェを見（み）つけました。店（みせ）の中（なか）を回って（まわって）みると、大（おお）きくて柔らかすぎる（やわらかすぎる）パンを売（う）っていました。私（わたし）はケーキを一（ひと）つ注文（ちゅうもん）して、店員（てんいん）さんに半分（はんぶん）に切（き）ってもらいました。", "file": "96f956a4da903018.mp3", "new": false}, {"sec": "故事", "text": "そこで、道の太い木の下に小さいコインが落ちているのを拾いました。隣の家の猫は少し太ってしまったみたいでした。", "hint": "そこで、道（みち）の太い（ふとい）木（き）の下（した）に小（ちい）さいコインが落（お）ちているのを拾いました（ひろいました）。隣（となり）の家（いえ）の猫（ねこ）は少（すこ）し太って（ふとって）しまったみたいでした。", "file": "b0ff808caf1958ce.mp3", "new": false}, {"sec": "故事", "text": "夏が近づいてきたので、水着を買いに行くことにしました。店員さんは私に向いている色を選んでくれました。会計の時、値段が普通の倍になっていることに店員さんが気づきました。", "hint": "夏（なつ）が近（ちか）づいてきたので、水着（みずぎ）を買（か）いに行（い）くことにしました。店員（てんいん）さんは私（わたし）に向いて（むいて）いる色（いろ）を選（えら）んでくれました。会計（かいけい）の時（とき）、値段（ねだん）が普通（ふつう）の倍（ばい）になっていることに店員（てんいん）さんが気（き）づきました。", "file": "d489fc03b842cd7f.mp3", "new": false}, {"sec": "故事", "text": "家に帰ると、床が少し汚れていました。引っ越しの時に汚してしまったようです。拭きながら、りんごの皮を剥いて食べました。", "hint": "家（いえ）に帰（かえ）ると、床（ゆか）が少（すこ）し汚れて（よごれて）いました。引（ひ）っ越（こ）しの時（とき）に汚して（よごして）しまったようです。拭（ふ）きながら、りんごの皮（かわ）を剥いて（むいて）食（た）べました。", "file": "6f5161823d311701.mp3", "new": false}, {"sec": "故事", "text": "最後に、遠くに住んでいる友達へ贈り物を送ることにしました。プレゼントを丁寧に包んで、別の箱に入れました。指でリボンを結びました。", "hint": "最後（さいご）に、遠（とお）くに住（す）んでいる友達（ともだち）へ贈（おく）り物（もの）を送（おく）ることにしました。プレゼントを丁寧（ていねい）に包んで（つつんで）、別（べつ）の箱（はこ）に入（い）れました。指（ゆび）でリボンを結（むす）びました。", "file": "9a82add95c21bbab.mp3", "new": false}, {"sec": "故事", "text": "四月、私は大学に通うために、生まれた町を出て、一人で下宿することにした。駅の角を曲がって静かな道を通って五分のところに、古いが立派な家が建っている。近所にスーパーも図書館もあり、家賃も割合に安い。部屋探しは競争が激しく、この部屋が借りられたのは運がよかった。", "hint": "四月（しがつ）、私（わたし）は大学（だいがく）に通（かよ）うために、生（う）まれた町（まち）を出（で）て、一人（ひとり）で下宿することにした。駅（えき）の角を曲（ま）がって静（しず）かな道（みち）を通って五分（ごふん）のところに、古（ふる）いが立派な家（いえ）が建（た）っている。近所にスーパーも図書館（としょかん）もあり、家賃（やちん）も割合に安（やす）い。部屋探（へやさが）しは競争が激（はげ）しく、この部屋（へや）が借（か）りられたのは運（うん）がよかった。", "file": "72d72d2a976c0fba.mp3", "new": false}, {"sec": "故事", "text": "大家さんは玄関の暗号を教えてくれた。忘れないように、私はすぐ手帳にメモしておいた。部屋の鍵は少し緩くて、壁も粗い。けれども、窓が大きくて気分のいい部屋だ。カレンダーを掛けるために、壁に釘を打った。ボタンが取れたシャツは、糸と針で自分で直した。", "hint": "大家（おおや）さんは玄関（げんかん）の暗号を教（おし）えてくれた。忘（わす）れないように、私（わたし）はすぐ手帳（てちょう）にメモしておいた。部屋（へや）の鍵（かぎ）は少（すこ）し緩くて、壁（かべ）も粗い。けれども、窓（まど）が大（おお）きくて気分のいい部屋（へや）だ。カレンダーを掛けるために、壁（かべ）に釘（くぎ）を打った。ボタンが取（と）れたシャツは、糸と針（はり）で自分（じぶん）で直（なお）した。", "file": "048bc8e79e7cb42a.mp3", "new": false}, {"sec": "故事", "text": "引っ越しの日は本当に暑くて、シャツも髪も汗でひどい格好になった。夜、窓を開けたまま寝てしまった。眠たくて目を閉じたのに、眠りが浅く、何度も起きた。朝、玄関のドアを開けたら、大家さんが外に立っていた。「よく眠れた？」と笑って聞かれ、久しぶりに家族以外の人と挨拶をした。それで、この町の生活が始まった。", "hint": "引（ひ）っ越（こ）しの日（ひ）は本当（ほんとう）に暑くて、シャツも髪（かみ）も汗（あせ）でひどい格好になった。夜（よる）、窓（まど）を開（あ）けたまま寝（ね）てしまった。眠たくて目（め）を閉（と）じたのに、眠（ねむ）りが浅く、何度（なんど）も起（お）きた。朝（あさ）、玄関（げんかん）のドアを開（あ）けたら、大家（おおや）さんが外（そと）に立（た）っていた。「よく眠（ねむ）れた？」と笑（わら）って聞（き）かれ、久しぶりに家族（かぞく）以外（いがい）の人（ひと）と挨拶（あいさつ）をした。それで、この町（まち）の生活（せいかつ）が始（はじ）まった。", "file": "9b6d5ce44027b52e.mp3", "new": false}, {"sec": "故事", "text": "下宿を始めたころ、料理ができなかった。夕飯はコンビニの弁当か缶詰。いくら安くても栄養が足りない。朗らかな大家さんは「それじゃ体に悪いわよ」と笑った。そして台所で野菜の炒め方を教えてもらった。", "hint": "下宿を始（はじ）めたころ、料理（りょうり）ができなかった。夕飯はコンビニの弁当（べんとう）か缶詰。いくら安（やす）くても栄養が足（た）りない。朗らかな大家（おおや）さんは「それじゃ体（からだ）に悪（わる）いわよ」と笑（わら）った。そして台所（だいどころ）で野菜（やさい）の炒め方を教（おし）えてもらった。", "file": "5ff1e237af9d2a1e.mp3", "new": false}, {"sec": "故事", "text": "はじめは真似をするだけで、包丁の持ち方も変だった。音楽を聞きながら料理をしていたら、指を切ってしまい恥ずかしかった。大家さんは怒らないで、「気をつけて」と優しく言ってくれた。今は一人で作れるようになった。大家さんの猫に二日おきに餌をやる仕事も任された。", "hint": "はじめは真似をするだけで、包丁（ほうちょう）の持（も）ち方（かた）も変（へん）だった。音楽（おんがく）を聞（き）きながら料理（りょうり）をしていたら、指（ゆび）を切（き）ってしまい恥ずかしかった。大家（おおや）さんは怒らないで、「気をつけて」と優しく言（い）ってくれた。今（いま）は一人（ひとり）で作（つく）れるようになった。大家（おおや）さんの猫（ねこ）に二日（ふつか）おきに餌をやる仕事（しごと）も任（まか）された。", "file": "37e26bfa53ebcb2c.mp3", "new": false}, {"sec": "故事", "text": "夜遅くまで音楽を聞いていたので、隣の人が迷惑していたらしい。静かな町がいいと言ったのに、一番うるさいのは私だ。矛盾していると思う。それでも大家さんは好意で野菜を分けてくれる。おかげで食事はよくなった。", "hint": "夜（よる）遅（おそ）くまで音楽（おんがく）を聞（き）いていたので、隣（となり）の人（ひと）が迷惑していたらしい。静（しず）かな町（まち）がいいと言（い）ったのに、一番（いちばん）うるさいのは私（わたし）だ。矛盾していると思（おも）う。それでも大家（おおや）さんは好意で野菜（やさい）を分（わ）けてくれる。おかげで食事（しょくじ）はよくなった。", "file": "192275b5ea2ee9e2.mp3", "new": false}, {"sec": "故事", "text": "お礼に大家さんのお宅で料理をご馳走した。料理に興味が出て、作ることを楽しむようになった。それに、自分で作った物を食べると満足できる。二人の夕飯は愉快な時間だ。", "hint": "お礼（れい）に大家（おおや）さんのお宅で料理（りょうり）をご馳走した。料理（りょうり）に興味が出（で）て、作（つく）ることを楽しむようになった。それに、自分（じぶん）で作（つく）った物（もの）を食（た）べると満足できる。二人（ふたり）の夕飯は愉快な時間（じかん）だ。", "file": "329b8324380e0acf.mp3", "new": false}, {"sec": "故事", "text": "十一月のある夜、部屋が急に大きく揺れた。棚の本が落ちて、電気も消えてしまった。あまりに怖くて体が動かなかった。さっきまで笑っていたのに、と思った。母は電話で今にも泣きそうな声を出し、ずいぶん心配していた。それから、一般に危ないと言われる場所は避けるようにしている。", "hint": "十一月（じゅういちがつ）のある夜（よる）、部屋（へや）が急（きゅう）に大（おお）きく揺れた。棚（たな）の本（ほん）が落（お）ちて、電気（でんき）も消えてしまった。あまりに怖くて体（からだ）が動（うご）かなかった。さっきまで笑（わら）っていたのに、と思（おも）った。母（はは）は電話（でんわ）で今（いま）にも泣（な）きそうな声（こえ）を出（だ）し、ずいぶん心配していた。それから、一般に危（あぶ）ないと言（い）われる場所（ばしょ）は避けるようにしている。", "file": "74a8b521e602317d.mp3", "new": false}, {"sec": "故事", "text": "春、大家さんに誘われ田舎の墓参りに行った。ご主人は十年前に亡くなったそうだ。「別れても、気持ちは永遠に消えないのよ」と大家さんは静かに言った。少し悲しかったが、その言葉で幸せな気持ちにもなった。帰りに二人で記念の写真を写した。この写真を見るたびに、この町を思い出すだろう。", "hint": "春（はる）、大家（おおや）さんに誘（さそ）われ田舎（いなか）の墓参（まい）りに行（い）った。ご主人（しゅじん）は十年前（じゅうねんまえ）に亡（な）くなったそうだ。「別れても、気持ちは永遠に消えないのよ」と大家（おおや）さんは静（しず）かに言（い）った。少（すこ）し悲しかったが、その言葉（ことば）で幸せな気持ちにもなった。帰（かえ）りに二人（ふたり）で記念の写真（しゃしん）を写した。この写真（しゃしん）を見（み）るたびに、この町（まち）を思（おも）い出（だ）すだろう。", "file": "cef1739fa0568ee8.mp3", "new": false}, {"sec": "故事", "text": "この頃は卒業のことばかり考えている。この一年しっかり勉強したおかげで、東京の会社で働くことになった。電話で「おめでとうございます」と言われ、涙が出た。要らない物を捨てて荷物が少なくなり、掃除も楽になった。大家さんと別れるのは寂しい。けれども、新しい生活も楽しみだ。", "hint": "この頃は卒業（そつぎょう）のことばかり考（かんが）えている。この一年（いちねん）しっかり勉強（べんきょう）したおかげで、東京（とうきょう）の会社（かいしゃ）で働くことになった。電話（でんわ）で「おめでとうございます」と言（い）われ、涙（なみだ）が出（で）た。要（い）らない物（もの）を捨てて荷物（にもつ）が少（すく）なくなり、掃除（そうじ）も楽になった。大家（おおや）さんと別れるのは寂（さび）しい。けれども、新（あたら）しい生活（せいかつ）も楽しみだ。", "file": "95c843fb09be95d9.mp3", "new": false}, {"sec": "故事", "text": "学部の講義が、今日で終わりになった。教室に学生たちが揃ったのを見て、先生は静かに笑った。卒業するために、みんな一生懸命勉強してきた四年間だった。", "hint": "学部の講義が、今日（きょう）で終わりになった。教室に学生（がくせい）たちが揃ったのを見（み）て、先生（せんせい）は静（しず）かに笑（わら）った。卒業（そつぎょう）するために、みんな一生懸命勉強してきた四年間（よねんかん）だった。", "file": "c4019d3e6e7e0fb4.mp3", "new": false}, {"sec": "故事", "text": "厳しい先生の質問は簡単ではなかった。レポートの事柄について、友達に探すのを手伝ってもらい、助かった。鉛筆で書いたメモを見ながら確かめて、答えをノートに書いておいた。先生は、みんなのために例えば面接の受け方も教えてくれた。", "hint": "厳しい先生（せんせい）の質問（しつもん）は簡単ではなかった。レポートの事柄について、友達（ともだち）に探すのを手伝ってもらい、助かった。鉛筆で書（か）いたメモを見（み）ながら確かめて、答（こた）えをノートに書（か）いておいた。先生（せんせい）は、みんなのために例えば面接（めんせつ）の受（う）け方（かた）も教えてくれた。", "file": "6185e3b66d6b6745.mp3", "new": false}, {"sec": "故事", "text": "活動の最後の日、みんなが一緒に集まって、写真を撮った。長時間座っていたので、腰が痛くなった人もいた。遅れて来た友達は「ごめん」と謝った。いいよと言ったのに、彼はまだ気にしていた。", "hint": "活動の最後（さいご）の日（ひ）、みんなが一緒に集まって、写真（しゃしん）を撮（と）った。長時間（ちょうじかん）座（すわ）っていたので、腰が痛（いた）くなった人（ひと）もいた。遅（おく）れて来（き）た友達（ともだち）は「ごめん」と謝った。いいよと言（い）ったのに、彼（かれ）はまだ気（き）にしていた。", "file": "abbcafeccd23d65d.mp3", "new": false}, {"sec": "故事", "text": "入社したばかりのころ、会社の規則はそれほど多くなかったが、ちゃんと守らなければならないことも多かった。先輩は普段から優しく、直接やり方を教えてくれた。", "hint": "入社（にゅうしゃ）したばかりのころ、会社（かいしゃ）の規則はそれほど多（おお）くなかったが、ちゃんと守（まも）らなければならないことも多（おお）かった。先輩（せんぱい）は普段から優（やさ）しく、直接やり方（かた）を教（おし）えてくれた。", "file": "7ced1192c93ed3ee.mp3", "new": false}, {"sec": "故事", "text": "ある日、本社へ出張することになった。先輩が地図を見たら、駅までちょうど三十分だと分かった。仕事が積もっていたが、早く終わらせて準備した後で出掛けた。", "hint": "ある日（ひ）、本社（ほんしゃ）へ出張（しゅっちょう）することになった。先輩（せんぱい）が地図を見（み）たら、駅（えき）までちょうど三十分（さんじゅっぷん）だと分（わ）かった。仕事（しごと）が積もっていたが、早（はや）く終（お）わらせて準備した後（あと）で出掛けた。", "file": "c6932bb266bee412.mp3", "new": false}, {"sec": "故事", "text": "出発の朝、戸を開けると突然雨が降ってきた。風が強くて、傘が壊れそうだった。それでも傘があれば雨を防げると思った。先輩が私を駅まで連れて行ってくれた。電車の放送を聞きながら、資料の字が小さくて読みにくいと思った。", "hint": "出発（しゅっぱつ）の朝（あさ）、戸を開（あ）けると突然雨（あめ）が降（ふ）ってきた。風（かぜ）が強（つよ）くて、傘（かさ）が壊（こわ）れそうだった。それでも傘（かさ）があれば雨（あめ）を防げると思（おも）った。先輩（せんぱい）が私（わたし）を駅（えき）まで連れて行ってくれた。電車（でんしゃ）の放送を聞（き）きながら、資料（しりょう）の字（じ）が小（ちい）さくて読（よ）みにくいと思（おも）った。", "file": "360a6d9692f6f6d7.mp3", "new": false}, {"sec": "故事", "text": "この会社に勤めてまだ半年だが、仕事は少しずつ進んでいる。早退したり残業したりする日もあるが、調子はいい。連休の前に本社へ電話したら、担当者は留守で、外に出ているらしかった。", "hint": "この会社（かいしゃ）に勤めてまだ半年（はんとし）だが、仕事（しごと）は少（すこ）しずつ進んでいる。早退したり残業したりする日（ひ）もあるが、調子はいい。連休の前（まえ）に本社（ほんしゃ）へ電話（でんわ）したら、担当者（たんとうしゃ）は留守で、外に出（で）ているらしかった。", "file": "3c3a66ffc2cb8d93.mp3", "new": false}, {"sec": "故事", "text": "本社に着くと、私は「ただいま参りました」と挨拶した。部長はいつも命令をなさる方だと聞いていたので、少し緊張した。資料を拝見してもいいですかと聞くと、部長はいいよと言ってくれた。", "hint": "本社に着（つ）くと、私（わたし）は「ただいま参りました」と挨拶（あいさつ）した。部長（ぶちょう）はいつも命令をなさる方（かた）だと聞（き）いていたので、少（すこ）し緊張（きんちょう）した。資料（しりょう）を拝見してもいいですかと聞（き）くと、部長（ぶちょう）はいいよと言（い）ってくれた。", "file": "4cce33753302529d.mp3", "new": false}, {"sec": "故事", "text": "打ち合わせのとき、緊張していた私は、大事な資料を忘れてきてしまった。向こうの会社の人口データを用いて説明したが、見方が合わず、少し摩擦が生まれた。それでも部長は「大丈夫」と信用してくれ、信頼できる社員になるまで待つと言ってくれた。", "hint": "打（う）ち合（あ）わせのとき、緊張（きんちょう）していた私（わたし）は、大事（だいじ）な資料（しりょう）を忘（わす）れてきてしまった。向こうの会社（かいしゃ）の人口データを用いて説明（せつめい）したが、見方が合（あ）わず、少（すこ）し摩擦が生（う）まれた。それでも部長（ぶちょう）は「大丈夫（だいじょうぶ）」と信用してくれ、信頼できる社員（しゃいん）になるまで待（ま）つと言（い）ってくれた。", "file": "fac4d59cdebd1ca1.mp3", "new": false}, {"sec": "故事", "text": "仕事が終わると、みんなで二次会に行った。居酒屋の灰皿の横で、部長は冷房が強すぎると言って窓を閉めた。私は熱い湯を飲んで少し落ち着いた。帰りに領収書をもらうのを忘れないようにした。", "hint": "仕事（しごと）が終（お）わると、みんなで二次会に行（い）った。居酒屋（いざかや）の灰皿の横（よこ）で、部長（ぶちょう）は冷房が強（つよ）すぎると言（い）って窓（まど）を閉（し）めた。私（わたし）は熱（あつ）い湯を飲（の）んで少（すこ）し落（お）ち着（つ）いた。帰（かえ）りに領収書をもらうのを忘（わす）れないようにした。", "file": "77ebf78783e405b4.mp3", "new": false}, {"sec": "故事", "text": "この出張には用がもう一つあった。社内コンテストの賞金を受け取ることだ。窓のガラスに夕日が反射してきれいだった。出発した日から、私は少しずつ自信を持って話せるようになった。いつか本社で活躍することが、今の私の夢だ。", "hint": "この出張（しゅっちょう）には用がもう一（ひと）つあった。社内（しゃない）コンテストの賞金を受（う）け取（と）ることだ。窓（まど）のガラスに夕日（ゆうひ）が反射してきれいだった。出発した日（ひ）から、私（わたし）は少（すこ）しずつ自信（じしん）を持（も）って話（はな）せるようになった。いつか本社で活躍（かつやく）することが、今（いま）の私（わたし）の夢だ。", "file": "61ed25ffd40bafdd.mp3", "new": false}, {"sec": "故事", "text": "私は高校生です。今は三年生で、毎朝七時に家を出ています。電車で三十分。朝はいつも忙しいです。でも、朝食はきちんと食べます。", "hint": "私（わたし）は高校生です。今（いま）は三年生（さんねんせい）で、毎朝（まいあさ）七時（しちじ）に家（いえ）を出（で）ています。電車（でんしゃ）で三十分（さんじゅっぷん）。朝（あさ）はいつも忙（いそが）しいです。でも、朝食はきちんと食（た）べます。", "file": "df7e50ae16c07734.mp3", "new": true}, {"sec": "故事", "text": "いつもみんなより先に教室に着きます。みんなは、まだ家にいるでしょう。「今日も一番だ」と思いながら、最初に黒板をきれいにします。かばんの中には、教科書と消しゴムが入っています。それを机の上に出しておきます。", "hint": "いつもみんなより先に教室（きょうしつ）に着（つ）きます。みんなは、まだ家（いえ）にいるでしょう。「今日（きょう）も一番（いちばん）だ」と思（おも）いながら、最初に黒板をきれいにします。かばんの中（なか）には、教科書と消しゴムが入（はい）っています。それを机（つくえ）の上（うえ）に出（だ）しておきます。", "file": "48c121d37886c847.mp3", "new": true}, {"sec": "故事", "text": "私の担任の先生は、やさしい人です。名前は山田。分からないことがあると、いつも「ゆっくりでいいですよ」と言ってくれます。", "hint": "私（わたし）の担任の先生（せんせい）は、やさしい人（ひと）です。名前（なまえ）は山田（やまだ）。分（わ）からないことがあると、いつも「ゆっくりでいいですよ」と言（い）ってくれます。", "file": "36545e27851486de.mp3", "new": true}, {"sec": "故事", "text": "しばらくして、友達の田中さんが来ました。「おはよう、今日も早いね」と、いつも声をかけてくれます。", "hint": "しばらくして、友達（ともだち）の田中（たなか）さんが来（き）ました。「おはよう、今日（きょう）も早（はや）いね」と、いつも声（こえ）をかけてくれます。", "file": "c81bccb15be5d00f.mp3", "new": true}, {"sec": "故事", "text": "今日は体育の時間。生徒が皆でグラウンドを走っています。三十分ぐらい走ると、とても暑くなります。「ああ、冷たい水が飲みたい」と思いました。", "hint": "今日（きょう）は体育の時間（じかん）。生徒が皆でグラウンドを走（はし）っています。三十分（さんじゅっぷん）ぐらい走（はし）ると、とても暑（あつ）くなります。「ああ、冷（つめ）たい水（みず）が飲（の）みたい」と思（おも）いました。", "file": "91684f4976e0db63.mp3", "new": true}, {"sec": "故事", "text": "私は国語の時間が好きです。知らない言葉に出会うと、すぐ辞書で調べます。家には、父の古い辞典もあります。", "hint": "私（わたし）は国語の時間（じかん）が好（す）きです。知（し）らない言葉に出会（であ）うと、すぐ辞書で調（しら）べます。家（うち）には、父（ちち）の古（ふる）い辞典もあります。", "file": "c0803f910b38f74e.mp3", "new": true}, {"sec": "故事", "text": "辞典を開くと、小さい字がたくさん。「へえ、こんな言葉もある」と思って、読んでいるだけで面白いです。調べた言葉は、ノートに書いておきます。", "hint": "辞典を開（ひら）くと、小さい字（じ）がたくさん。「へえ、こんな言葉もある」と思（おも）って、読（よ）んでいるだけで面白いです。調（しら）べた言葉は、ノートに書（か）いておきます。", "file": "e62b9fac7de04d5f.mp3", "new": true}, {"sec": "故事", "text": "数学の時間は、数字と計算がたくさん。実は、数学はあまり好きではありません。「また間違えた」と思いながら、答えが違うところを赤いペンで直しています。分からないところは、友達に教えてもらいます。", "hint": "数学の時間（じかん）は、数字と計算がたくさん。実（じつ）は、数学はあまり好（す）きではありません。「また間違（まちが）えた」と思（おも）いながら、答（こた）えが違（ちが）うところを赤いペンで直（なお）しています。分（わ）からないところは、友達（ともだち）に教（おし）えてもらいます。", "file": "6286e39c730cad96.mp3", "new": true}, {"sec": "故事", "text": "宿題は、毎日たくさん。多い日は、ねるのが遅くなります。だから、早くやっておきます。今週の宿題は、作文。それを、昨日から書き始めました。先生は少し読んで、「いいですね、がんばってください」と言ってくれました。", "hint": "宿題は、毎日（まいにち）たくさん。多（おお）い日（ひ）は、ねるのが遅（おそ）くなります。だから、早（はや）くやっておきます。今週（こんしゅう）の宿題は、作文。それを、昨日（きのう）から書（か）き始（はじ）めました。先生（せんせい）は少（すこ）し読（よ）んで、「いいですね、がんばってください」と言（い）ってくれました。", "file": "d189818a23765624.mp3", "new": true}, {"sec": "故事", "text": "私は小学校のとき、毎日外で遊んでいました。友達と、公園でサッカー。宿題は、あまりしませんでした。", "hint": "私（わたし）は小学校のとき、毎日（まいにち）外（そと）で遊（あそ）んでいました。友達（ともだち）と、公園（こうえん）でサッカー。宿題は、あまりしませんでした。", "file": "101cb85c0692b5ca.mp3", "new": true}, {"sec": "故事", "text": "中学生のころも、ちっとも勉強しませんでした。「勉強は、つまらない」と思っていたからです。でも、中学校を出て高校に入るまでの間に、私は変わりました。勉強するようになりました。", "hint": "中学生のころも、ちっとも勉強（べんきょう）しませんでした。「勉強（べんきょう）は、つまらない」と思（おも）っていたからです。でも、中学校を出（で）て高校に入（はい）るまでの間に、私（わたし）は変（か）わりました。勉強（べんきょう）するようになりました。", "file": "dbe9e31b1266f034.mp3", "new": true}, {"sec": "故事", "text": "夏休みは、毎日図書館で過ごしていました。大学に入るために、毎日勉強していました。先生はいつも「適当に覚えないで、自分の知恵を使いなさい」と言います。まず、単純な問題を選んで、「これなら私にもできる」と思いながら、順番に解き始めました。", "hint": "夏休（なつやす）みは、毎日（まいにち）図書館（としょかん）で過ごしていました。大学（だいがく）に入（はい）るために、毎日（まいにち）勉強（べんきょう）していました。先生（せんせい）はいつも「適当に覚（おぼ）えないで、自分（じぶん）の知恵を使（つか）いなさい」と言（い）います。まず、単純な問題（もんだい）を選（えら）んで、「これなら私（わたし）にもできる」と思（おも）いながら、順番（じゅんばん）に解（と）き始（はじ）めました。", "file": "b8006d599bc57ef6.mp3", "new": true}, {"sec": "故事", "text": "勉強は、だんだん楽しい時間に。正直に言うと、あの夏の経験が、今の私を作っています。", "hint": "勉強（べんきょう）は、だんだん楽（たの）しい時間（じかん）に。正直に言（い）うと、あの夏（なつ）の経験が、今（いま）の私（わたし）を作（つく）っています。", "file": "39d419aa73faeefd.mp3", "new": true}, {"sec": "故事", "text": "試験の前の日は、あまりねませんでした。試験の朝、私は緊張して、頭が痛くなりました。考えれば考えるほど、心配でした。", "hint": "試験（しけん）の前（まえ）の日（ひ）は、あまりねませんでした。試験（しけん）の朝（あさ）、私（わたし）は緊張して、頭（あたま）が痛（いた）くなりました。考（かんが）えれば考（かんが）えるほど、心配（しんぱい）でした。", "file": "bfe9bfdf34f00bfd.mp3", "new": true}, {"sec": "故事", "text": "「自信を持って、あなたを信じているよ」と言いながら、母が薬を持ってきてくれました。朝ごはんは、ほんの少し。", "hint": "「自信を持（も）って、あなたを信じているよ」と言（い）いながら、母（はは）が薬を持（も）ってきてくれました。朝（あさ）ごはんは、ほんの少（すこ）し。", "file": "cee5781f34250146.mp3", "new": true}, {"sec": "故事", "text": "学校に着くと、泣いている子もいました。隣の子も、今にも泣きそうでした。友達にゆっくり話してもらい、「大丈夫、だれでも緊張するよ」と言われて、少し楽になりました。", "hint": "学校（がっこう）に着（つ）くと、泣いている子（こ）もいました。隣（となり）の子（こ）も、今（いま）にも泣きそうでした。友達（ともだち）にゆっくり話（はな）してもらい、「大丈夫（だいじょうぶ）、だれでも緊張するよ」と言（い）われて、少（すこ）し楽（らく）になりました。", "file": "1dc22bbe10fa06ed.mp3", "new": true}, {"sec": "故事", "text": "発表の日。すぐにパソコンを開きました。自分の番号を見つけて、びっくりしました。本当に合格していて、成績も素晴らしかったです。母に電話すると、母の声もうれしそうでした。", "hint": "発表（はっぴょう）の日（ひ）。すぐにパソコンを開（ひら）きました。自分（じぶん）の番号（ばんごう）を見（み）つけて、びっくりしました。本（ほん）当（あ）に合格していて、成績も素晴らしかったです。母（はは）に電話（でんわ）すると、母（はは）の声（こえ）もうれしそうでした。", "file": "f24fd44d2eb8b823.mp3", "new": true}, {"sec": "故事", "text": "いよいよ、来週は卒業する日です。私たちは、三年間、この学校にいました。式の日程は、もう決まっています。", "hint": "いよいよ、来週（らいしゅう）は卒業する日（ひ）です。私（わたし）たちは、三年間（さんねんかん）、この学校（がっこう）にいました。式（しき）の日程は、もう決（き）まっています。", "file": "b343e27345f55134.mp3", "new": false}, {"sec": "故事", "text": "今年は予算が少なくて、飾りを買うお金がありません。先生に「飾りは自分たちで作らなければならない」と言われていました。前の日、私たちは講堂に椅子を運びました。", "hint": "今年（ことし）は予算が少（すく）なくて、飾（かざ）りを買（か）うお金（かね）がありません。先生（せんせい）に「飾（かざ）りは自分（じぶん）たちで作（つく）らなければならない」と言（い）われていました。前（まえ）の日（ひ）、私（わたし）たちは講堂に椅子（いす）を運びました。", "file": "24eebac529b041f9.mp3", "new": true}, {"sec": "故事", "text": "椅子は、思ったより目方があったので、友達に手伝ってもらって、二人で運んでいました。でも、うっかり手を離して、「あっ」と思った時には、もう遅かったです。椅子を横の花瓶に当ててしまいました。花瓶は割れていました。", "hint": "椅子（いす）は、思（おも）ったより目方があったので、友達（ともだち）に手伝（てつだ）ってもらって、二人（ふたり）で運んでいました。でも、うっかり手（て）を離して、「あっ」と思（おも）った時（とき）には、もう遅（おそ）かったです。椅子（いす）を横（よこ）の花瓶（かびん）に当（あ）ててしまいました。花瓶（かびん）は割れていました。", "file": "1103b906e6f5d560.mp3", "new": true}, {"sec": "故事", "text": "在校生たちが来て、いっしょに飾りを作ってくれました。夕方までに、飾りが全部できていました。明日の式のために、みんなでがんばっています。明日は、きっといい式になるでしょう。", "hint": "在校生たちが来（き）て、いっしょに飾（かざ）りを作（つく）ってくれました。夕方までに、飾（かざ）りが全部（ぜんぶ）できていました。明日（あした）の式（しき）のために、みんなでがんばっています。明日（あした）は、きっといい式（しき）になるでしょう。", "file": "ee9b0d6c8e75f692.mp3", "new": true}, {"sec": "故事", "text": "式の朝、かばんの中を見ておきました。忘れ物はありません。「よし、これで大丈夫だ」と思いました。空は、とてもきれい。", "hint": "式（しき）の朝（あさ）、かばんの中（なか）を見（み）ておきました。忘れ物はありません。「よし、これで大丈夫（だいじょうぶ）だ」と思（おも）いました。空（そら）は、とてもきれい。", "file": "0500472a16fcfbb5.mp3", "new": true}, {"sec": "故事", "text": "校庭では、在校生たちが花びらを撒く練習をしていました。皆で講堂に入ると、中はいつもより静か。南の窓から、朝日が入ってきました。", "hint": "校庭では、在校生たちが花（はな）びらを撒く練習（れんしゅう）をしていました。皆で講堂に入（はい）ると、中（なか）はいつもより静（しず）か。南の窓（まど）から、朝日（あさひ）が入（はい）ってきました。", "file": "fafc6234291d6394.mp3", "new": true}, {"sec": "故事", "text": "校長先生は、私たちの教育について話し、世界的に有名な人の話も紹介しました。「いい話だ」と思っていると、友達が泣いていました。その友達は、「泣かない」と言ったのに、泣いてしまいました。", "hint": "校長先生（せんせい）は、私（わたし）たちの教育について話（はな）し、世界的に有名（ゆうめい）な人（ひと）の話（はなし）も紹介（しょうかい）しました。「いい話（はなし）だ」と思（おも）っていると、友達（ともだち）が泣いていました。その友達（ともだち）は、「泣かない」と言（い）ったのに、泣いてしまいました。", "file": "9c6aa4bd7bfe2f57.mp3", "new": true}, {"sec": "故事", "text": "式のあと、先生から万年筆をもらいました。用事がある人は先に帰りましたが、私は夕方まで校庭にいました。この万年筆を見るたびに、この学校を思い出すでしょう。", "hint": "式（しき）のあと、先生（せんせい）から万年筆をもらいました。用事がある人（ひと）は先に帰（かえ）りましたが、私（わたし）は夕方まで校庭にいました。この万年筆を見（み）るたびに、この学校（がっこう）を思（おも）い出（だ）すでしょう。", "file": "db0b33bd6b591e6c.mp3", "new": false}, {"sec": "故事", "text": "来年から、私は大学生です。趣味の時間も作って、英語の本も読めるようになりたいです。", "hint": "来年（らいねん）から、私（わたし）は大学生です。趣味の時間（じかん）も作（つく）って、英語（えいご）の本（ほん）も読（よ）めるようになりたいです。", "file": "bb794112a1c48f93.mp3", "new": false}];
const N_NEW = 23, LAST_AT = "2026-09-21";
const KEY = "audiocheck-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
// 有「本次新增」就預設只列那批（課多了以後全部一起聽不完），沒有就列全部
let filter = N_NEW ? "new" : "all";
document.getElementById("newnote").textContent = N_NEW
  ? "本次新增 "+N_NEW+" 段（"+LAST_AT+" 產生）。先聽這批就好；其餘的之前已經聽過。"
  : "沒有「本次新增」清單（generate-audio.py 沒產新檔），顯示全部。";
let audio = new Audio();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function play(f){ audio.pause(); audio = new Audio("audio/"+f); audio.play(); }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let ok=0,ng=0;
  ITEMS.forEach((it,i)=>{
    const st = state[it.file];
    if(st==="ok") ok++; if(st==="ng") ng++;
    if(filter==="new" && !it.new) return;
    if(filter==="todo" && st) return;
    if(filter==="ng" && st!=="ng") return;
    const row = document.createElement("div");
    row.className = "row" + (st==="ok"?" done-ok":st==="ng"?" done-ng":"");
    row.innerHTML =
      '<span class="sec">'+it.sec+'</span>'+
      '<div class="grow"><div class="jp" lang="ja">'+esc(it.text)+'</div>'+
      '<div class="hint">應讀：'+esc(it.hint)+'</div></div>'+
      '<div class="acts">'+
      '<button data-p="'+i+'">▶</button>'+
      '<button data-ok="'+i+'" class="'+(st==="ok"?"on-ok":"")+'">✓</button>'+
      '<button data-ng="'+i+'" class="'+(st==="ng"?"on-ng":"")+'">✗</button>'+
      '</div>';
    list.appendChild(row);
  });
  document.getElementById("prog").textContent =
    "　已檢查 "+(ok+ng)+" / "+ITEMS.length+"（讀錯 "+ng+"）";
  const bad = ITEMS.filter(it=>state[it.file]==="ng");
  document.getElementById("out").value = bad.length
    ? bad.map(it=> it.sec==="單字"
        ? '"'+it.text+'": "'+it.hint+'",'
        : '// '+it.sec+'：'+it.text+'（應讀 '+it.hint+'）\n"": "",'
      ).join("\n")
    : "（目前沒有標記讀錯的）";
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

document.getElementById("list").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.p!=null) play(ITEMS[b.dataset.p].file);
  if(b.dataset.ok!=null){ const f=ITEMS[b.dataset.ok].file; state[f]=state[f]==="ok"?undefined:"ok"; save(); render(); }
  if(b.dataset.ng!=null){ const f=ITEMS[b.dataset.ng].file; state[f]=state[f]==="ng"?undefined:"ng"; save(); render(); }
});
document.querySelector(".bar").addEventListener("click",e=>{
  if(e.target.dataset.f){ filter=e.target.dataset.f; render(); }
  if(e.target.id==="reset" && confirm("清除所有檢查進度？")){ state={}; save(); render(); }
});
render();
</script>
</html>
