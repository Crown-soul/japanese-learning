 "new": true}, {"sec": "單字", "text": "以下", "hint": "いか", "file": "affa1bf98e44f9ec.mp3", "new": true}, {"sec": "單字", "text": "身分証", "hint": "みぶんしょう", "file": "f98241a84e71981b.mp3", "new": true}, {"sec": "單字", "text": "料金", "hint": "りょうきん", "file": "cb9ff9092a1abc35.mp3", "new": true}, {"sec": "例句", "text": "父が急に倒れてしまいました。", "hint": "倒れる＝たおれる", "file": "9eadc11d387b8996.mp3", "new": false}, {"sec": "例句", "text": "父の様子がおかしかったので、救急車を呼びました。", "hint": "様子＝ようす", "file": "2f972f6fecf7b539.mp3", "new": false}, {"sec": "例句", "text": "部屋の隅で倒れていました。", "hint": "隅＝すみ", "file": "c0bf664a18de5e1d.mp3", "new": false}, {"sec": "例句", "text": "医者さんがすぐに検査をしてくれました。", "hint": "医者＝いしゃ", "file": "fc90c11903bab3da.mp3", "new": false}, {"sec": "例句", "text": "頭が痛かったんですね。", "hint": "頭＝あたま", "file": "004bcf947994aef1.mp3", "new": false}, {"sec": "例句", "text": "注射をしなければならないと言われました。", "hint": "注射する＝ちゅうしゃする", "file": "c3a5ca9574e87eb9.mp3", "new": false}, {"sec": "例句", "text": "特別な部屋は空いていませんでした。", "hint": "特別＝とくべつ", "file": "0628f4935c61fcc0.mp3", "new": false}, {"sec": "例句", "text": "入院の支度をしました。", "hint": "支度する＝したくする", "file": "b13a76e13f430b5a.mp3", "new": false}, {"sec": "例句", "text": "着替えや歯ブラシを用意しました。", "hint": "用意する＝よういする", "file": "06b93344ceb7550f.mp3", "new": false}, {"sec": "例句", "text": "お粥を炊いて持っていきました。", "hint": "炊く＝たく", "file": "a469550b64699828.mp3", "new": false}, {"sec": "例句", "text": "病室の電灯がつきました。", "hint": "電灯＝でんとう", "file": "46066fdb376ac481.mp3", "new": false}, {"sec": "例句", "text": "電灯がつく。", "hint": "つく＝つく", "file": "76ff4fc8417e6e40.mp3", "new": false}, {"sec": "例句", "text": "何を召し上がりますか。", "hint": "召し上がる＝めしあがる", "file": "1428d442a2d867bf.mp3", "new": false}, {"sec": "例句", "text": "これはちょっとぬるいね。", "hint": "温い＝ぬるい", "file": "5717005b82daf2f2.mp3", "new": false}, {"sec": "例句", "text": "シーツを取り替えてくれました。", "hint": "取り替える＝とりかえる", "file": "1401325b4afbebfb.mp3", "new": false}, {"sec": "例句", "text": "翌日、お見舞いに行きました。", "hint": "お見舞い＝おみまい", "file": "051b90dc47410aae.mp3", "new": false}, {"sec": "例句", "text": "花屋で花を買いました。", "hint": "花＝はな", "file": "b7a41554cd93ad7f.mp3", "new": false}, {"sec": "例句", "text": "病院の瓶に入れてあげました。", "hint": "瓶＝びん", "file": "651299a78aff5a8c.mp3", "new": false}, {"sec": "例句", "text": "小さい人形も持っていきました。", "hint": "人形＝にんぎょう", "file": "bb59c31be476d594.mp3", "new": false}, {"sec": "例句", "text": "看護師さんが床を掃いていました。", "hint": "掃く＝はく", "file": "42d01b3f8daf840d.mp3", "new": false}, {"sec": "例句", "text": "本を棚に戻しておきました。", "hint": "戻す＝もどす", "file": "d7b3e3c526c804ae.mp3", "new": false}, {"sec": "例句", "text": "薬はとても苦かったです。", "hint": "苦い＝にがい", "file": "f4bec9447bf063bf.mp3", "new": false}, {"sec": "例句", "text": "傷に薬を塗ってもらいました。", "hint": "塗る＝ぬる", "file": "d0307c91c93b6cf9.mp3", "new": false}, {"sec": "例句", "text": "痛みは少しずつなくなっていきました。", "hint": "なくなる＝なくなる", "file": "f7817e265bbf1753.mp3", "new": false}, {"sec": "例句", "text": "疲れは少し残っているようです。", "hint": "残る＝のこる", "file": "7048825c12b30e37.mp3", "new": false}, {"sec": "例句", "text": "お酒は当分止めるように言われました。", "hint": "止める＝やめる", "file": "b16600d7a2fd8648.mp3", "new": false}, {"sec": "例句", "text": "なるべく休んだ方がいいです。", "hint": "なるべく＝なるべく", "file": "8a2303b7628609c7.mp3", "new": false}, {"sec": "例句", "text": "なるほど、少し前から痛かったんですね。", "hint": "なるほど＝なるほど", "file": "434d5c1cb084b23d.mp3", "new": false}, {"sec": "例句", "text": "おばあちゃんから電報が届きました。", "hint": "電報＝でんぽう", "file": "d5c9cadeeb241912.mp3", "new": false}, {"sec": "例句", "text": "父は大分元気になりました。", "hint": "大分＝だいぶ", "file": "55db712275216cce.mp3", "new": false}, {"sec": "例句", "text": "少し痩せてしまいました。", "hint": "痩せる＝やせる", "file": "69b98d197092d8aa.mp3", "new": false}, {"sec": "例句", "text": "来週、退院する予定です。", "hint": "予定＝よてい", "file": "d306ba66977c9bc4.mp3", "new": false}, {"sec": "例句", "text": "次の診察も予約しました。", "hint": "予約する＝よやくする", "file": "74e1746a99cab5f5.mp3", "new": false}, {"sec": "例句", "text": "家に戻ることができました。", "hint": "戻る＝もどる", "file": "f7e03482de532879.mp3", "new": false}, {"sec": "例句", "text": "息子の私は、本当に安心しました。", "hint": "息子＝むすこ", "file": "e03ddd62023a149b.mp3", "new": false}, {"sec": "例句", "text": "新しい町に引っ越しました。", "hint": "引っ越す＝ひっこす", "file": "0b773e95b7fb6c8a.mp3", "new": false}, {"sec": "例句", "text": "学生時代に同じ学校にいたことが分かりました。", "hint": "時代＝じだい", "file": "44d076bbba263f6a.mp3", "new": false}, {"sec": "例句", "text": "天気予報では雨と言っていました。", "hint": "天気予報＝てんきよほう", "file": "d264f35c7045885d.mp3", "new": false}, {"sec": "例句", "text": "新しい部屋の引き出しを開くと…。", "hint": "引き出し＝ひきだし", "file": "a6048534c54f149a.mp3", "new": false}, {"sec": "例句", "text": "引き出しを開くと、指輪が入っていました。", "hint": "開く＝ひらく", "file": "ee8cc215545f22c9.mp3", "new": false}, {"sec": "例句", "text": "引き出しはとても深かったです。", "hint": "深い＝ふかい", "file": "81ecf2bb1ff45e11.mp3", "new": false}, {"sec": "例句", "text": "奥に指輪が入っていました。", "hint": "指輪＝ゆびわ", "file": "fe2e9886a378fd21.mp3", "new": false}, {"sec": "例句", "text": "隣の人と知り合いました。", "hint": "知り合う＝しりあう", "file": "f7b9f24fc7b25834.mp3", "new": false}, {"sec": "例句", "text": "高校の先生に似ている気がしました。", "hint": "似る＝にる", "file": "0876af8093a59417.mp3", "new": false}, {"sec": "例句", "text": "すると、聞いてみたら本当に同じ学校でした。", "hint": "すると＝すると", "file": "02c9f0530e6905fd.mp3", "new": false}, {"sec": "例句", "text": "近くの売店で食料品を買いました。", "hint": "売店＝ばいてん", "file": "80d8e16432f7a924.mp3", "new": false}, {"sec": "例句", "text": "売店で食料品を買いました。", "hint": "食料品＝しょくりょうひん", "file": "40d986ea4aa39800.mp3", "new": false}, {"sec": "例句", "text": "店員さんはとても親切でした。", "hint": "店員＝てんいん", "file": "e956814c5d66b309.mp3", "new": false}, {"sec": "例句", "text": "新しい布団で早く寝ました。", "hint": "布団＝ふとん", "file": "a9d6706d8275c4ba.mp3", "new": false}, {"sec": "例句", "text": "新しいまくらで寝ました。", "hint": "まくら＝まくら", "file": "72eedcad142b07e7.mp3", "new": false}, {"sec": "例句", "text": "近所を散歩してみました。", "hint": "散歩する＝さんぽする", "file": "8b094ba835738e54.mp3", "new": false}, {"sec": "例句", "text": "珍しいカフェを見つけました。", "hint": "珍しい＝めずらしい", "file": "9357df84714acf2a.mp3", "new": false}, {"sec": "例句", "text": "店の中を回ってみました。", "hint": "回る＝まわる", "file": "a756831b74b060b1.mp3", "new": false}, {"sec": "例句", "text": "柔らかすぎるパンを売っていました。", "hint": "柔らかい＝やわらかい", "file": "026062a9e3783059.mp3", "new": false}, {"sec": "例句", "text": "ケーキを一つ注文しました。", "hint": "注文する＝ちゅうもんする", "file": "c4e5d681f04e6c8b.mp3", "new": false}, {"sec": "例句", "text": "半分に切ってもらいました。", "hint": "半分＝はんぶん", "file": "0738014ac57df9c8.mp3", "new": false}, {"sec": "例句", "text": "道の太い木の下にコインがありました。", "hint": "太い＝ふとい", "file": "5edf2072adf3b2cd.mp3", "new": false}, {"sec": "例句", "text": "小さいコインを拾いました。", "hint": "拾う＝ひろう", "file": "d06c333f00f0bc29.mp3", "new": false}, {"sec": "例句", "text": "猫は少し太ってしまったみたいです。", "hint": "太る＝ふとる", "file": "4c7e31e9bb6e7b4c.mp3", "new": false}, {"sec": "例句", "text": "水着を買いに行くことにしました。", "hint": "水着＝みずぎ", "file": "3ea28349f9cef184.mp3", "new": false}, {"sec": "例句", "text": "私に向いている色を選んでくれました。", "hint": "向く＝むく", "file": "572187fae92e15fc.mp3", "new": false}, {"sec": "例句", "text": "値段が普通の倍になっていました。", "hint": "倍＝ばい", "file": "a8f7bc1be922d717.mp3", "new": false}, {"sec": "例句", "text": "普通の道を歩いていました。", "hint": "普通＝ふつう", "file": "ef741dfcf99ff979.mp3", "new": false}, {"sec": "例句", "text": "床が少し汚れていました。", "hint": "汚れる＝よごれる", "file": "059468183dedfaf0.mp3", "new": false}, {"sec": "例句", "text": "引っ越しの時に床を汚してしまいました。", "hint": "汚す＝よごす", "file": "40fe7ffb4b2a9384.mp3", "new": false}, {"sec": "例句", "text": "りんごの皮を剥いて食べました。", "hint": "剥く＝むく", "file": "9c603c826416906e.mp3", "new": false}, {"sec": "例句", "text": "プレゼントを丁寧に包みました。", "hint": "包む＝つつむ", "file": "f5918fc536beebe5.mp3", "new": false}, {"sec": "例句", "text": "別の箱に入れました。", "hint": "別＝べつ", "file": "8ca66c204c975934.mp3", "new": false}, {"sec": "例句", "text": "指でリボンを結びました。", "hint": "指＝ゆび", "file": "5ea098d63e2df4c4.mp3", "new": false}, {"sec": "例句", "text": "引っ越す日は朝から忙しかったです。", "hint": "日＝ひ", "file": "a24001a60c949f8b.mp3", "new": false}, {"sec": "例句", "text": "眠りが浅くて、何度も目が覚めました。", "hint": "浅い＝あさい", "file": "460399a2bce34e9a.mp3", "new": false}, {"sec": "例句", "text": "引っ越しの日は本当に暑かったです。", "hint": "暑い＝あつい", "file": "dd9d3070a651eb00.mp3", "new": false}, {"sec": "例句", "text": "この部屋は壁が粗いです。", "hint": "粗い＝あらい", "file": "b44ade6829156241.mp3", "new": false}, {"sec": "例句", "text": "玄関の暗証番号を手帳にメモしておきました。", "hint": "暗証番号＝あんしょうばんごう", "file": "577a18b8e7d46b56.mp3", "new": false}, {"sec": "例句", "text": "いくら安くても、栄養がなければ体に悪いです。", "hint": "いくら＝いくら", "file": "0d15ff0337de5ccd.mp3", "new": false}, {"sec": "例句", "text": "大家さんに野菜の炒め方を教えてもらいました。", "hint": "炒める＝いためる", "file": "8e0da6c7816a56e3.mp3", "new": false}, {"sec": "例句", "text": "一般に危ないと言われる場所は避けています。", "hint": "一般＝いっぱん", "file": "a57c7917cab79cc0.mp3", "new": false}, {"sec": "例句", "text": "取れたボタンを糸と針で直しました。", "hint": "糸＝いと", "file": "199e6171e873f803.mp3", "new": false}, {"sec": "例句", "text": "カレンダーを掛けるために、壁に釘を打ちました。", "hint": "打つ＝うつ", "file": "2675289db7aed53b.mp3", "new": false}, {"sec": "例句", "text": "二人で記念の写真を写しました。", "hint": "写す＝うつす", "file": "900c5decf4ed6099.mp3", "new": false}, {"sec": "例句", "text": "この気持ちは永遠に消えません。", "hint": "永遠＝えいえん", "file": "180178dabf695c01.mp3", "new": false}, {"sec": "例句", "text": "弁当ばかりでは栄養が足りません。", "hint": "栄養＝えいよう", "file": "5d0f4eea8e344ec1.mp3", "new": false}, {"sec": "例句", "text": "二日おきに猫に餌をやっています。", "hint": "餌＝えさ", "file": "bec866e76aa2e9bd.mp3", "new": false}, {"sec": "例句", "text": "大家さんのおかげで食事がよくなりました。", "hint": "おかげ＝おかげ", "file": "2b66cab16138cd25.mp3", "new": false}, {"sec": "例句", "text": "この薬は一日おきに飲んでください。", "hint": "おき＝おき", "file": "58597837bd7aece4.mp3", "new": false}, {"sec": "例句", "text": "大家さんは怒らないで、優しく言ってくれました。", "hint": "怒る＝おこる", "file": "faf3ae504d69fc4f.mp3", "new": false}, {"sec": "例句", "text": "大家さんのお宅で料理をご馳走になりました。", "hint": "お宅＝おたく", "file": "49ed58f02f94c2c1.mp3", "new": false}, {"sec": "例句", "text": "「合格、おめでとうございます」と言われました。", "hint": "おめでとうございます＝おめでとうございます", "file": "33570c2352f73e8d.mp3", "new": false}, {"sec": "例句", "text": "汗でひどい格好になってしまいました。", "hint": "格好＝かっこう", "file": "68a51e194b6bd760.mp3", "new": false}, {"sec": "例句", "text": "その話を聞いて少し悲しかったです。", "hint": "悲しい＝かなしい", "file": "56f295fbe5523f02.mp3", "new": false}, {"sec": "例句", "text": "包丁を使うときは気をつけてください。", "hint": "気＝き", "file": "f6896ee8f000205b.mp3", "new": false}, {"sec": "例句", "text": "帰りに記念の写真を写しました。", "hint": "記念＝きねん", "file": "ea5b214b392cd280.mp3", "new": false}, {"sec": "例句", "text": "窓が大きくて気分のいい部屋です。", "hint": "気分＝きぶん", "file": "08e31b0135c1800c.mp3", "new": false}, {"sec": "例句", "text": "別れても、気持ちは消えません。", "hint": "気持ち＝きもち", "file": "f187277251d54b37.mp3", "new": false}, {"sec": "例句", "text": "学生の部屋探しは競争が激しいです。", "hint": "競争＝きょうそう", "file": "fcf36938447d8a13.mp3", "new": false}, {"sec": "例句", "text": "料理に興味が出てきました。", "hint": "興味＝きょうみ", "file": "5b557d42a37f4e2d.mp3", "new": false}, {"sec": "例句", "text": "壁は粗いです。けれども、気分のいい部屋です。", "hint": "けれども＝けれども", "file": "14d3334ce08190f8.mp3", "new": false}, {"sec": "例句", "text": "大家さんは好意で野菜を分けてくれます。", "hint": "好意＝こうい", "file": "5b35d15719a6e5ec.mp3", "new": false}, {"sec": "例句", "text": "お礼に大家さんに手料理をご馳走しました。", "hint": "ご馳走する＝ごちそうする", "file": "ef37f1eddf7a6dfe.mp3", "new": false}, {"sec": "例句", "text": "この部屋が借りられて、運がよかったです。", "hint": "この＝この", "file": "1a1725ddab404b97.mp3", "new": false}, {"sec": "例句", "text": "揺れがあまりに怖くて、体が動きませんでした。", "hint": "怖い＝こわい", "file": "d0ace4e9a116a635.mp3", "new": false}, {"sec": "例句", "text": "壁にカレンダーを掛けます。", "hint": "掛ける＝かける", "file": "7ab52d327fd9f2f1.mp3", "new": false}, {"sec": "例句", "text": "駅の角を曲がって、まっすぐ行きます。", "hint": "角＝かど", "file": "e03c64bc3d6b1925.mp3", "new": false}, {"sec": "例句", "text": "夕飯はコンビニの弁当か缶詰でした。", "hint": "缶詰＝かんづめ", "file": "b9b33f8afa830b8f.mp3", "new": false}, {"sec": "例句", "text": "地震で電気が消えてしまいました。", "hint": "消える＝きえる", "file": "78cdfd896d759620.mp3", "new": false}, {"sec": "例句", "text": "近所にはスーパーも図書館もあります。", "hint": "近所＝きんじょ", "file": "480eb33c42aa06b0.mp3", "new": false}, {"sec": "例句", "text": "この町で一人で下宿することにしました。", "hint": "下宿する＝げしゅくする", "file": "18b6708925a74f2a.mp3", "new": false}, {"sec": "例句", "text": "この頃は卒業のことばかり考えています。", "hint": "この頃＝このごろ", "file": "0e2f50e2b98ba93c.mp3", "new": false}, {"sec": "例句", "text": "さっき駅で先生に会いました。", "hint": "さっき＝さっき", "file": "17acb80deb5fc66f.mp3", "new": false}, {"sec": "例句", "text": "その言葉で幸せな気持ちになりました。", "hint": "幸せ＝しあわせ", "file": "f84e5ae8dc4c0e4e.mp3", "new": false}, {"sec": "例句", "text": "この一年しっかり勉強しました。", "hint": "しっかり＝しっかり", "file": "71b2627df547ffae.mp3", "new": false}, {"sec": "例句", "text": "母は電話でずいぶん心配していました。", "hint": "心配する＝しんぱいする", "file": "7ceac6d476a61d84.mp3", "new": false}, {"sec": "例句", "text": "忘れないように、すぐメモしておきました。", "hint": "すぐ＝すぐ", "file": "97f1db9349c1a91c.mp3", "new": false}, {"sec": "例句", "text": "要らない物を捨てて、荷物が少なくなりました。", "hint": "捨てる＝すてる", "file": "fee7d692fcac6fc8.mp3", "new": false}, {"sec": "例句", "text": "それで、この町での生活が始まりました。", "hint": "それで＝それで", "file": "651d56bd86dbc5ed.mp3", "new": false}, {"sec": "例句", "text": "料理は楽しいです。それに、体にもいいです。", "hint": "それに＝それに", "file": "33cb65b4b0301f22.mp3", "new": false}, {"sec": "例句", "text": "新しい生活も楽しみです。", "hint": "楽しみ＝たのしみ", "file": "ada61ae6e8f0ec25.mp3", "new": false}, {"sec": "例句", "text": "作ることを楽しむようになりました。", "hint": "楽しむ＝たのしむ", "file": "5c0efdbb2efdf9a2.mp3", "new": false}, {"sec": "例句", "text": "静かな道を通って五分で着きます。", "hint": "通る＝とおる", "file": "9c12cacbefc36fbc.mp3", "new": false}, {"sec": "例句", "text": "眠たくて目を閉じたのに、眠れませんでした。", "hint": "眠たい＝ねむたい", "file": "0a088b8eb61b1b98.mp3", "new": false}, {"sec": "例句", "text": "大家さんと田舎の墓参りに行きました。", "hint": "墓＝はか", "file": "61956a34311a7117.mp3", "new": false}, {"sec": "例句", "text": "指を切ってしまい、恥ずかしかったです。", "hint": "恥ずかしい＝はずかしい", "file": "48c4696ab3d73134.mp3", "new": false}, {"sec": "例句", "text": "東京の会社で働くことになりました。", "hint": "働く＝はたらく", "file": "c281d8050b465866.mp3", "new": false}, {"sec": "例句", "text": "久しぶりに友達に会いました。", "hint": "久しぶり＝ひさしぶり", "file": "2f2cbfefd2061796.mp3", "new": false}, {"sec": "例句", "text": "大家さんは朗らかな人です。", "hint": "朗らか＝ほがらか", "file": "71fa2424f21441af.mp3", "new": false}, {"sec": "例句", "text": "はじめは真似をするだけでした。", "hint": "真似＝まね", "file": "263bb608cb77f827.mp3", "new": false}, {"sec": "例句", "text": "窓を開けたまま寝てしまいました。", "hint": "まま＝まま", "file": "35d44304c1efda14.mp3", "new": false}, {"sec": "例句", "text": "自分で作った物を食べると満足できます。", "hint": "満足＝まんぞく", "file": "f778de333182af60.mp3", "new": false}, {"sec": "例句", "text": "自分でも矛盾していると思います。", "hint": "矛盾＝むじゅん", "file": "7d2f35e09969515a.mp3", "new": false}, {"sec": "例句", "text": "隣の人が迷惑していたらしいです。", "hint": "迷惑する＝めいわくする", "file": "c7dc8994c3c4998e.mp3", "new": false}, {"sec": "例句", "text": "大家さんは優しく言ってくれました。", "hint": "優しい＝やさしい", "file": "c9eb08009edffe0a.mp3", "new": false}, {"sec": "例句", "text": "二人で食べる夕飯はおいしいです。", "hint": "夕飯＝ゆうはん", "file": "f519c5b34ab6faa8.mp3", "new": false}, {"sec": "例句", "text": "二人の夕飯は愉快な時間です。", "hint": "愉快＝ゆかい", "file": "6921c9219530ca28.mp3", "new": false}, {"sec": "例句", "text": "部屋の鍵が少し緩くて心配です。", "hint": "緩い＝ゆるい", "file": "821d11c936f551b2.mp3", "new": false}, {"sec": "例句", "text": "夜、部屋が急に大きく揺れました。", "hint": "揺れる＝ゆれる", "file": "ed868f130a0d8807.mp3", "new": false}, {"sec": "例句", "text": "危ないと言われる場所は避けています。", "hint": "避ける＝さける", "file": "47eed8cce4ab2db0.mp3", "new": false}, {"sec": "例句", "text": "荷物が減って、掃除も楽になりました。", "hint": "楽＝らく", "file": "f29ea59b4e985f93.mp3", "new": false}, {"sec": "例句", "text": "古いですが立派な家が建っています。", "hint": "立派＝りっぱ", "file": "b9555be77be4033e.mp3", "new": false}, {"sec": "例句", "text": "大家さんと別れるのは寂しいです。", "hint": "別れる＝わかれる", "file": "a694483cfb41e3c3.mp3", "new": false}, {"sec": "例句", "text": "この家は家賃も割合に安いです。", "hint": "割合に＝わりあいに", "file": "0df5ec92d60a5948.mp3", "new": false}, {"sec": "例句", "text": "みんなが一緒に集まって、写真を撮った。", "hint": "集まる＝あつまる", "file": "580ed2ecb9f417c7.mp3", "new": false}, {"sec": "例句", "text": "遅れて来た友達は「ごめん」と謝った。", "hint": "謝る＝あやまる", "file": "9d33411dd2aa1336.mp3", "new": false}, {"sec": "例句", "text": "いいよと言ったのに、彼はまだ気にしていた。", "hint": "いい＝いい", "file": "bb1a83ee09cfc59b.mp3", "new": false}, {"sec": "例句", "text": "卒業するために、一生懸命勉強してきた。", "hint": "一生懸命＝いっしょうけんめい", "file": "16dfe69a233019d2.mp3", "new": false}, {"sec": "例句", "text": "鉛筆で書いたメモを見ながら確かめた。", "hint": "鉛筆＝えんぴつ", "file": "03d3e037b69e5315.mp3", "new": false}, {"sec": "例句", "text": "先輩は直接やり方を教えてくれた。", "hint": "教える＝おしえる", "file": "a92c141a3d62b94d.mp3", "new": false}, {"sec": "例句", "text": "学部の講義が、今日で終わりになった。", "hint": "終わり＝おわり", "file": "8692c1cc73ed7368.mp3", "new": false}, {"sec": "例句", "text": "活動の最後の日、みんなが一緒に集まった。", "hint": "活動＝かつどう", "file": "0436fc182ea06a72.mp3", "new": false}, {"sec": "例句", "text": "厳しい先生の質問は簡単ではなかった。", "hint": "簡単＝かんたん", "file": "27ee48c308083997.mp3", "new": false}, {"sec": "例句", "text": "会社の規則はそれほど多くなかった。", "hint": "規則＝きそく", "file": "97407b970f878dc9.mp3", "new": false}, {"sec": "例句", "text": "教室に学生たちが揃った。", "hint": "教室＝きょうしつ", "file": "115a996274bf37f0.mp3", "new": false}, {"sec": "例句", "text": "長時間座っていたので、腰が痛くなった。", "hint": "腰＝こし", "file": "910667f935fed165.mp3", "new": false}, {"sec": "例句", "text": "レポートの事柄について友達に手伝ってもらった。", "hint": "事柄＝ことがら", "file": "f5c2db26ebeb16f6.mp3", "new": false}, {"sec": "例句", "text": "友達に資料を探すのを手伝ってもらった。", "hint": "探す＝さがす", "file": "29848ed867516fd0.mp3", "new": false}, {"sec": "例句", "text": "早退したり残業したりする日もある。", "hint": "残業する＝ざんぎょうする", "file": "4ddf9c163b85571c.mp3", "new": false}, {"sec": "例句", "text": "出発した日から、自信を持って話せるようになった。", "hint": "出発する＝しゅっぱつする", "file": "91a3c2d15960fe3e.mp3", "new": false}, {"sec": "例句", "text": "早く終わらせて準備した後で出掛けた。", "hint": "準備する＝じゅんびする", "file": "8a9b08df015e416f.mp3", "new": false}, {"sec": "例句", "text": "私の目標は、社内コンテストの賞金を受け取ることだ。", "hint": "賞金＝しょうきん", "file": "2d960069e69c4c32.mp3", "new": false}, {"sec": "例句", "text": "向こうの町の人口データを用いて説明した。", "hint": "人口＝じんこう", "file": "b6e6e69719c1c884.mp3", "new": false}, {"sec": "例句", "text": "部長は「大丈夫だ」と私を信用してくれた。", "hint": "信用する＝しんようする", "file": "a9e0bf714dd2c592.mp3", "new": false}, {"sec": "例句", "text": "信頼できる社員になるまで待つと言ってくれた。", "hint": "信頼する＝しんらいする", "file": "7c856103d4f82a32.mp3", "new": false}, {"sec": "例句", "text": "仕事は少しずつ進んでいる。", "hint": "進む＝すすむ", "file": "375d8fd81207ebe8.mp3", "new": false}, {"sec": "例句", "text": "担当者は留守で、外に出ているらしかった。", "hint": "外＝そと", "file": "da664e893b967a84.mp3", "new": false}, {"sec": "例句", "text": "教室に学生たちが揃ったのを見て、先生は笑った。", "hint": "揃う＝そろう", "file": "d1d842d6a45d7bc9.mp3", "new": false}, {"sec": "例句", "text": "友達に手伝ってもらい、助かった。", "hint": "助かる＝たすかる", "file": "79d0450719381007.mp3", "new": false}, {"sec": "例句", "text": "例えば面接の受け方も教えてくれた。", "hint": "例えば＝たとえば", "file": "98c506a274117a44.mp3", "new": false}, {"sec": "例句", "text": "先生は、みんなのために面接の受け方も教えてくれた。", "hint": "ため＝ため", "file": "4f6fab4adcef3834.mp3", "new": false}, {"sec": "例句", "text": "会社の規則はちゃんと守らなければならない。", "hint": "ちゃんと＝ちゃんと", "file": "14c410482eb0e502.mp3", "new": false}, {"sec": "例句", "text": "先輩が地図を見たら、駅までの時間が分かった。", "hint": "地図＝ちず", "file": "d5d882511541cc86.mp3", "new": false}, {"sec": "例句", "text": "早退したり残業したりする日もあるが、調子はいい。", "hint": "調子＝ちょうし", "file": "a81203b4b0828768.mp3", "new": false}, {"sec": "例句", "text": "駅までちょうど三十分だと分かった。", "hint": "ちょうど＝ちょうど", "file": "667ac60fbff326bb.mp3", "new": false}, {"sec": "例句", "text": "この会社に勤めてまだ半年だ。", "hint": "勤める＝つとめる", "file": "a4220f7c9f6c6f7d.mp3", "new": false}, {"sec": "例句", "text": "仕事が積もっていたが、早く終わらせた。", "hint": "積もる＝つもる", "file": "be856d6ca7e4824c.mp3", "new": false}, {"sec": "例句", "text": "先輩が私を駅まで連れて行ってくれた。", "hint": "連れて行く＝つれていく", "file": "791463acfe2f0128.mp3", "new": false}, {"sec": "例句", "text": "準備した後で出掛けた。", "hint": "出掛ける＝でかける", "file": "8dd808b8e8340663.mp3", "new": false}, {"sec": "例句", "text": "友達に探すのを手伝ってもらい、助かった。", "hint": "手伝う＝てつだう", "file": "52d17b63a9540fb6.mp3", "new": false}, {"sec": "例句", "text": "戸を開けると突然雨が降ってきた。", "hint": "戸＝と", "file": "8880d9bffc1ba897.mp3", "new": false}, {"sec": "例句", "text": "部長はいつも命令をなさる方だ。", "hint": "なさる＝なさる", "file": "b734fe4f186380ee.mp3", "new": false}, {"sec": "例句", "text": "資料の字が小さくて読みにくい。", "hint": "にくい＝にくい", "file": "e7f98a239f96813b.mp3", "new": false}, {"sec": "例句", "text": "仕事が終わると、みんなで二次会に行った。", "hint": "二次会＝にじかい", "file": "dce0562c5a82a385.mp3", "new": false}, {"sec": "例句", "text": "資料を拝見してもいいですか。", "hint": "拝見する＝はいけんする", "file": "762ae66e918a15c7.mp3", "new": false}, {"sec": "例句", "text": "居酒屋の灰皿の横で、部長は窓を閉めた。", "hint": "灰皿＝はいざら", "file": "e5d2b90fda61d6d4.mp3", "new": false}, {"sec": "例句", "text": "窓のガラスに夕日が反射してきれいだった。", "hint": "反射する＝はんしゃする", "file": "35b9f274cb49acd9.mp3", "new": false}, {"sec": "例句", "text": "傘があれば雨を防げると思った。", "hint": "防ぐ＝ふせぐ", "file": "28e9efebae1423af.mp3", "new": false}, {"sec": "例句", "text": "先輩は普段から優しい。", "hint": "普段＝ふだん", "file": "2853b960b61843e8.mp3", "new": false}, {"sec": "例句", "text": "電車の放送を聞きながら資料を読んだ。", "hint": "放送＝ほうそう", "file": "e8bb04a380f308de.mp3", "new": false}, {"sec": "例句", "text": "本社に着くと、挨拶をした。", "hint": "本社＝ほんしゃ", "file": "446ea623514b5bd2.mp3", "new": false}, {"sec": "例句", "text": "「ただいま参りました」と挨拶した。", "hint": "参る＝まいる", "file": "1eff769a3c8b072d.mp3", "new": false}, {"sec": "例句", "text": "見方が合わず、少し摩擦が生まれた。", "hint": "摩擦＝まさつ", "file": "31cf71a0a58bb552.mp3", "new": false}, {"sec": "例句", "text": "向こうの人と見方が合わなかった。", "hint": "見方＝みかた", "file": "3bb74fcde5163330.mp3", "new": false}, {"sec": "例句", "text": "人口データを用いて説明した。", "hint": "用いる＝もちいる", "file": "d508a093727abb0e.mp3", "new": false}, {"sec": "例句", "text": "熱いお湯を飲んで少し落ち着いた。", "hint": "湯＝ゆ", "file": "d349c0e1daa9a7ff.mp3", "new": false}, {"sec": "例句", "text": "本社で活躍することが、今の私の夢だ。", "hint": "夢＝ゆめ", "file": "32ebef16c518c924.mp3", "new": false}, {"sec": "例句", "text": "この出張には用がもう一つあった。", "hint": "用＝よう", "file": "e6cd598745bcaeff.mp3", "new": false}, {"sec": "例句", "text": "帰りに領収書をもらうのを忘れないようにした。", "hint": "領収書＝りょうしゅうしょ", "file": "d32ea67f2a102b4f.mp3", "new": false}, {"sec": "例句", "text": "連休の前に本社へ電話した。", "hint": "連休＝れんきゅう", "file": "3efa1dbf4a4083c8.mp3", "new": false}, {"sec": "例句", "text": "部長は冷房が強すぎると言った。", "hint": "冷房＝れいぼう", "file": "f6174a2cb59b26c0.mp3", "new": false}, {"sec": "例句", "text": "夏休みの間に、日本語が上手になりました。", "hint": "間＝あいだ", "file": "a6b06f16bda8168a.mp3", "new": false}, {"sec": "例句", "text": "間違えたところを赤いペンで直します。", "hint": "赤い＝あかい", "file": "576849ac26e255eb.mp3", "new": false}, {"sec": "例句", "text": "いよいよ卒業する日が来ました。", "hint": "いよいよ＝いよいよ", "file": "832d8ec5c0ac9054.mp3", "new": false}, {"sec": "例句", "text": "この辞典は見ていて面白いです。", "hint": "面白い＝おもしろい", "file": "e2fe8d71775061f1.mp3", "new": false}, {"sec": "例句", "text": "教科書をきちんと机に並べます。", "hint": "きちんと＝きちんと", "file": "d06f6aed21de6b75.mp3", "new": false}, {"sec": "例句", "text": "校長先生は生徒の教育を大切にしています。", "hint": "教育＝きょういく", "file": "5989837ad3b82367.mp3", "new": false}, {"sec": "例句", "text": "教科書を机の上に出してください。", "hint": "教科書＝きょうかしょ", "file": "07f1a4730f585c52.mp3", "new": false}, {"sec": "例句", "text": "試験の朝、とても緊張しました。", "hint": "緊張する＝きんちょうする", "file": "7e3276c10b1164af.mp3", "new": false}, {"sec": "例句", "text": "頭が痛いので、薬を飲みました。", "hint": "薬＝くすり", "file": "74c92212b7514718.mp3", "new": false}, {"sec": "例句", "text": "宿題は毎日二時間ぐらいかかります。", "hint": "ぐらい＝ぐらい", "file": "0f0d45244a176ede.mp3", "new": false}, {"sec": "例句", "text": "あの春の経験は今でも忘れません。", "hint": "経験＝けいけん", "file": "b95f5ae109987539.mp3", "new": false}, {"sec": "例句", "text": "数学の時間は計算ばかりです。", "hint": "計算＝けいさん", "file": "e4275e4c112e50b7.mp3", "new": false}, {"sec": "例句", "text": "消しゴムを忘れたので、友達に借りました。", "hint": "消しゴム＝けしゴム", "file": "8128477f5fd24fb3.mp3", "new": false}, {"sec": "例句", "text": "大学の試験に合格しました。", "hint": "合格する＝ごうかくする", "file": "9a8a3a5ab651da31.mp3", "new": false}, {"sec": "例句", "text": "中学校を出て、高校に入りました。", "hint": "高校＝こうこう", "file": "07d1f14a45b7d21d.mp3", "new": false}, {"sec": "例句", "text": "私は今、高校生です。", "hint": "高校生＝こうこうせい", "file": "56d427c68a17e801.mp3", "new": false}, {"sec": "例句", "text": "校長先生が講堂で話をしました。", "hint": "校長＝こうちょう", "file": "7cb313e6ea19848b.mp3", "new": false}, {"sec": "例句", "text": "夕方まで校庭にいました。", "hint": "校庭＝こうてい", "file": "c39bc4765e2982ba.mp3", "new": false}, {"sec": "例句", "text": "卒業式は講堂で行います。", "hint": "講堂＝こうどう", "file": "ed794d84916f9383.mp3", "new": false}, {"sec": "例句", "text": "朝、黒板をきれいにします。", "hint": "黒板＝こくばん", "file": "122bf62322c4c48a.mp3", "new": false}, {"sec": "例句", "text": "担任の先生は国語の先生です。", "hint": "国語＝こくご", "file": "2b1d4f075e3337c7.mp3", "new": false}, {"sec": "例句", "text": "分からない言葉は辞書で調べます。", "hint": "言葉＝ことば", "file": "8eea87962f3a7b40.mp3", "new": false}, {"sec": "例句", "text": "在校生が校庭で練習をしていました。", "hint": "在校生＝ざいこうせい", "file": "7bf3b747c3adb9b5.mp3", "new": false}, {"sec": "例句", "text": "最初にすることは黒板をきれいにすることです。", "hint": "最初＝さいしょ", "file": "5dfbb68f40055abb.mp3", "new": false}, {"sec": "例句", "text": "用事がある人は先に帰りました。", "hint": "先に＝さきに", "file": "568221a4841e818c.mp3", "new": false}, {"sec": "例句", "text": "今週から作文を書き始めました。", "hint": "作文＝さくぶん", "file": "028610fc0cf2e6ec.mp3", "new": false}, {"sec": "例句", "text": "新しい言葉を辞書で調べました。", "hint": "辞書＝じしょ", "file": "97f001b81f6a90ef.mp3", "new": false}, {"sec": "例句", "text": "自信を持って話せるようになりました。", "hint": "自信＝じしん", "file": "b7d5c6757d4f811f.mp3", "new": false}, {"sec": "例句", "text": "父の古い辞典が家にあります。", "hint": "辞典＝じてん", "file": "d301f43431b10345.mp3", "new": false}, {"sec": "例句", "text": "宿題は毎日二時間かかります。", "hint": "宿題＝しゅくだい", "file": "1c4def8a0f8e7c32.mp3", "new": false}, {"sec": "例句", "text": "これからは趣味の時間も取れます。", "hint": "趣味＝しゅみ", "file": "be9063683325a413.mp3", "new": false}, {"sec": "例句", "text": "小学校のころは走るのが嫌いでした。", "hint": "小学校＝しょうがっこう", "file": "af6e097179eecbf6.mp3", "new": false}, {"sec": "例句", "text": "正直に言うと、少し怖かったです。", "hint": "正直＝しょうじき", "file": "72b82edd76dd2c38.mp3", "new": false}, {"sec": "例句", "text": "母は私を信じてくれました。", "hint": "信じる＝しんじる", "file": "4011af0299d0c258.mp3", "new": false}, {"sec": "例句", "text": "数学の時間は数字ばかりです。", "hint": "数学＝すうがく", "file": "15209cf72ca3f994.mp3", "new": false}, {"sec": "例句", "text": "黒板に数字が並んでいます。", "hint": "数字＝すうじ", "file": "996f0f00a8c62896.mp3", "new": false}, {"sec": "例句", "text": "発表の日、すぐにパソコンを開きました。", "hint": "すぐに＝すぐに", "file": "d552006f661dfdf5.mp3", "new": false}, {"sec": "例句", "text": "夏休みは毎日図書館で過ごしました。", "hint": "過ごす＝すごす", "file": "f6798e55d0df44f4.mp3", "new": false}, {"sec": "例句", "text": "成績は思ったより素晴らしかったです。", "hint": "素晴らしい＝すばらしい", "file": "2537c0a0bd5ff0c5.mp3", "new": false}, {"sec": "例句", "text": "今年は成績がよくなりました。", "hint": "成績＝せいせき", "file": "87adfc66627b53c6.mp3", "new": false}, {"sec": "例句", "text": "体育の時間、生徒たちが走ります。", "hint": "生徒＝せいと", "file": "4c0f7899f10d5f80.mp3", "new": false}, {"sec": "例句", "text": "世界的に有名な人の話を聞きました。", "hint": "世界的＝せかいてき", "file": "63d67234ce2a69c7.mp3", "new": false}, {"sec": "例句", "text": "来月、高校を卒業します。", "hint": "卒業する＝そつぎょうする", "file": "7cfacc7c4d482b50.mp3", "new": false}, {"sec": "例句", "text": "体育の時間にグラウンドを走ります。", "hint": "体育＝たいいく", "file": "cf9aeaacef7b9ea0.mp3", "new": false}, {"sec": "例句", "text": "来年から私も大学生です。", "hint": "大学生＝だいがくせい", "file": "0137e3ae1d896d2f.mp3", "new": false}, {"sec": "例句", "text": "単純な間違いが減ってきました。", "hint": "単純＝たんじゅん", "file": "e137b127eb7ab56e.mp3", "new": false}, {"sec": "例句", "text": "担任の先生に相談しました。", "hint": "担任＝たんにん", "file": "7d4ab466839c195c.mp3", "new": false}, {"sec": "例句", "text": "辞典の字はとても小さいです。", "hint": "小さい＝ちいさい", "file": "259056c70269b928.mp3", "new": false}, {"sec": "例句", "text": "自分の知恵を使って考えなさい。", "hint": "知恵＝ちえ", "file": "1b03f0eebe9235b4.mp3", "new": false}, {"sec": "例句", "text": "中学生のころ、ちっとも勉強しませんでした。", "hint": "ちっとも＝ちっとも", "file": "2358d3fb7ca7dce3.mp3", "new": false}, {"sec": "例句", "text": "弟はまだ中学生です。", "hint": "中学生＝ちゅうがくせい", "file": "a9536a195589372d.mp3", "new": false}, {"sec": "例句", "text": "この中学校は家から近いです。", "hint": "中学校＝ちゅうがっこう", "file": "ac4604dbb2b14134.mp3", "new": false}, {"sec": "例句", "text": "毎朝、朝食をきちんと食べます。", "hint": "朝食＝ちょうしょく", "file": "c5ccdf45c1f0c925.mp3", "new": false}, {"sec": "例句", "text": "適当に覚えてはいけません。", "hint": "適当＝てきとう", "file": "752381dc7f2e0c24.mp3", "new": false}, {"sec": "例句", "text": "隣の子は今にも泣きそうでした。", "hint": "泣く＝なく", "file": "133c1f140ae6759f.mp3", "new": false}, {"sec": "例句", "text": "式の日程は先月決まりました。", "hint": "日程＝にってい", "file": "4638c6e32616e0a2.mp3", "new": false}, {"sec": "例句", "text": "講堂に椅子を運びました。", "hint": "運ぶ＝はこぶ", "file": "acc57a349e327144.mp3", "new": false}, {"sec": "例句", "text": "うっかり手を離してしまいました。", "hint": "離す＝はなす", "file": "9f3151ee9dc2fef8.mp3", "new": false}, {"sec": "例句", "text": "自分の番号を見つけてびっくりしました。", "hint": "びっくりする＝びっくりする", "file": "2a694b5c04a04226.mp3", "new": false}, {"sec": "例句", "text": "在校生が花びらを撒きました。", "hint": "撒く＝まく", "file": "547bf8dab49780cc.mp3", "new": false}, {"sec": "例句", "text": "先生から万年筆をもらいました。", "hint": "万年筆＝まんねんひつ", "file": "b3ed7893886b4681.mp3", "new": false}, {"sec": "例句", "text": "皆で講堂に入りました。", "hint": "皆＝みな", "file": "23079aaaba9cacfa.mp3", "new": false}, {"sec": "例句", "text": "南の窓から朝日が入ってきます。", "hint": "南＝みなみ", "file": "8ad642c156ab2308.mp3", "new": false}, {"sec": "例句", "text": "椅子は思ったより目方がありました。", "hint": "目方＝めかた", "file": "fe153ec6a93d1e84.mp3", "new": false}, {"sec": "例句", "text": "夕方になると、空が赤くなります。", "hint": "夕方＝ゆうがた", "file": "c28be13f1aa185f5.mp3", "new": false}, {"sec": "例句", "text": "これからはゆっくり休めます。", "hint": "ゆっくり＝ゆっくり", "file": "fed713f869bb9b5d.mp3", "new": false}, {"sec": "例句", "text": "予算が少ないので、飾りは自分たちで作ります。", "hint": "予算＝よさん", "file": "1609a3fc11096a0f.mp3", "new": false}, {"sec": "例句", "text": "今日は用事があるので、早く帰ります。", "hint": "用事＝ようじ", "file": "63cd3a742b0b8007.mp3", "new": false}, {"sec": "例句", "text": "忘れ物をしないようにかばんを見ました。", "hint": "忘れ物＝わすれもの", "file": "98942f60879ebbaa.mp3", "new": false}, {"sec": "例句", "text": "横にあった花瓶が割れてしまいました。", "hint": "割れる＝われる", "file": "85a307064f14b932.mp3", "new": false}, {"sec": "例句", "text": "風で窓が開きました。", "hint": "開く＝あく", "file": "9dab4ed4cc9ae7ca.mp3", "new": false}, {"sec": "例句", "text": "暑いので、窓を開けてください。", "hint": "開ける＝あける", "file": "71019a5f12260449.mp3", "new": false}, {"sec": "例句", "text": "銀行は三時に閉まります。", "hint": "閉まる＝しまる", "file": "1369c4da7fa89af1.mp3", "new": false}, {"sec": "例句", "text": "寒いから、ドアを閉めてね。", "hint": "閉める＝しめる", "file": "898154335421663a.mp3", "new": false}, {"sec": "例句", "text": "暗いので、電気をつけました。", "hint": "つける＝つける", "file": "5c7b89fef7485dd2.mp3", "new": false}, {"sec": "例句", "text": "寝る前に、テレビを消します。", "hint": "消す＝けす", "file": "a1e5b645ac2fc65e.mp3", "new": false}, {"sec": "例句", "text": "窓から雨が入りました。", "hint": "入る＝はいる", "file": "ccd188656caf641c.mp3", "new": false}, {"sec": "例句", "text": "かばんに傘を入れておきました。", "hint": "入れる＝いれる", "file": "eac7099b465cc19f.mp3", "new": false}, {"sec": "例句", "text": "毎朝八時に家を出ます。", "hint": "出る＝でる", "file": "976e99f2d1697c10.mp3", "new": false}, {"sec": "例句", "text": "かばんから本を出しました。", "hint": "出す＝だす", "file": "6b66b20683570477.mp3", "new": false}, {"sec": "例句", "text": "事故で電車が止まっています。", "hint": "止まる＝とまる", "file": "4fc61eb92773fc5f.mp3", "new": false}, {"sec": "例句", "text": "ここに車を止めないでください。", "hint": "止める＝とめる", "file": "9f1048baf70602d4.mp3", "new": false}, {"sec": "例句", "text": "授業は九時に始まります。", "hint": "始まる＝はじまる", "file": "f27cd92a92755118.mp3", "new": false}, {"sec": "例句", "text": "来月から日本語の勉強を始めます。", "hint": "始める＝はじめる", "file": "55fbdbe6a4e42429.mp3", "new": false}, {"sec": "例句", "text": "弟は切手を集めています。", "hint": "集める＝あつめる", "file": "dbff359587104bf1.mp3", "new": false}, {"sec": "例句", "text": "窓のガラスが割れました。", "hint": "ガラス＝ガラス", "file": "a9289d9950aeb5f2.mp3", "new": false}, {"sec": "例句", "text": "明日の天気は曇りです。", "hint": "曇り＝くもり", "file": "3f9c610bf9755ddc.mp3", "new": false}, {"sec": "例句", "text": "台風で学校が休みになりました。", "hint": "台風＝たいふう", "file": "88cc594057d36789.mp3", "new": false}, {"sec": "例句", "text": "昨日の夜、小さい地震がありました。", "hint": "地震＝じしん", "file": "a5c695b03b26aa6e.mp3", "new": false}, {"sec": "例句", "text": "駅の前で車の事故がありました。", "hint": "事故＝じこ", "file": "f3b8f6a53b3ef42b.mp3", "new": false}, {"sec": "例句", "text": "夏に花火大会があります。", "hint": "大会＝たいかい", "file": "fc1638f1cae04403.mp3", "new": false}, {"sec": "例句", "text": "私たちのチームが勝ちました。", "hint": "チーム＝チーム", "file": "1f73e9c266bb9618.mp3", "new": false}, {"sec": "例句", "text": "雨で試合が中止になりました。", "hint": "中止＝ちゅうし", "file": "07addc137d235b1e.mp3", "new": false}, {"sec": "例句", "text": "公園でフリーマーケットがあります。", "hint": "フリーマーケット＝フリーマーケット", "file": "92192ad7fb5f381c.mp3", "new": false}, {"sec": "例句", "text": "それは本当の話ですか。", "hint": "本当＝ほんとう", "file": "d9ff5855069778a1.mp3", "new": false}, {"sec": "例句", "text": "昔、ここは海でした。", "hint": "昔＝むかし", "file": "dc607c01231d6139.mp3", "new": false}, {"sec": "例句", "text": "この美術館は無料です。", "hint": "無料＝むりょう", "file": "dcba55a64c51edfe.mp3", "new": false}, {"sec": "例句", "text": "飼っていた魚が死にました。", "hint": "死ぬ＝しぬ", "file": "c2840b4221880195.mp3", "new": false}, {"sec": "例句", "text": "祖父は去年亡くなりました。", "hint": "亡くなる＝なくなる", "file": "22cc723a3bcf0e5c.mp3", "new": false}, {"sec": "例句", "text": "午後から雨が降るでしょう。", "hint": "降る＝ふる", "file": "605c17ae71bfe616.mp3", "new": false}, {"sec": "例句", "text": "昨日の試合は、私たちが勝ちました。", "hint": "勝つ＝かつ", "file": "18debfbaec1d138e.mp3", "new": false}, {"sec": "例句", "text": "サッカーの試合で負けました。", "hint": "負ける＝まける", "file": "198b6c004297195e.mp3", "new": false}, {"sec": "例句", "text": "駅の近くに新しい店ができました。", "hint": "できる＝できる", "file": "95535c934fb986f1.mp3", "new": false}, {"sec": "例句", "text": "姉は来月結婚します。", "hint": "結婚する＝けっこんする", "file": "27496b144c2f2d9f.mp3", "new": false}, {"sec": "例句", "text": "父は一週間入院しました。", "hint": "入院する＝にゅういんする", "file": "e7bf626e7317fa5f.mp3", "new": false}, {"sec": "例句", "text": "明日のテストが心配です。", "hint": "心配＝しんぱい", "file": "dcb4e60f99cc30e5.mp3", "new": false}, {"sec": "例句", "text": "今日は風が強いです。", "hint": "風＝かぜ", "file": "a1a535ead6ec9615.mp3", "new": false}, {"sec": "例句", "text": "かばんにストラップをつけました。", "hint": "ストラップ＝ストラップ", "file": "87c4a95cc35e7dfa.mp3", "new": false}, {"sec": "例句", "text": "窓のそばの席に座りました。", "hint": "席＝せき", "file": "3d106d5156e5b41f.mp3", "new": false}, {"sec": "例句", "text": "時間がないから、急いでください。", "hint": "急ぐ＝いそぐ", "file": "bf4d25f063afe111.mp3", "new": false}, {"sec": "例句", "text": "朝の電車はいつも混んでいます。", "hint": "混む＝こむ", "file": "d99f41f6beecaea8.mp3", "new": false}, {"sec": "例句", "text": "走って、電車に間に合いました。", "hint": "間に合う＝まにあう", "file": "2ffb307472447167.mp3", "new": false}, {"sec": "例句", "text": "雨がやんだら、出かけましょう。", "hint": "やむ＝やむ", "file": "2504ae419e5029b7.mp3", "new": false}, {"sec": "例句", "text": "明日は晴れるでしょう。", "hint": "晴れる＝はれる", "file": "123047dfb06ed96d.mp3", "new": false}, {"sec": "例句", "text": "日曜日の朝は、電車がすいています。", "hint": "空く＝すく", "file": "cbff61afb3f65f91.mp3", "new": false}, {"sec": "例句", "text": "道に財布が落ちていました。", "hint": "落ちる＝おちる", "file": "ff254da21856ee9d.mp3", "new": false}, {"sec": "例句", "text": "古いパソコンが壊れました。", "hint": "壊れる＝こわれる", "file": "bc2ac9ec8dda732c.mp3", "new": false}, {"sec": "例句", "text": "この服は三十パーセント安いです。", "hint": "パーセント＝パーセント", "file": "f53cfa0e895fb5e0.mp3", "new": false}, {"sec": "例句", "text": "このシャツは二十パーセント引きです。", "hint": "～引き＝びき", "file": "756a80fb0a281c1d.mp3", "new": false}, {"sec": "例句", "text": "父は力が強いです。", "hint": "強い＝つよい", "file": "ebfa96d9699eecbd.mp3", "new": false}, {"sec": "例句", "text": "明日はきっと晴れますよ。", "hint": "きっと＝きっと", "file": "c7f02a8c7ea9c9bc.mp3", "new": false}, {"sec": "例句", "text": "田中さんはたぶん来ないでしょう。", "hint": "たぶん＝たぶん", "file": "1c3a55495351191c.mp3", "new": false}, {"sec": "例句", "text": "もし雨が降ったら、家にいます。", "hint": "もし＝もし", "file": "456602c6aad18b96.mp3", "new": false}, {"sec": "例句", "text": "今朝は六時に起きました。", "hint": "今朝＝けさ", "file": "bf2e3b2ec989e2cc.mp3", "new": false}, {"sec": "例句", "text": "今日はとても暖かいですね。", "hint": "暖かい＝あたたかい", "file": "3bed66f46fa38715.mp3", "new": false}, {"sec": "例句", "text": "図書館で本を借りました。", "hint": "図書館＝としょかん", "file": "b602a52a41f64d1a.mp3", "new": false}, {"sec": "例句", "text": "学校へ行く途中で、友達に会いました。", "hint": "途中＝とちゅう", "file": "7575da4d6324976c.mp3", "new": false}, {"sec": "例句", "text": "駅の時計を見ました。", "hint": "時計＝とけい", "file": "cb0da60b66225e52.mp3", "new": false}, {"sec": "例句", "text": "日本語の文法は難しいです。", "hint": "文法＝ぶんぽう", "file": "b367519547881ad9.mp3", "new": false}, {"sec": "例句", "text": "授業の前に予習をします。", "hint": "予習＝よしゅう", "file": "ff562f0c58cf6936.mp3", "new": false}, {"sec": "例句", "text": "私は数学が苦手です。", "hint": "苦手＝にがて", "file": "de64fca32f2933c8.mp3", "new": false}, {"sec": "例句", "text": "この問題は難しいです。", "hint": "難しい＝むずかしい", "file": "3ea3612e646d7694.mp3", "new": false}, {"sec": "例句", "text": "帰ってから、今日の授業を復習します。", "hint": "復習する＝ふくしゅうする", "file": "c09fd51d56f914ef.mp3", "new": false}, {"sec": "例句", "text": "先生の発音はとてもきれいです。", "hint": "発音＝はつおん", "file": "c29f3a575191b6e2.mp3", "new": false}, {"sec": "例句", "text": "毎日ピアノを練習します。", "hint": "練習＝れんしゅう", "file": "099a8546de7cec9f.mp3", "new": false}, {"sec": "例句", "text": "大学でイギリス文学を勉強しています。", "hint": "文学＝ぶんがく", "file": "a033481afc1486d3.mp3", "new": false}, {"sec": "例句", "text": "田中さんは熱心に勉強しています。", "hint": "熱心＝ねっしん", "file": "eab46bd142920d44.mp3", "new": false}, {"sec": "例句", "text": "授業で自分の研究を発表しました。", "hint": "発表する＝はっぴょうする", "file": "674e5755935ade9f.mp3", "new": false}, {"sec": "例句", "text": "好きな色を選んでください。", "hint": "選ぶ＝えらぶ", "file": "e540414706ccf24d.mp3", "new": false}, {"sec": "例句", "text": "この小説を日本語に翻訳しました。", "hint": "翻訳する＝ほんやくする", "file": "5da7c5345be016be.mp3", "new": false}, {"sec": "例句", "text": "毎晩、寝る前に本を読みます。", "hint": "読む＝よむ", "file": "101e9cf7ad18cec8.mp3", "new": false}, {"sec": "例句", "text": "先生は詳しく説明してくれました。", "hint": "詳しい＝くわしい", "file": "69d0a885ef8046fe.mp3", "new": false}, {"sec": "例句", "text": "兄はとても真面目な学生です。", "hint": "真面目＝まじめ", "file": "c724f904fc8d917e.mp3", "new": false}, {"sec": "例句", "text": "テストで八十点を取りました。", "hint": "点＝てん", "file": "31c0f2734c6453d0.mp3", "new": false}, {"sec": "例句", "text": "今日はかなり寒いです。", "hint": "かなり＝かなり", "file": "45a378d383e0697c.mp3", "new": false}, {"sec": "例句", "text": "日本語が随分上手になりましたね。", "hint": "随分＝ずいぶん", "file": "38dc1a0aa0300004.mp3", "new": false}, {"sec": "例句", "text": "駅の前に本屋があります。", "hint": "本屋＝ほんや", "file": "f342fb4420523282.mp3", "new": false}, {"sec": "例句", "text": "新しいかばんを買いました。", "hint": "新しい＝あたらしい", "file": "fea25dc6e9434cba.mp3", "new": false}, {"sec": "例句", "text": "店の前に人が並んでいます。", "hint": "並ぶ＝ならぶ", "file": "315257a2541d8bd7.mp3", "new": false}, {"sec": "例句", "text": "机の上に本を並べました。", "hint": "並べる＝ならべる", "file": "fdc9ce91ca453ef0.mp3", "new": false}, {"sec": "例句", "text": "どれでも好きなものを取ってください。", "hint": "どれでも＝どれでも", "file": "2cc4a592e3412611.mp3", "new": false}, {"sec": "例句", "text": "公園で財布を見つけました。", "hint": "見つける＝みつける", "file": "0cbf88fa21fa072b.mp3", "new": false}, {"sec": "例句", "text": "来年、日本に留学します。", "hint": "留学する＝りゅうがくする", "file": "f98cd253da787b80.mp3", "new": false}, {"sec": "例句", "text": "困ったときは、いつでも電話してください。", "hint": "いつでも＝いつでも", "file": "9d8953b15611a14f.mp3", "new": false}, {"sec": "例句", "text": "両親は大阪に住んでいます。", "hint": "両親＝りょうしん", "file": "931c5fded33a4bd4.mp3", "new": false}, {"sec": "例句", "text": "姉は日曜日にお見合いをします。", "hint": "お見合いする＝おみあいする", "file": "2fd9764b96ec6bc2.mp3", "new": false}, {"sec": "例句", "text": "母は毎朝化粧をします。", "hint": "化粧＝けしょう", "file": "6f0b48e6b01381ca.mp3", "new": false}, {"sec": "例句", "text": "この犬はとても大人しいです。", "hint": "大人しい＝おとなしい", "file": "dae7400560ae7a93.mp3", "new": false}, {"sec": "例句", "text": "この時計は、少しおかしいです。", "hint": "おかしい＝おかしい", "file": "595d0214a0daeb00.mp3", "new": false}, {"sec": "例句", "text": "恋人と映画を見に行きました。", "hint": "恋人＝こいびと", "file": "db78d5ea34eb75ea.mp3", "new": false}, {"sec": "例句", "text": "嘘をついてはいけません。", "hint": "嘘＝うそ", "file": "bd6bb3261b1c1eeb.mp3", "new": false}, {"sec": "例句", "text": "明日は都合が悪いです。", "hint": "都合＝つごう", "file": "37d1947920277fe0.mp3", "new": false}, {"sec": "例句", "text": "髪の色を変えました。", "hint": "変える＝かえる", "file": "1615acc80b300f34.mp3", "new": false}, {"sec": "例句", "text": "友達に町を案内しました。", "hint": "案内する＝あんないする", "file": "6aefd7423e0b8729.mp3", "new": false}, {"sec": "例句", "text": "教室で騒がないでください。", "hint": "騒ぐ＝さわぐ", "file": "2c41ff9034b48b8c.mp3", "new": false}, {"sec": "例句", "text": "小さい子をいじめてはいけません。", "hint": "いじめる＝いじめる", "file": "8a06944a82f6fdd9.mp3", "new": false}, {"sec": "例句", "text": "昨日、近所で火事がありました。", "hint": "火事＝かじ", "file": "4f58db5b00a4fff3.mp3", "new": false}, {"sec": "例句", "text": "来週、学校で試験を行います。", "hint": "行う＝おこなう", "file": "c3398cf31d986df4.mp3", "new": false}, {"sec": "例句", "text": "会議室は三階に移りました。", "hint": "移る＝うつる", "file": "dd08479346e4532d.mp3", "new": false}, {"sec": "例句", "text": "この川で泳ぐのは危険です。", "hint": "危険＝きけん", "file": "a824c6d10a6bda5a.mp3", "new": false}, {"sec": "例句", "text": "シャツのボタンが取れました。", "hint": "取れる＝とれる", "file": "250b6dbbd8a98aa2.mp3", "new": false}, {"sec": "例句", "text": "友達が誕生日にプレゼントをくれました。", "hint": "くれる＝くれる", "file": "bf7026c7c0952473.mp3", "new": false}, {"sec": "例句", "text": "弟は四月に高校に入学しました。", "hint": "入学する＝にゅうがくする", "file": "f3805b404b46b354.mp3", "new": false}, {"sec": "例句", "text": "一日で全部読むのは無理です。", "hint": "無理＝むり", "file": "0fd88f7495447d7b.mp3", "new": false}, {"sec": "例句", "text": "日本は外国から石油を輸入しています。", "hint": "輸入する＝ゆにゅうする", "file": "9528962e61e91ac2.mp3", "new": false}, {"sec": "例句", "text": "この会社は車を外国に輸出しています。", "hint": "輸出する＝ゆしゅつする", "file": "c7b7af1d2c30a8dd.mp3", "new": false}, {"sec": "例句", "text": "先生にお礼を言いました。", "hint": "お礼＝おれい", "file": "660428de7b9b592c.mp3", "new": false}, {"sec": "例句", "text": "母に手紙を送りました。", "hint": "送る＝おくる", "file": "13a390fc8efc486f.mp3", "new": false}, {"sec": "例句", "text": "この町は随分変わりました。", "hint": "変わる＝かわる", "file": "3e14b6f8d1fda52f.mp3", "new": false}, {"sec": "例句", "text": "もうすぐ夏休みです。", "hint": "もうすぐ＝もうすぐ", "file": "4ada0fe70a077213.mp3", "new": false}, {"sec": "例句", "text": "フリープランで日本へ行きました。", "hint": "フリープラン＝フリープラン", "file": "03c6534838e1f0cc.mp3", "new": true}, {"sec": "例句", "text": "空港でパスポートを出しました。", "hint": "パスポート＝パスポート", "file": "0d706140c6c2e4eb.mp3", "new": true}, {"sec": "例句", "text": "日本の交通は便利です。", "hint": "交通＝こうつう", "file": "702ef88dc2c4fba6.mp3", "new": true}, {"sec": "例句", "text": "東京の駅はとても複雑です。", "hint": "複雑＝ふくざつ", "file": "af93d468fd699d38.mp3", "new": true}, {"sec": "例句", "text": "この町は交通が便利です。", "hint": "便利＝べんり", "file": "da7d46c65fe09d58.mp3", "new": true}, {"sec": "例句", "text": "駅が遠くて不便です。", "hint": "不便＝ふべん", "file": "c215302e3a3b579b.mp3", "new": true}, {"sec": "例句", "text": "車に乗ったら、シートベルトをします。", "hint": "シートベルト＝シートベルト", "file": "a8512a70638174f2.mp3", "new": true}, {"sec": "例句", "text": "祖母は田舎に住んでいます。", "hint": "田舎＝いなか", "file": "9c578822eea0ec47.mp3", "new": true}, {"sec": "例句", "text": "山の空気はきれいです。", "hint": "空気＝くうき", "file": "129b5ae5a65257a6.mp3", "new": true}, {"sec": "例句", "text": "案内の字が小さいです。", "hint": "字＝じ", "file": "9bb4bcc3c5d773fe.mp3", "new": true}, {"sec": "例句", "text": "空港の外は思ったより寒かったです。", "hint": "思う＝おもう", "file": "37af63ff698cb296.mp3", "new": true}, {"sec": "例句", "text": "玄関で靴を脱ぎます。", "hint": "玄関＝げんかん", "file": "bae2ef31416e5944.mp3", "new": true}, {"sec": "例句", "text": "ドアを開けてください。", "hint": "ドア＝ドア", "file": "cc2d5cabd3760366.mp3", "new": true}, {"sec": "例句", "text": "玄関に風鈴がかかっています。", "hint": "風鈴＝ふうりん", "file": "d8cb8e518070815f.mp3", "new": true}, {"sec": "例句", "text": "冬はこたつで寝てしまいます。", "hint": "こたつ＝こたつ", "file": "49c82c54a32ac0f2.mp3", "new": true}, {"sec": "例句", "text": "部屋の電気がつきました。", "hint": "電気＝でんき", "file": "95185349753f74c9.mp3", "new": true}, {"sec": "例句", "text": "熱いから、触らないでください。", "hint": "触る＝さわる", "file": "9702e2ba4a3e4dd3.mp3", "new": true}, {"sec": "例句", "text": "布団に湯たんぽを入れます。", "hint": "湯たんぽ＝ゆたんぽ", "file": "b6584de2ee65b08b.mp3", "new": true}, {"sec": "例句", "text": "寒い日はカイロを持って出かけます。", "hint": "カイロ＝カイロ", "file": "5ac4d190f6a2e746.mp3", "new": true}, {"sec": "例句", "text": "カイロをポケットに入れました。", "hint": "ポケット＝ポケット", "file": "b7a75352a8b09345.mp3", "new": true}, {"sec": "例句", "text": "毎晩この番組を見ています。", "hint": "番組＝ばんぐみ", "file": "1dc7d42b1a7ecdea.mp3", "new": true}, {"sec": "例句", "text": "隣の部屋がうるさいです。", "hint": "うるさい＝うるさい", "file": "68cd301bb84dc110.mp3", "new": true}, {"sec": "例句", "text": "父がギターを弾いています。", "hint": "弾く＝ひく", "file": "4ac4eb8aed265f99.mp3", "new": true}, {"sec": "例句", "text": "昼ごはんにうどんを食べました。", "hint": "うどん＝うどん", "file": "85bc92e5e9ba242d.mp3", "new": true}, {"sec": "例句", "text": "冷たいそばが好きです。", "hint": "そば＝そば", "file": "49678d179d044c7d.mp3", "new": true}, {"sec": "例句", "text": "先に食券を買ってください。", "hint": "食券＝しょっけん", "file": "959e44cb43ec356d.mp3", "new": true}, {"sec": "例句", "text": "このボタンを押してください。", "hint": "ボタン＝ボタン", "file": "1c8b5687fce9dd67.mp3", "new": true}, {"sec": "例句", "text": "レバーを下げると、お釣りが出ます。", "hint": "レバー＝レバー", "file": "88457e6b44f1d7d0.mp3", "new": true}, {"sec": "例句", "text": "ふたを回して閉めました。", "hint": "回す＝まわす", "file": "3b2b5d07f10a527f.mp3", "new": true}, {"sec": "例句", "text": "お釣りは百円です。", "hint": "お釣り＝おつり", "file": "bfb58335a4dc894b.mp3", "new": true}, {"sec": "例句", "text": "うどんに唐辛子を入れました。", "hint": "唐辛子＝とうがらし", "file": "4e00dadf0ef84989.mp3", "new": true}, {"sec": "例句", "text": "ケーキを二つに分けました。", "hint": "分ける＝わける", "file": "bed389a56f74af16.mp3", "new": true}, {"sec": "例句", "text": "みんなで「いただきます」と言いました。", "hint": "いただきます＝いただきます", "file": "3512b676f94b3aa3.mp3", "new": true}, {"sec": "例句", "text": "食べ終わって、「ごちそうさまでした」と言いました。", "hint": "ごちそうさまでした＝ごちそうさまでした", "file": "7cd5210094ba083d.mp3", "new": true}, {"sec": "例句", "text": "都会は人が多いです。", "hint": "都会＝とかい", "file": "76394d062c1e8540.mp3", "new": true}, {"sec": "例句", "text": "来月、兄の結婚式があります。", "hint": "結婚式＝けっこんしき", "file": "61d68f94471665a3.mp3", "new": true}, {"sec": "例句", "text": "神社で写真を撮りました。", "hint": "撮る＝とる", "file": "841e86d5c0027511.mp3", "new": true}, {"sec": "例句", "text": "おしゃれな店に入りました。", "hint": "おしゃれ＝おしゃれ", "file": "12b50e91bab1a439.mp3", "new": true}, {"sec": "例句", "text": "妹はファッションが好きです。", "hint": "ファッション＝ファッション", "file": "23d717c4196e60ff.mp3", "new": true}, {"sec": "例句", "text": "週末は自由な時間がたくさんあります。", "hint": "自由＝じゆう", "file": "fda4cd4eb3641613.mp3", "new": true}, {"sec": "例句", "text": "このかばんはデザインがいいです。", "hint": "デザイン＝デザイン", "file": "1bde4758baff875a.mp3", "new": true}, {"sec": "例句", "text": "昼ごはんはファストフードにしました。", "hint": "ファストフード＝ファストフード", "file": "b05896814cc55bcd.mp3", "new": true}, {"sec": "例句", "text": "外国から来る人が増えています。", "hint": "増える＝ふえる", "file": "943300e483f40849.mp3", "new": true}, {"sec": "例句", "text": "美容院で髪を切りました。", "hint": "切る＝きる", "file": "7135d928f9e809d1.mp3", "new": true}, {"sec": "例句", "text": "兄はバイクで会社に行きます。", "hint": "バイク＝バイク", "file": "510d8e3924eb5b10.mp3", "new": true}, {"sec": "例句", "text": "バイクに乗るときは、ヘルメットをかぶります。", "hint": "ヘルメット＝ヘルメット", "file": "2c51f7affd8cb66f.mp3", "new": true}, {"sec": "例句", "text": "このアルバイトは時給千円です。", "hint": "時給＝じきゅう", "file": "7537d2bbaada921f.mp3", "new": true}, {"sec": "例句", "text": "店では黒い制服を着ます。", "hint": "制服＝せいふく", "file": "707abffd2e3e93b5.mp3", "new": true}, {"sec": "例句", "text": "美術館の入場料は八百円です。", "hint": "入場料＝にゅうじょうりょう", "file": "a86d4cb0dae291e6.mp3", "new": true}, {"sec": "例句", "text": "ほら、雪が降っていますよ。", "hint": "ほら＝ほら", "file": "9488869f98265711.mp3", "new": true}, {"sec": "例句", "text": "小学生以下は無料です。", "hint": "以下＝いか", "file": "3dde660899825d83.mp3", "new": true}, {"sec": "例句", "text": "受付で身分証を見せてください。", "hint": "身分証＝みぶんしょう", "file": "9f1a662ff2a73f99.mp3", "new": true}, {"sec": "例句", "text": "学生は料金がかかりません。", "hint": "料金＝りょうきん", "file": "e671f5f9de45df74.mp3", "new": true}, {"sec": "故事", "text": "先週の日曜日、家で父が急に倒れてしまいました。父の様子がおかしかったので、私はすぐに救急車を呼びました。父は自分の部屋の隅で倒れていました。", "hint": "先週（せんしゅう）の日曜日（にちようび）、家（いえ）で父（ちち）が急（きゅう）に倒れて（たおれて）しまいました。父（ちち）の様子（ようす）がおかしかったので、私（わたし）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びました。父（ちち）は自分（じぶん）の部屋（へや）の隅（すみ）で倒（たお）れていました。", "file": "847a4b020b7deeae.mp3", "new": false}, {"sec": "故事", "text": "病院に着くと、医者さんがすぐに検査をしてくれました。「なるほど、少し前から頭が痛かったんですね」と医者さんは言いました。父は我慢していたそうです。今日は注射をしなければならないと言われて、そのまましばらく入院することになりました。", "hint": "病院（びょういん）に着（つ）くと、医者（いしゃ）さんがすぐに検査（けんさ）をしてくれました。「なるほど、少（すこ）し前（まえ）から頭（あたま）が痛（いた）かったんですね」と医者（いしゃ）さんは言（い）いました。父（ちち）は我慢（がまん）していたそうです。今日（きょう）は注射（ちゅうしゃ）をしなければならないと言（い）われて、そのまましばらく入院（にゅういん）することになりました。", "file": "4407166e8e534fb4.mp3", "new": false}, {"sec": "故事", "text": "特別な部屋は空いていなかったので、父は普通の部屋に入ることになりました。私は一度家に戻って、入院の支度をしました。着替えや歯ブラシを用意して、家族は消化にいいお粥を炊いて持っていきました。", "hint": "特別（とくべつ）な部屋（へや）は空（あ）いていなかったので、父（ちち）は普通（ふつう）の部屋（へや）に入（はい）ることになりました。私（わたし）は一度（いちど）家（いえ）に戻（もど）って、入院（にゅういん）の支度（したく）をしました。着替（きが）えや歯（は）ブラシを用意（ようい）して、家族（かぞく）は消化（しょうか）にいいお粥（かゆ）を炊いて（たいて）持（も）っていきました。", "file": "5162a95d01613a97.mp3", "new": false}, {"sec": "故事", "text": "その夜、病室の電灯がつくと、父の顔色は少し良くなっているように見えました。看護師さんが「何を召し上がりますか」と優しく聞いてくれて、父は温いスープを一口飲みました。「これはちょっとぬるいね」と父は笑いました。看護師さんはベッドのシーツも取り替えてくれました。", "hint": "その夜（よる）、病室（びょうしつ）の電灯（でんとう）がつくと、父（ちち）の顔色（かおいろ）は少（すこ）し良（よ）くなっているように見（み）えました。看護師（かんごし）さんが「何（なに）を召し上がり（めしあがり）ますか」と優（やさ）しく聞（き）いてくれて、父（ちち）は温い（ぬるい）スープを一口（ひとくち）飲（の）みました。「これはちょっとぬるいね」と父（ちち）は笑（わら）いました。看護師（かんごし）さんはベッドのシーツも取り替えて（とりかえて）くれました。", "file": "e7a4fbbeab961bf4.mp3", "new": false}, {"sec": "故事", "text": "翌日、私はお見舞いに行きました。花屋で花を買って、病院の瓶に入れてあげました。それから、小さい人形も一つ持っていくと、父は子供みたいに喜んでくれました。看護師さんが部屋の床を掃いている間、私は読み終わった本を棚に戻しておきました。", "hint": "翌日（よくじつ）、私（わたし）はお見舞い（おみまい）に行（い）きました。花屋（はなや）で花（はな）を買（か）って、病院（びょういん）の瓶（びん）に入（い）れてあげました。それから、小（ちい）さい人形（にんぎょう）も一（ひと）つ持（も）っていくと、父（ちち）は子供（こども）みたいに喜（よろこ）んでくれました。看護師（かんごし）さんが部屋（へや）の床（ゆか）を掃いて（はいて）いる間（あいだ）、私（わたし）は読（よ）み終（お）わった本（ほん）を棚（たな）に戻して（もどして）おきました。", "file": "3ddd661abb2df634.mp3", "new": false}, {"sec": "故事", "text": "薬はとても苦くて、父はいつも顔をしかめていました。傷に薬を塗ってもらってから、痛みは少しずつなくなっていきました。ただ、疲れは少し残っているようで、医者さんに「お酒は当分止めるように」と言われ、なるべく休んだ方がいいとも言われました。", "hint": "薬（くすり）はとても苦くて（にがくて）、父（ちち）はいつも顔（かお）をしかめていました。傷（きず）に薬（くすり）を塗って（ぬって）もらってから、痛（いた）みは少（すこ）しずつなくなっていきました。ただ、疲（つか）れは少（すこ）し残って（のこって）いるようで、医者（いしゃ）さんに「お酒（さけ）は当分（とうぶん）止める（やめる）ように」と言（い）われ、なるべく休（やす）んだ方（ほう）がいいとも言（い）われました。", "file": "3a4552e7ee41f60a.mp3", "new": false}, {"sec": "故事", "text": "入院している間、田舎のおばあちゃんから電報が届きました。「早く元気になりますように」と書いてありました。", "hint": "入院（にゅういん）している間（あいだ）、田舎（いなか）のおばあちゃんから電報（でんぽう）が届（とど）きました。「早（はや）く元気（げんき）になりますように」と書（か）いてありました。", "file": "3364ac3dfea608ab.mp3", "new": false}, {"sec": "故事", "text": "一週間後、父は大分元気になりました。少し痩せてしまいましたが、医者さんに「来週、退院する予定です」と言われました。次の診察も予約して、父はやっと家に戻ることができました。息子の私は、父が元気になった様子を見て、本当に安心しました。", "hint": "一週間後（いっしゅうかんご）、父（ちち）は大分（だいぶ）元気（げんき）になりました。少（すこ）し痩せて（やせて）しまいましたが、医者（いしゃ）さんに「来週（らいしゅう）、退院（たいいん）する予定（よてい）です」と言（い）われました。次（つぎ）の診察（しんさつ）も予約（よやく）して、父（ちち）はやっと家（いえ）に戻る（もどる）ことができました。息子（むすこ）の私（わたし）は、父（ちち）が元気（げんき）になった様子（ようす）を見（み）て、本当（ほんとう）に安心（あんしん）しました。", "file": "4dc46046baf3af09.mp3", "new": false}, {"sec": "故事", "text": "先月、私は新しい町に引っ越しました。引っ越す日は朝から忙しくて、天気予報では雨と言っていましたが、幸い晴れていました。", "hint": "先月（せんげつ）、私（わたし）は新（あたら）しい町（まち）に引っ越し（ひっこし）ました。引っ越す（ひっこす）日（ひ）は朝（あさ）から忙（いそが）しくて、天気予報（てんきよほう）では雨（あめ）と言（い）っていましたが、幸（さいわ）い晴（は）れていました。", "file": "d3d321acea93a8e5.mp3", "new": false}, {"sec": "故事", "text": "新しい部屋の引き出しを開くと、とても深くて、奥に前の人に忘れられた指輪が入っていました。", "hint": "新（あたら）しい部屋（へや）の引き出し（ひきだし）を開く（ひらく）と、とても深くて（ふかくて）、奥（おく）に前（まえ）の人（ひと）に忘（わす）れられた指輪（ゆびわ）が入（はい）っていました。", "file": "c57638b2ef409499.mp3", "new": false}, {"sec": "故事", "text": "荷物を運んでいる時、隣の人と知り合いました。その人は昔、私の高校の先生に似ている気がしました。すると、聞いてみたら本当に学生時代に同じ学校にいたことが分かりました。", "hint": "荷物（にもつ）を運（はこ）んでいる時（とき）、隣（となり）の人（ひと）と知り合いました（しりあいました）。その人（ひと）は昔（むかし）、私（わたし）の高校（こうこう）の先生（せんせい）に似て（にて）いる気（き）がしました。すると、聞（き）いてみたら本当（ほんとう）に学生時代（じだい）に同（おな）じ学校（がっこう）にいたことが分（わ）かりました。", "file": "b5b8d72dc75676cb.mp3", "new": false}, {"sec": "故事", "text": "荷物を片付けながら、近くの売店で食料品を買いました。店員さんはとても親切でした。夜は疲れたので、新しい布団とまくらで早く寝ました。", "hint": "荷物（にもつ）を片付（かたづ）けながら、近（ちか）くの売店（ばいてん）で食料品（しょくりょうひん）を買（か）いました。店員（てんいん）さんはとても親切（しんせつ）でした。夜（よる）は疲（つか）れたので、新（あたら）しい布団（ふとん）とまくらで早（はや）く寝（ね）ました。", "file": "79f1725a74c7465e.mp3", "new": false}, {"sec": "故事", "text": "次の日、近所を散歩してみました。普通の道を歩いていたら、珍しいカフェを見つけました。店の中を回ってみると、大きくて柔らかすぎるパンを売っていました。私はケーキを一つ注文して、店員さんに半分に切ってもらいました。", "hint": "次（つぎ）の日（ひ）、近所（きんじょ）を散歩（さんぽ）してみました。普通（ふつう）の道（みち）を歩（ある）いていたら、珍しい（めずらしい）カフェを見（み）つけました。店（みせ）の中（なか）を回って（まわって）みると、大（おお）きくて柔らかすぎる（やわらかすぎる）パンを売（う）っていました。私（わたし）はケーキを一（ひと）つ注文（ちゅうもん）して、店員（てんいん）さんに半分（はんぶん）に切（き）ってもらいました。", "file": "96f956a4da903018.mp3", "new": false}, {"sec": "故事", "text": "そこで、道の太い木の下に小さいコインが落ちているのを拾いました。隣の家の猫は少し太ってしまったみたいでした。", "hint": "そこで、道（みち）の太い（ふとい）木（き）の下（した）に小（ちい）さいコインが落（お）ちているのを拾いました（ひろいました）。隣（となり）の家（いえ）の猫（ねこ）は少（すこ）し太って（ふとって）しまったみたいでした。", "file": "b0ff808caf1958ce.mp3", "new": false}, {"sec": "故事", "text": "夏が近づいてきたので、水着を買いに行くことにしました。店員さんは私に向いている色を選んでくれました。会計の時、値段が普通の倍になっていることに店員さんが気づきました。", "hint": "夏（なつ）が近（ちか）づいてきたので、水着（みずぎ）を買（か）いに行（い）くことにしました。店員（てんいん）さんは私（わたし）に向いて（むいて）いる色（いろ）を選（えら）んでくれました。会計（かいけい）の時（とき）、値段（ねだん）が普通（ふつう）の倍（ばい）になっていることに店員（てんいん）さんが気（き）づきました。", "file": "d489fc03b842cd7f.mp3", "new": false}, {"sec": "故事", "text": "家に帰ると、床が少し汚れていました。引っ越しの時に汚してしまったようです。拭きながら、りんごの皮を剥いて食べました。", "hint": "家（いえ）に帰（かえ）ると、床（ゆか）が少（すこ）し汚れて（よごれて）いました。引（ひ）っ越（こ）しの時（とき）に汚して（よごして）しまったようです。拭（ふ）きながら、りんごの皮（かわ）を剥いて（むいて）食（た）べました。", "file": "6f5161823d311701.mp3", "new": false}, {"sec": "故事", "text": "最後に、遠くに住んでいる友達へ贈り物を送ることにしました。プレゼントを丁寧に包んで、別の箱に入れました。指でリボンを結びました。", "hint": "最後（さいご）に、遠（とお）くに住（す）んでいる友達（ともだち）へ贈（おく）り物（もの）を送（おく）ることにしました。プレゼントを丁寧（ていねい）に包んで（つつんで）、別（べつ）の箱（はこ）に入（い）れました。指（ゆび）でリボンを結（むす）びました。", "file": "9a82add95c21bbab.mp3", "new": false}, {"sec": "故事", "text": "大学に通うために、生まれた町から引っ越しました。今日から、下宿する生活が始まります。駅から細い道を通って、歩いて五分。角を曲がると、大家さんの家が見えました。とても立派な建物で、少し驚きました。玄関の鍵は暗証番号で、数字を押して開けます。部屋はすぐに見つかりました。", "hint": "大学（だいがく）に通（かよ）うために、生（う）まれた町（まち）から引っ越しました。今日（きょう）から、下宿する生活（せいかつ）が始（はじ）まります。駅（えき）から細（ほそ）い道（みち）を通って、歩（ある）いて五分（ごふん）。角を曲（ま）がると、大家（おおや）さんの家（いえ）が見（み）えました。とても立派な建物（たてもの）で、少（すこ）し驚（おどろ）きました。玄関（げんかん）の鍵（かぎ）は暗証番号で、数字（すうじ）を押（お）して開（あ）けます。部屋（へや）はすぐに見（み）つかりました。", "file": "4667df4e331fe407.mp3", "new": false}, {"sec": "故事", "text": "大家さんは、暗証番号を教えてくれました。近所には、コンビニやスーパーがあります。家賃は割合に安かったです。この部屋には、小さな机とベッドがありました。ドアの鍵は少し緩くて、閉めにくいです。壁は粗くて、絵を掛けるのは大変です。けれども、静かで、勉強には良い環境でしょう。", "hint": "大家（おおや）さんは、暗証番号（あんしょうばんごう）を教（おし）えてくれました。近所には、コンビニやスーパーがあります。家賃（やちん）は割合に安（やす）かったです。この部屋（へや）には、小（ちい）さな机（つくえ）とベッドがありました。ドアの鍵（かぎ）は少（すこ）し緩くて、閉（し）めにくいです。壁（かべ）は粗くて、絵（え）を掛（か）けるのは大変（たいへん）です。けれども、静（しず）かで、勉強（べんきょう）には良（よ）い環境（かんきょう）でしょう。", "file": "1ff39368c02b861e.mp3", "new": false}, {"sec": "故事", "text": "大学の授業が始まりました。クラスメートはみんな競争するように勉強しています。毎日が忙しくて、気分が落ち着きません。壁にカレンダーを掛けて、予定を書き込みました。レポートをパソコンで打つのは、まだ慣れません。ボタンが取れたシャツを、糸で直しました。", "hint": "大学（だいがく）の授業（じゅぎょう）が始（はじ）まりました。クラスメートはみんな競争するように勉強（べんきょう）しています。毎日（まいにち）が忙（いそが）しくて、気分が落（お）ち着（つ）きません。壁（かべ）にカレンダーを掛けて、予定を書（か）き込（こ）みました。レポートをパソコンで打つのは、まだ慣（な）れません。ボタンが取（と）れたシャツを、糸で直（なお）しました。", "file": "76ae56a097fffbf9.mp3", "new": false}, {"sec": "故事", "text": "その夜はとても暑くて、なかなか眠れませんでした。格好も気にせず、床に座り込みました。気がつくと、眠たくなっていました。窓を開けたまま、うとうとしてしまいました。そのまま、寝てしまいました。眠りが浅くて、目が覚めたのは、いつもより早い六時。久しぶりの、ゆっくりした朝ごはん。それで、少し元気が出ました。", "hint": "その夜（よる）はとても暑くて、なかなか眠（ねむ）れませんでした。格好も気（き）にせず、床（ゆか）に座（すわ）り込（こ）みました。気（き）がつくと、眠たくなっていました。窓（まど）を開（あ）けたまま、うとうとしてしまいました。そのまま、寝（ね）てしまいました。眠（ねむ）りが浅くて、目（め）が覚（さ）めたのは、いつもより早（はや）い六時（ろくじ）。久しぶりの、ゆっくりした朝（あさ）ごはん。それで、少（すこ）し元気（げんき）が出（で）ました。", "file": "47a5905ee23754e6.mp3", "new": false}, {"sec": "故事", "text": "今日は、初めての夕飯作り。冷蔵庫に何もなかったので、缶詰を使いました。いくらかかったか、値段を忘れてしまいました。栄養のバランスも、あまり考えていませんでした。ご飯を炊いて、野菜を炒めて、塩を入れました。音楽を聞きながら、片付けをしました。味を真似してみましたが、母の料理とは違っていました。", "hint": "今日（きょう）は、初（はじ）めての夕飯作（づく）り。冷蔵庫（れいぞうこ）に何（なに）もなかったので、缶詰を使（つか）いました。いくらかかったか、値段（ねだん）を忘（わす）れてしまいました。栄養のバランスも、あまり考（かんが）えていませんでした。ご飯（はん）を炊いて、野菜（やさい）を炒めて、塩（しお）を入（い）れました。音楽（おんがく）を聞（き）きながら、片付（かたづ）けをしました。味（あじ）を真似してみましたが、母（はは）の料理（りょうり）とは違（ちが）っていました。", "file": "5ada52b9c96360aa.mp3", "new": false}, {"sec": "故事", "text": "少し焦がしてしまい、恥ずかしくなりました。大家さんは怒らないで、にっこり笑いました。大家さんは気さくな人で、いろいろ教えてくれます。とても優しい人だと思います。大家さんに、炒め方のコツを教えてもらいました。次からは、野菜を先に切っておきます。隣の猫に、一日おきに会っています。時々、餌をあげることもあります。", "hint": "少（すこ）し焦（こ）がしてしまい、恥ずかしくなりました。大家（おおや）さんは怒らないで、にっこり笑（わら）いました。大家（おおや）さんは気さくな人（ひと）で、いろいろ教（おし）えてくれます。とても優しい人（ひと）だと思（おも）います。大家（おおや）さんに、炒（いた）め方（かた）のコツを教（おし）えてもらいました。次（つぎ）からは、野菜（やさい）を先（さき）に切（き）っておきます。隣（となり）の猫（ねこ）に、一日（いちにち）おきに会（あ）っています。時々（ときどき）、餌をあげることもあります。", "file": "06197d89daf81e43.mp3", "new": false}, {"sec": "故事", "text": "静かな町だと聞いていたのに、一番うるさいのは私でした。隣の人に迷惑してしまったかもしれません。謝りに行くと、複雑な矛盾した気持ちになりました。相手は好意的に、気にしないでと言ってくれました。本当に、優しい言葉のおかげです。安心しました。それから、隣のお宅にもよく呼ばれます。", "hint": "静（しず）かな町（まち）だと聞（き）いていたのに、一番（いちばん）うるさいのは私（わたし）でした。隣（となり）の人（ひと）に迷惑してしまったかもしれません。謝（あやま）りに行（い）くと、複雑（ふくざつ）な矛盾した気持（きも）ちになりました。相手（あいて）は好意的（てき）に、気（き）にしないでと言（い）ってくれました。本当（ほんとう）に、優（やさ）しい言葉（ことば）のおかげです。安心（あんしん）しました。それから、隣（となり）のお宅にもよく呼（よ）ばれます。", "file": "b890a58982f5c843.mp3", "new": false}, {"sec": "故事", "text": "手作りのお菓子をご馳走してもらったこともあります。料理にも興味を持つようになりました。週末は、近所の人たちと散歩を楽しんでいます。それに、みんな話しやすいです。朗らかな人が多くて、話していて楽しいです。いくら忙しくても、近所の人に会うと元気が出ます。とても満足な毎日。愉快な近所づきあいに、感謝しています。", "hint": "手作（てづく）りのお菓子（かし）をご馳走してもらったこともあります。料理（りょうり）にも興味を持（も）つようになりました。週末（しゅうまつ）は、近所（きんじょ）の人（ひと）たちと散歩を楽しんでいます。それに、みんな話（はな）しやすいです。朗らかな人（ひと）が多（おお）くて、話（はな）していて楽（たの）しいです。いくら忙（いそが）しくても、近所（きんじょ）の人（ひと）に会（あ）うと元気（げんき）が出（で）ます。とても満足な毎日（まいにち）。愉快な近所（きんじょ）づきあいに、感謝（かんしゃ）しています。", "file": "dffae73bf5b40a85.mp3", "new": false}, {"sec": "故事", "text": "夜中、急に部屋が揺れました。電灯も消えて、真っ暗になりました。とても怖くて、しばらく動けませんでした。「さっきのは大きかったね」と、自分に言い聞かせました。玄関のドアを開けたら、大家さんが外に立っていました。大家さんは、私のことを心配してくれていました。", "hint": "夜中（よなか）、急（きゅう）に部屋（へや）が揺れました。電灯も消えて、真（ま）っ暗（くら）になりました。とても怖くて、しばらく動（うご）けませんでした。「さっきのは大（おお）きかったね」と、自分（じぶん）に言（い）い聞（き）かせました。玄関（げんかん）のドアを開（あ）けたら、大家（おおや）さんが外（そと）に立（た）っていました。大家（おおや）さんは、私（わたし）のことを心配してくれていました。", "file": "2762adc1dedf8bdc.mp3", "new": false}, {"sec": "故事", "text": "「大丈夫？」と、優しく聞かれました。地震のときは、一般に机の下に入るといいそうです。落ちてくる物を避けて、頭を守りました。大家さんはしっかりした声で、みんなを落ち着かせてくれました。次の日も、いつも通り働いていました。壊れた物は、思い切って捨てました。それでも、みんな無事で、少し楽な気持ちになりました。", "hint": "「大丈夫（だいじょうぶ）？」と、優（やさ）しく聞（き）かれました。地震（じしん）のときは、一般に机（つくえ）の下（した）に入（はい）るといいそうです。落（お）ちてくる物（もの）を避けて、頭（あたま）を守（まも）りました。大家（おおや）さんはしっかりした声（こえ）で、みんなを落（お）ち着（つ）かせてくれました。次（つぎ）の日（ひ）も、いつも通（どお）り働いていました。壊（こわ）れた物（もの）は、思（おも）い切（き）って捨てました。それでも、みんな無事（ぶじ）で、少（すこ）し楽な気持（きも）ちになりました。", "file": "1e0f4488afed3c69.mp3", "new": false}, {"sec": "故事", "text": "この頃、桜の花をよく見かけます。一年前は料理が苦手でしたが、今は上手に作れるようになりました。卒業が決まり、大家さんに「おめでとうございます」と言われました。いよいよ、この町と別れる日が近づいています。大家さんと、墓参りに行きました。その気持ちを、ずっと忘れないと思います。", "hint": "この頃、桜（さくら）の花（はな）をよく見（み）かけます。一年前（いちねんまえ）は料理（りょうり）が苦手（にがて）でしたが、今（いま）は上手（じょうず）に作（つく）れるようになりました。卒業（そつぎょう）が決（き）まり、大家（おおや）さんに「おめでとうございます」と言（い）われました。いよいよ、この町（まち）と別れる日（ひ）が近（ちか）づいています。大家（おおや）さんと、墓参（まい）りに行（い）きました。その気持ちを、ずっと忘（わす）れないと思（おも）います。", "file": "4dbeba881b91f435.mp3", "new": false}, {"sec": "故事", "text": "この永遠に続くような景色を、目に焼き付けました。別れは悲しいですが、いい思い出がたくさん残っています。この一年は、本当に幸せでした。記念に、写真を撮ることにしました。大家さんの笑顔を、カメラに写しました。この写真を見るたびに、この町を思い出すと思います。また、この町に来るのが楽しみです。空を見上げると、今にも桜が散りそうでした。", "hint": "この永遠に続（つづ）くような景色（けしき）を、目（め）に焼（や）き付（つ）けました。別（わか）れは悲しいですが、いい思（おも）い出（で）がたくさん残っています。この一年（いちねん）は、本当（ほんとう）に幸せでした。記念に、写真（しゃしん）を撮（と）ることにしました。大家（おおや）さんの笑顔（えがお）を、カメラに写しました。この写真（しゃしん）を見（み）るたびに、この町（まち）を思（おも）い出（だ）すと思（おも）います。また、この町（まち）に来（く）るのが楽しみです。空（そら）を見上（みあ）げると、今（いま）にも桜（さくら）が散（ち）りそうでした。", "file": "b175fc7bab3451e1.mp3", "new": false}, {"sec": "會話", "text": "荷物は全部、車に入れておいたよ。", "hint": "【友達】荷物（にもつ）は全部（ぜんぶ）、車（くるま）に入（い）れておいたよ。", "file": "6a787388ffeb49de.mp3", "new": false}, {"sec": "會話", "text": "ありがとう。すぐ行くから、ちょっと待って。", "hint": "【私】ありがとう。すぐ行（い）くから、ちょっと待（ま）って。", "file": "c286365cf5f678d3.mp3", "new": false}, {"sec": "會話", "text": "一年間、本当によく頑張りましたね。", "hint": "【大家さん】一年間（いちねんかん）、本当（ほんとう）によく頑張（がんば）りましたね。", "file": "9fc961b3d63430f9.mp3", "new": false}, {"sec": "會話", "text": "大家さんが、いつも優しく教えてくれたからです。", "hint": "【私】大家（おおや）さんが、いつも優しく教（おし）えてくれたからです。", "file": "1fe9cd1cff577122.mp3", "new": false}, {"sec": "會話", "text": "近所のみなさんも、寂しそうでしたよ。", "hint": "【大家さん】近所のみなさんも、寂（さび）しそうでしたよ。", "file": "b9094b4a35782948.mp3", "new": false}, {"sec": "會話", "text": "また、みんなで遊びに来たいね。", "hint": "【友達】また、みんなで遊（あそ）びに来（き）たいね。", "file": "193cda3892ab8100.mp3", "new": false}, {"sec": "會話", "text": "大家さん、この町に来るたびに、ここに寄りますね。", "hint": "【私】大家（おおや）さん、この町（まち）に来（く）るたびに、ここに寄（よ）りますね。", "file": "56cbf952016e8ce6.mp3", "new": false}, {"sec": "會話", "text": "楽しみに待っていますよ。元気でね。", "hint": "【大家さん】楽しみに待（ま）っていますよ。元気（げんき）でね。", "file": "99ca1bcf2dff61ef.mp3", "new": false}, {"sec": "故事", "text": "私は大学の学部で、経済を勉強してきました。今日は、四年間で最後の講義でした。一生懸命、ここまで頑張ってきました。卒業するために、休まず通いました。教室に入ると、クラスメートはもう揃っていました。", "hint": "私（わたし）は大学（だいがく）の学部で、経済（けいざい）を勉強してきました。今日（きょう）は、四年間（よねんかん）で最後（さいご）の講義でした。一生懸命、ここまで頑張（がんば）ってきました。卒業（そつぎょう）するために、休（やす）まず通（かよ）いました。教室に入（はい）ると、クラスメートはもう揃っていました。", "file": "4095169c5721f1d6.mp3", "new": false}, {"sec": "故事", "text": "先生は厳しい方ですが、今日はよく笑っていました。「レポートは簡単じゃないよ」と、前によく言われました。黒板の字を見て、みんな鉛筆を止めました。先生はいつも、分かりやすく教えていました。緊張して、声が震えてしまいました。それでも、今日の講義はいい思い出になるでしょう。講義が終わりになると、教室の前で、記念にみんなで写真を撮りました。", "hint": "先生（せんせい）は厳しい方（かた）ですが、今日（きょう）はよく笑（わら）っていました。「レポートは簡単じゃないよ」と、前（まえ）によく言（い）われました。黒板（こくばん）の字（じ）を見（み）て、みんな鉛筆を止（と）めました。先生（せんせい）はいつも、分（わ）かりやすく教えていました。緊張（きんちょう）して、声（こえ）が震（ふる）えてしまいました。それでも、今日（きょう）の講義（こうぎ）はいい思（おも）い出（で）になるでしょう。講義（こうぎ）が終わりになると、教室（きょうしつ）の前（まえ）で、記念にみんなで写真（しゃしん）を撮（と）りました。", "file": "8c5ad315e4b5876e.mp3", "new": false}, {"sec": "故事", "text": "卒業の前に、研究室を片付けることになりました。まず、いる物といらない物を探しました。捨てるかどうか迷う事柄が多くて、片付けはなかなか進みません。友達も来て、片付けを手伝いました。私のために来てくれたのだと思います。一緒に作業をしていると、時間はあっという間に過ぎました。", "hint": "卒業（そつぎょう）の前（まえ）に、研究室（けんきゅうしつ）を片付（かたづ）けることになりました。まず、いる物（もの）といらない物（もの）を探しました。捨てるかどうか迷（まよ）う事柄が多（おお）くて、片付（かたづ）けはなかなか進（すす）みません。友達（ともだち）も来（き）て、片付（かたづ）けを手伝いました。私（わたし）のために来（き）てくれたのだと思（おも）います。一緒に作業（さぎょう）をしていると、時間（じかん）はあっという間（ま）に過（す）ぎました。", "file": "531b07dc1684977a.mp3", "new": false}, {"sec": "故事", "text": "午後になると、後輩たちも何人か集まりました。忙しいのに来てくれて、本当に嬉しかったです。重い本を運んでいたら、腰が痛くなりました。作業が終わらなくて困っていました。そこで、後輩に手伝ってもらいました。後輩たちには、いつも本当に助かっています。ゴミの分別を間違えてしまい、先輩に謝りました。ゴミの出し方は複雑です。例えば、燃えるゴミと燃えないゴミの区別があります。帰る前に、後輩が最後まで手伝ってくれました。四年間、この活動が大好きでした。最後に、鍵が本当に閉まっているか、もう一度確かめました。", "hint": "午後（ごご）になると、後輩（こうはい）たちも何人（なんにん）か集まりました。忙（いそが）しいのに来（き）てくれて、本当（ほんとう）に嬉（うれ）しかったです。重（おも）い本（ほん）を運（はこ）んでいたら、腰が痛（いた）くなりました。作業（さぎょう）が終（お）わらなくて困（こま）っていました。そこで、後輩（こうはい）に手伝（てつだ）ってもらいました。後輩（こうはい）たちには、いつも本当（ほんとう）に助かっています。ゴミの分別（ぶんべつ）を間違（まちが）えてしまい、先輩（せんぱい）に謝りました。ゴミの出（だ）し方（かた）は複雑（ふくざつ）です。例えば、燃（も）えるゴミと燃（も）えないゴミの区別（くべつ）があります。帰（かえ）る前（まえ）に、後輩（こうはい）が最後（さいご）まで手伝（てつだ）ってくれました。四年間（よねんかん）、この活動が大好（だいす）きでした。最後（さいご）に、鍵（かぎ）が本当（ほんとう）に閉（し）まっているか、もう一度（いちど）確かめました。", "file": "b7aff0c0bd46cde2.mp3", "new": false}, {"sec": "故事", "text": "勤めている会社に入って、もうすぐ二か月になります。この会社の規則は、多くありません。仕事はそれほど忙しくありません。でも、大事なのは時間をちゃんと守ること。「規則は守らなければならない」と、いつも思っています。先輩は普段から優しいです。仕事のやり方を直接教えてくれます。", "hint": "勤めている会社（かいしゃ）に入（はい）って、もうすぐ二（に）か月（げつ）になります。この会社（かいしゃ）の規則は、多（おお）くありません。仕事（しごと）はそれほど忙（いそが）しくありません。でも、大事（だいじ）なのは時間（じかん）をちゃんと守（まも）ること。「規則（きそく）は守（まも）らなければならない」と、いつも思（おも）っています。先輩（せんぱい）は普段から優しいです。仕事（しごと）のやり方（かた）を直接教（おし）えてくれます。", "file": "f2cbc18bb624ffb8.mp3", "new": false}, {"sec": "故事", "text": "入ったばかりのころは、失敗ばかりでした。だんだん、一人で仕事ができるようになりました。パソコンの調子が悪い日もあります。先輩が留守の間、電話の対応を任されました。仕事が終わらない日は、残業しています。反対に、体調が悪い日は、早退します。今は仕事にも慣れて、毎日が順調に進んでいます。今度の連休には、初めての出張に行くことになりました。", "hint": "入（はい）ったばかりのころは、失敗（しっぱい）ばかりでした。だんだん、一人（ひとり）で仕事（しごと）ができるようになりました。パソコンの調子が悪（わる）い日（ひ）もあります。先輩（せんぱい）が留守の間（あいだ）、電話（でんわ）の対応（たいおう）を任（まか）されました。仕事（しごと）が終（お）わらない日（ひ）は、残業しています。反対（はんたい）に、体調（たいちょう）が悪（わる）い日（ひ）は、早退します。今（いま）は仕事（しごと）にも慣（な）れて、毎日（まいにち）が順調（じゅんちょう）に進んでいます。今度（こんど）の連休には、初（はじ）めての出張（しゅっちょう）に行（い）くことになりました。", "file": "994854fd061da724.mp3", "new": false}, {"sec": "故事", "text": "明日はいよいよ初めての出張です。夜のうちに、荷物を準備しました。会社までの地図も、もう一度確認。必要な物は、前もって鞄に入れておきました。時計を見ると、ちょうど九時でした。使っていなかった鞄には、埃が積もっていました。", "hint": "明日（あした）はいよいよ初（はじ）めての出張（しゅっちょう）です。夜（よる）のうちに、荷物（にもつ）を準備しました。会社（かいしゃ）までの地図も、もう一度（いちど）確認（かくにん）。必要（ひつよう）な物（もの）は、前（まえ）もって鞄（かばん）に入（い）れておきました。時計（とけい）を見（み）ると、ちょうど九時（くじ）でした。使（つか）っていなかった鞄（かばん）には、埃（ほこり）が積もっていました。", "file": "3c324cfd122d911c.mp3", "new": false}, {"sec": "故事", "text": "早朝に出掛けるので、早く寝ることにしました。寝る前に、玄関の戸をちゃんと閉めました。そのとき、突然の雨。窓を見たら、風も強くなっていました。雨が入るのを防ぐために、窓をしっかり閉めました。出張には、後輩を一人連れて行くことになっています。テレビをつけると、明日の天気放送が流れていました。アナウンサーの声が小さくて、聞きにくいです。でも、外の風の音は、だんだん静かになっていきました。明日は晴れるといいなと思いながら、眠りにつきました。", "hint": "早朝（そうちょう）に出掛けるので、早（はや）く寝（ね）ることにしました。寝（ね）る前（まえ）に、玄関（げんかん）の戸をちゃんと閉（し）めました。そのとき、突然の雨（あめ）。窓（まど）を見（み）たら、風（かぜ）も強（つよ）くなっていました。雨（あめ）が入（はい）るのを防ぐために、窓（まど）をしっかり閉（し）めました。出張（しゅっちょう）には、後輩（こうはい）を一人（ひとり）連れて行くことになっています。テレビをつけると、明日（あした）の天気（てんき）放送が流（なが）れていました。アナウンサーの声（こえ）が小（ちい）さくて、聞（き）きにくいです。でも、外の風（かぜ）の音（おと）は、だんだん静（しず）かになっていきました。明日（あした）は晴（は）れるといいなと思（おも）いながら、眠（ねむ）りにつきました。", "file": "db57c1a01ba4c57b.mp3", "new": false}, {"sec": "故事", "text": "本社に着きました。受付で「ただいま参りました」と挨拶しました。部長は、いつも命令が多いと聞いていました。でも、部長は何事も丁寧になさる方でした。少し緊張しましたが、笑顔で対応しました。資料を拝見してもよろしいですか、と丁寧に尋ねました。", "hint": "本社に着（つ）きました。受付（うけつけ）で「ただいま参りました」と挨拶（あいさつ）しました。部長（ぶちょう）は、いつも命令が多（おお）いと聞（き）いていました。でも、部長（ぶちょう）は何事（なにごと）も丁寧（ていねい）になさる方（かた）でした。少（すこ）し緊張（きんちょう）しましたが、笑顔（えがお）で対応（たいおう）しました。資料（しりょう）を拝見してもよろしいですか、と丁寧（ていねい）に尋（たず）ねました。", "file": "5b07c9a2e309c534.mp3", "new": false}, {"sec": "故事", "text": "向こうの担当者は、丁寧に説明してくれました。見方が独特で、とても興味を持ちました。難しい言葉を用いて話すので、メモを取りながら聞いていました。この会社を信用していいのか、少し不安でした。でも、担当者の話し方は、とても誠実でした。この人を信頼してもいいと思いました。町の人口や産業についても、詳しく教えてもらいました。", "hint": "向こうの担当者（たんとうしゃ）は、丁寧（ていねい）に説明（せつめい）してくれました。見方が独特（どくとく）で、とても興味を持（も）ちました。難（むずか）しい言葉（ことば）を用いて話（はな）すので、メモを取（と）りながら聞（き）いていました。この会社（かいしゃ）を信用していいのか、少（すこ）し不安（ふあん）でした。でも、担当者（たんとうしゃ）の話（はな）し方（かた）は、とても誠実（せいじつ）でした。この人（ひと）を信頼してもいいと思（おも）いました。町（まち）の人口や産業（さんぎょう）についても、詳（くわ）しく教（おし）えてもらいました。", "file": "0d6cdbd71077cda9.mp3", "new": false}, {"sec": "故事", "text": "仕事が終わったあと、先輩に誘われて二次会に行きました。店の中は冷房が効きすぎていて、少し寒かったです。テーブルの上には、古い灰皿が置かれたままでした。お茶の湯が熱すぎて、なかなか飲めませんでした。", "hint": "仕事（しごと）が終（お）わったあと、先輩（せんぱい）に誘（さそ）われて二次会に行（い）きました。店（みせ）の中（なか）は冷房が効（き）きすぎていて、少（すこ）し寒（さむ）かったです。テーブルの上（うえ）には、古（ふる）い灰皿が置（お）かれたままでした。お茶（ちゃ）の湯が熱（あつ）すぎて、なかなか飲（の）めませんでした。", "file": "06863b76c1f55d1c.mp3", "new": false}, {"sec": "故事", "text": "テレビでニュースを見ていました。二国間の貿易摩擦について放送していました。先輩は「疲れているのに、まだ元気だね」と笑いました。領収書を忘れずにもらっておくよう、先輩に言われました。空を見上げると、今にも星が降ってきそうでした。月の光が窓に反射して、きれいでした。先輩は「今日の用は済んだから、ゆっくりしよう」と言いました。クイズ番組の賞金の話で、みんな盛り上がりました。いつか自分の店を持つのが、先輩の夢だそうです。次の朝、私たちは予定通りに出発しました。", "hint": "テレビでニュースを見（み）ていました。二国間（にこくかん）の貿易（ぼうえき）摩擦について放送（ほうそう）していました。先輩（せんぱい）は「疲（つか）れているのに、まだ元気（げんき）だね」と笑（わら）いました。領収書を忘（わす）れずにもらっておくよう、先輩（せんぱい）に言（い）われました。空（そら）を見上（みあ）げると、今（いま）にも星（ほし）が降（ふ）ってきそうでした。月（つき）の光（ひかり）が窓（まど）に反射して、きれいでした。先輩（せんぱい）は「今日（きょう）の用は済（す）んだから、ゆっくりしよう」と言（い）いました。クイズ番組（ばんぐみ）の賞金の話（はなし）で、みんな盛（も）り上（あ）がりました。いつか自分（じぶん）の店（みせ）を持（も）つのが、先輩（せんぱい）の夢だそうです。次（つぎ）の朝（あさ）、私（わたし）たちは予定通（どお）りに出発しました。", "file": "f075cb93d044e2fa.mp3", "new": false}, {"sec": "會話", "text": "初めての出張、どうだった？", "hint": "【先輩】初（はじ）めての出張（しゅっちょう）、どうだった？", "file": "8e96ffbdfd4ccd7a.mp3", "new": false}, {"sec": "會話", "text": "少し緊張しましたが、とても勉強になりました。", "hint": "【私】少（すこ）し緊張（きんちょう）しましたが、とても勉強（べんきょう）になりました。", "file": "e4bc36f19b582262.mp3", "new": false}, {"sec": "會話", "text": "先輩のメモ、あとで拝見してもいいですか。", "hint": "【後輩】先輩（せんぱい）のメモ、あとで拝見してもいいですか。", "file": "23b60914255811e3.mp3", "new": false}, {"sec": "會話", "text": "いいよ。メモと領収書は、もうまとめておいたよ。", "hint": "【私】いいよ。メモと領収書は、もうまとめておいたよ。", "file": "22303c5fee901bf7.mp3", "new": false}, {"sec": "會話", "text": "疲れていたのに、二人ともよく頑張ったね。", "hint": "【先輩】疲（つか）れていたのに、二人（ふたり）ともよく頑張（がんば）ったね。", "file": "f498889fb2609652.mp3", "new": false}, {"sec": "會話", "text": "先輩たちが、いろいろ教えてくれましたから。", "hint": "【後輩】先輩（せんぱい）たちが、いろいろ教（おし）えてくれましたから。", "file": "36e210bdb41c69a6.mp3", "new": false}, {"sec": "會話", "text": "連休は、ゆっくり休んでね。", "hint": "【先輩】連休は、ゆっくり休（やす）んでね。", "file": "d37b9a6013103bdf.mp3", "new": false}, {"sec": "會話", "text": "はい。でも、報告書を先に書いてしまいます。", "hint": "【私】はい。でも、報告書（ほうこくしょ）を先（さき）に書（か）いてしまいます。", "file": "6be1c743378001bc.mp3", "new": false}, {"sec": "故事", "text": "私は高校生です。今は三年生で、毎朝七時に家を出ています。電車で三十分。朝はいつも忙しいです。でも、朝食はきちんと食べます。", "hint": "私（わたし）は高校生です。今（いま）は三年生（さんねんせい）で、毎朝（まいあさ）七時（しちじ）に家（いえ）を出（で）ています。電車（でんしゃ）で三十分（さんじゅっぷん）。朝（あさ）はいつも忙（いそが）しいです。でも、朝食はきちんと食（た）べます。", "file": "df7e50ae16c07734.mp3", "new": false}, {"sec": "故事", "text": "いつもみんなより先に教室に着きます。みんなは、まだ家にいるでしょう。「今日も一番だ」と思いながら、最初に黒板をきれいにします。かばんの中には、教科書と消しゴムが入っています。それを机の上に出しておきます。", "hint": "いつもみんなより先に教室に着（つ）きます。みんなは、まだ家（いえ）にいるでしょう。「今日（きょう）も一番（いちばん）だ」と思（おも）いながら、最初に黒板をきれいにします。かばんの中（なか）には、教科書と消しゴムが入（はい）っています。それを机（つくえ）の上（うえ）に出（だ）しておきます。", "file": "48c121d37886c847.mp3", "new": false}, {"sec": "故事", "text": "私の担任の先生は、優しい人です。名前は山田。分からないことがあると、いつも「ゆっくりでいいですよ」と言ってくれます。", "hint": "私（わたし）の担任の先生（せんせい）は、優しい人（ひと）です。名前（なまえ）は山田（やまだ）。分（わ）からないことがあると、いつも「ゆっくりでいいですよ」と言（い）ってくれます。", "file": "892b01af74de7bda.mp3", "new": false}, {"sec": "故事", "text": "しばらくして、友達の田中さんが来ました。「おはよう、今日も早いね」と、いつも声をかけてくれます。", "hint": "しばらくして、友達（ともだち）の田中（たなか）さんが来（き）ました。「おはよう、今日（きょう）も早（はや）いね」と、いつも声（こえ）をかけてくれます。", "file": "c81bccb15be5d00f.mp3", "new": false}, {"sec": "故事", "text": "今日は体育の時間。生徒が皆でグラウンドを走っています。三十分ぐらい走ると、とても暑くなります。「ああ、冷たい水が飲みたい」と思いました。", "hint": "今日（きょう）は体育の時間（じかん）。生徒が皆でグラウンドを走（はし）っています。三十分（さんじゅっぷん）ぐらい走（はし）ると、とても暑くなります。「ああ、冷（つめ）たい水（みず）が飲（の）みたい」と思（おも）いました。", "file": "91684f4976e0db63.mp3", "new": false}, {"sec": "故事", "text": "私は国語の時間が好きです。知らない言葉に出会うと、すぐ辞書で調べます。家には、父の古い辞典もあります。", "hint": "私（わたし）は国語の時間（じかん）が好（す）きです。知（し）らない言葉に出会（であ）うと、すぐ辞書で調（しら）べます。家（うち）には、父（ちち）の古（ふる）い辞典もあります。", "file": "c0803f910b38f74e.mp3", "new": false}, {"sec": "故事", "text": "辞典を開くと、小さい字がたくさん。「へえ、こんな言葉もある」と思って、読んでいるだけで面白いです。調べた言葉は、ノートに書いておきます。", "hint": "辞典を開（ひら）くと、小さい字（じ）がたくさん。「へえ、こんな言葉もある」と思（おも）って、読（よ）んでいるだけで面白いです。調（しら）べた言葉は、ノートに書（か）いておきます。", "file": "e62b9fac7de04d5f.mp3", "new": false}, {"sec": "故事", "text": "数学の時間は、数字と計算がたくさん。実は、数学はあまり好きではありません。「また間違えた」と思いながら、答えが違うところを赤いペンで直しています。分からないところは、友達に教えてもらいます。", "hint": "数学の時間（じかん）は、数字と計算がたくさん。実（じつ）は、数学はあまり好（す）きではありません。「また間違（まちが）えた」と思（おも）いながら、答（こた）えが違（ちが）うところを赤いペンで直（なお）しています。分（わ）からないところは、友達（ともだち）に教えてもらいます。", "file": "6286e39c730cad96.mp3", "new": false}, {"sec": "故事", "text": "宿題は、毎日たくさん。多い日は、ねるのが遅くなります。だから、早くやっておきます。今週の宿題は、作文。それを、昨日から書き始めました。先生は少し読んで、「いいですね、がんばってください」と言ってくれました。", "hint": "宿題は、毎日（まいにち）たくさん。多（おお）い日（ひ）は、ねるのが遅（おそ）くなります。だから、早（はや）くやっておきます。今週（こんしゅう）の宿題は、作文。それを、昨日（きのう）から書（か）き始（はじ）めました。先生（せんせい）は少（すこ）し読（よ）んで、「いいですね、がんばってください」と言（い）ってくれました。", "file": "d189818a23765624.mp3", "new": false}, {"sec": "故事", "text": "私は小学校のとき、毎日外で遊んでいました。友達と、公園でサッカー。宿題は、あまりしませんでした。", "hint": "私（わたし）は小学校のとき、毎日（まいにち）外（そと）で遊（あそ）んでいました。友達（ともだち）と、公園（こうえん）でサッカー。宿題は、あまりしませんでした。", "file": "101cb85c0692b5ca.mp3", "new": false}, {"sec": "故事", "text": "中学生のころも、ちっとも勉強しませんでした。「勉強は、つまらない」と思っていたからです。でも、中学校を出て高校に入るまでの間に、私は変わりました。勉強するようになりました。", "hint": "中学生のころも、ちっとも勉強しませんでした。「勉強（べんきょう）は、つまらない」と思（おも）っていたからです。でも、中学校を出（で）て高校に入（はい）るまでの間に、私（わたし）は変（か）わりました。勉強（べんきょう）するようになりました。", "file": "dbe9e31b1266f034.mp3", "new": false}, {"sec": "故事", "text": "夏休みは、毎日図書館で過ごしていました。大学に入るために、毎日勉強していました。先生はいつも「適当に覚えないで、自分の知恵を使いなさい」と言います。まず、単純な問題を選んで、「これなら私にもできる」と思いながら、順番に解き始めました。", "hint": "夏休（なつやす）みは、毎日（まいにち）図書館（としょかん）で過ごしていました。大学（だいがく）に入（はい）るために、毎日（まいにち）勉強（べんきょう）していました。先生（せんせい）はいつも「適当に覚（おぼ）えないで、自分（じぶん）の知恵を使（つか）いなさい」と言（い）います。まず、単純な問題（もんだい）を選（えら）んで、「これなら私（わたし）にもできる」と思（おも）いながら、順番（じゅんばん）に解（と）き始（はじ）めました。", "file": "b8006d599bc57ef6.mp3", "new": false}, {"sec": "故事", "text": "勉強は、だんだん楽しい時間に。正直に言うと、あの夏の経験が、今の私を作っています。", "hint": "勉強（べんきょう）は、だんだん楽（たの）しい時間（じかん）に。正直に言（い）うと、あの夏（なつ）の経験が、今（いま）の私（わたし）を作（つく）っています。", "file": "39d419aa73faeefd.mp3", "new": false}, {"sec": "故事", "text": "試験の前の日は、あまりねませんでした。試験の朝、私は緊張して、頭が痛くなりました。考えれば考えるほど、心配でした。", "hint": "試験（しけん）の前（まえ）の日（ひ）は、あまりねませんでした。試験（しけん）の朝（あさ）、私（わたし）は緊張して、頭（あたま）が痛（いた）くなりました。考（かんが）えれば考（かんが）えるほど、心配でした。", "file": "bfe9bfdf34f00bfd.mp3", "new": false}, {"sec": "故事", "text": "「自信を持って、あなたを信じているよ」と言いながら、母が薬を持ってきてくれました。朝ごはんは、ほんの少し。", "hint": "「自信を持（も）って、あなたを信じているよ」と言（い）いながら、母（はは）が薬を持（も）ってきてくれました。朝（あさ）ごはんは、ほんの少（すこ）し。", "file": "cee5781f34250146.mp3", "new": false}, {"sec": "故事", "text": "学校に着くと、泣いている子もいました。隣の子も、今にも泣きそうでした。友達にゆっくり話してもらい、「大丈夫、だれでも緊張するよ」と言われて、少し楽になりました。", "hint": "学校（がっこう）に着（つ）くと、泣いている子（こ）もいました。隣（となり）の子（こ）も、今（いま）にも泣きそうでした。友達（ともだち）にゆっくり話（はな）してもらい、「大丈夫（だいじょうぶ）、だれでも緊張するよ」と言（い）われて、少（すこ）し楽（らく）になりました。", "file": "1dc22bbe10fa06ed.mp3", "new": false}, {"sec": "故事", "text": "発表の日。すぐにパソコンを開きました。自分の番号を見つけて、びっくりしました。本当に合格していて、成績も素晴らしかったです。母に電話すると、母の声もうれしそうでした。", "hint": "発表（はっぴょう）の日（ひ）。すぐにパソコンを開（ひら）きました。自分（じぶん）の番号（ばんごう）を見（み）つけて、びっくりしました。本（ほん）当（あ）に合格していて、成績も素晴らしかったです。母（はは）に電話（でんわ）すると、母（はは）の声（こえ）もうれしそうでした。", "file": "f24fd44d2eb8b823.mp3", "new": false}, {"sec": "故事", "text": "いよいよ、来週は卒業する日です。私たちは、三年間、この学校にいました。式の日程は、もう決まっています。", "hint": "いよいよ、来週（らいしゅう）は卒業する日（ひ）です。私（わたし）たちは、三年間（さんねんかん）、この学校（がっこう）にいました。式（しき）の日程は、もう決（き）まっています。", "file": "b343e27345f55134.mp3", "new": false}, {"sec": "故事", "text": "今年は予算が少なくて、飾りを買うお金がありません。先生に「飾りは自分たちで作らなければならない」と言われていました。前の日、私たちは講堂に椅子を運びました。", "hint": "今年（ことし）は予算が少（すく）なくて、飾（かざ）りを買（か）うお金（かね）がありません。先生（せんせい）に「飾（かざ）りは自分（じぶん）たちで作（つく）らなければならない」と言（い）われていました。前（まえ）の日（ひ）、私（わたし）たちは講堂に椅子（いす）を運びました。", "file": "24eebac529b041f9.mp3", "new": false}, {"sec": "故事", "text": "椅子は、思ったより目方があったので、友達に手伝ってもらって、二人で運んでいました。でも、うっかり手を離して、「あっ」と思った時には、もう遅かったです。椅子を横の花瓶に当ててしまいました。花瓶は割れていました。", "hint": "椅子（いす）は、思（おも）ったより目方があったので、友達（ともだち）に手伝ってもらって、二人（ふたり）で運んでいました。でも、うっかり手（て）を離して、「あっ」と思（おも）った時（とき）には、もう遅（おそ）かったです。椅子（いす）を横（よこ）の花瓶（かびん）に当（あ）ててしまいました。花瓶（かびん）は割れていました。", "file": "1103b906e6f5d560.mp3", "new": false}, {"sec": "故事", "text": "在校生たちが来て、いっしょに飾りを作ってくれました。夕方までに、飾りが全部できていました。明日の式のために、みんなでがんばっています。明日は、きっといい式になるでしょう。", "hint": "在校生たちが来（き）て、いっしょに飾（かざ）りを作（つく）ってくれました。夕方までに、飾（かざ）りが全部（ぜんぶ）できていました。明日（あした）の式（しき）のために、みんなでがんばっています。明日（あした）は、きっといい式（しき）になるでしょう。", "file": "ee9b0d6c8e75f692.mp3", "new": false}, {"sec": "故事", "text": "式の朝、かばんの中を見ておきました。忘れ物はありません。「よし、これで大丈夫だ」と思いました。空は、とてもきれい。", "hint": "式（しき）の朝（あさ）、かばんの中（なか）を見（み）ておきました。忘れ物はありません。「よし、これで大丈夫（だいじょうぶ）だ」と思（おも）いました。空（そら）は、とてもきれい。", "file": "0500472a16fcfbb5.mp3", "new": false}, {"sec": "故事", "text": "校庭では、在校生たちが花びらを撒く練習をしていました。皆で講堂に入ると、中はいつもより静か。南の窓から、朝日が入ってきました。", "hint": "校庭では、在校生たちが花（はな）びらを撒く練習（れんしゅう）をしていました。皆で講堂に入（はい）ると、中（なか）はいつもより静（しず）か。南の窓（まど）から、朝日（あさひ）が入（はい）ってきました。", "file": "fafc6234291d6394.mp3", "new": false}, {"sec": "故事", "text": "校長先生は、私たちの教育について話し、世界的に有名な人の話も紹介しました。「いい話だ」と思っていると、友達が泣いていました。その友達は、「泣かない」と言ったのに、泣いてしまいました。", "hint": "校長先生（せんせい）は、私（わたし）たちの教育について話（はな）し、世界的に有名（ゆうめい）な人（ひと）の話（はなし）も紹介（しょうかい）しました。「いい話（はなし）だ」と思（おも）っていると、友達（ともだち）が泣いていました。その友達（ともだち）は、「泣かない」と言（い）ったのに、泣いてしまいました。", "file": "9c6aa4bd7bfe2f57.mp3", "new": false}, {"sec": "故事", "text": "式のあと、先生から万年筆をもらいました。用事がある人は先に帰りましたが、私は夕方まで校庭にいました。この万年筆を見るたびに、この学校を思い出すでしょう。", "hint": "式（しき）のあと、先生（せんせい）から万年筆をもらいました。用事がある人（ひと）は先に帰（かえ）りましたが、私（わたし）は夕方まで校庭にいました。この万年筆を見（み）るたびに、この学校（がっこう）を思（おも）い出（だ）すでしょう。", "file": "db0b33bd6b591e6c.mp3", "new": false}, {"sec": "故事", "text": "四月から、私は大学生です。趣味の時間を作って、英語の本も読めるようになりたいです。大学での新しい生活が、今から楽しみ。", "hint": "四月（しがつ）から、私（わたし）は大学生です。趣味の時間（じかん）を作（つく）って、英語（えいご）の本（ほん）も読（よ）めるようになりたいです。大学（だいがく）での新（あたら）しい生活（せいかつ）が、今（いま）から楽しみ。", "file": "2e443815c8ef8664.mp3", "new": false}, {"sec": "會話", "text": "もう帰る？ぼくは、もう少し校庭にいたいな。", "hint": "【田中】もう帰（かえ）る？ぼくは、もう少（すこ）し校庭にいたいな。", "file": "f20a962c54731cb1.mp3", "new": false}, {"sec": "會話", "text": "ぼくも。あ、山田先生だ。", "hint": "【私】ぼくも。あ、山田（やまだ）先生（せんせい）だ。", "file": "e401658cd51e6da0.mp3", "new": false}, {"sec": "會話", "text": "二人とも、卒業おめでとう。", "hint": "【山田先生】二人（ふたり）とも、卒業おめでとう。", "file": "037e11c0125bcf26.mp3", "new": false}, {"sec": "會話", "text": "先生、三年間ありがとうございました。", "hint": "【私】先生（せんせい）、三年間（さんねんかん）ありがとうございました。", "file": "9246c232ea379540.mp3", "new": false}, {"sec": "會話", "text": "数学が苦手だったのに、よくがんばりましたね。", "hint": "【山田先生】数学が苦手（にがて）だったのに、よくがんばりましたね。", "file": "d1921c5213d86770.mp3", "new": false}, {"sec": "會話", "text": "田中くんに、いつも教えてもらっていましたから。", "hint": "【私】田中（たなか）くんに、いつも教（おし）えてもらっていましたから。", "file": "4acf8379373ae1e0.mp3", "new": false}, {"sec": "會話", "text": "大学でも、自分の知恵を使って、よく考えてくださいね。", "hint": "【山田先生】大学（だいがく）でも、自分（じぶん）の知恵を使（つか）って、よく考（かんが）えてくださいね。", "file": "5334f1514bb0fcb7.mp3", "new": false}, {"sec": "會話", "text": "はい。先生、三人で写真を撮りませんか。", "hint": "【田中】はい。先生（せんせい）、三人（さんにん）で写真（しゃしん）を撮（と）りませんか。", "file": "9805361d6011ca5e.mp3", "new": false}, {"sec": "故事", "text": "私は大学の二年生で、英語を勉強しています。今朝は六時に起きました。窓を開けて、「もう四月だ。暖かいな」と思いました。", "hint": "私（わたし）は大学（だいがく）の二年生（にねんせい）で、英語（えいご）を勉強しています。今朝は六時（ろくじ）に起（お）きました。窓（まど）を開（あ）けて、「もう四月（しがつ）だ。暖かいな」と思（おも）いました。", "file": "71f366b025b96b87.mp3", "new": false}, {"sec": "故事", "text": "授業は九時から。大学の図書館は、八時からやっています。毎朝、授業の前に、そこで一時間勉強します。", "hint": "授業（じゅぎょう）は九時（くじ）から。大学（だいがく）の図書館は、八時（はちじ）からやっています。毎朝（まいあさ）、授業（じゅぎょう）の前（まえ）に、そこで一時間（いちじかん）勉強（べんきょう）します。", "file": "5a6c76f752709e5f.mp3", "new": false}, {"sec": "故事", "text": "駅へ行く途中で、コンビニに寄りました。パンを買って、駅の時計を見ました。まだ七時半。「よかった、間に合う」とほっとしました。", "hint": "駅（えき）へ行（い）く途中で、コンビニに寄（よ）りました。パンを買（か）って、駅（えき）の時計を見（み）ました。まだ七時半（しちじはん）。「よかった、間に合う」とほっとしました。", "file": "27ab938a3fa80c41.mp3", "new": false}, {"sec": "故事", "text": "今日の一時間目は文法の授業です。図書館で、教科書の予習をしました。私は文法が苦手です。今週の課も、とても難しかったです。「授業の後で、もう一度復習する」と、ノートに書きました。", "hint": "今日（きょう）の一時間目（いちじかんめ）は文法の授業（じゅぎょう）です。図書館（としょかん）で、教科書（きょうかしょ）の予習をしました。私（わたし）は文法（ぶんぽう）が苦手です。今週（こんしゅう）の課（か）も、とても難しかったです。「授業（じゅぎょう）の後（あと）で、もう一度（いちど）復習する」と、ノートに書（か）きました。", "file": "e4671e0356b2ce01.mp3", "new": false}, {"sec": "故事", "text": "それから、発音も上手ではありません。先生はいつも「声に出して練習してください」と言います。「これから毎朝、十分間練習するようにする」と決めました。", "hint": "それから、発音も上手（じょうず）ではありません。先生（せんせい）はいつも「声（こえ）に出（だ）して練習してください」と言（い）います。「これから毎朝（まいあさ）、十分間（じゅっぷんかん）練習（れんしゅう）するようにする」と決（き）めました。", "file": "ae156bae40b88925.mp3", "new": false}, {"sec": "故事", "text": "私の好きな授業は、佐藤先生のイギリス文学です。先生はとても熱心で、どんな質問にも答えてくれます。", "hint": "私（わたし）の好（す）きな授業（じゅぎょう）は、佐藤先生（さとうせんせい）のイギリス文学です。先生（せんせい）はとても熱心で、どんな質問（しつもん）にも答（こた）えてくれます。", "file": "39bb1f6cf617ff60.mp3", "new": false}, {"sec": "故事", "text": "五月には、この授業で一人十分間発表します。好きな小説を一つ選んで、紹介します。私は、その一部を日本語に翻訳して、みんなに見せたいと思いました。", "hint": "五月（ごがつ）には、この授業（じゅぎょう）で一人（ひとり）十分間（じゅっぷんかん）発表します。好（す）きな小説（しょうせつ）を一（ひと）つ選んで、紹介（しょうかい）します。私（わたし）は、その一部（いちぶ）を日本語（にほんご）に翻訳して、みんなに見（み）せたいと思（おも）いました。", "file": "7a75fffe4ec7a6d2.mp3", "new": false}, {"sec": "故事", "text": "選んだのは、百年前の小説です。毎晩、辞書を使いながら読みました。古い英語なので、読みにくいところがたくさんありました。", "hint": "選（えら）んだのは、百年（ひゃくねん）前（まえ）の小説（しょうせつ）です。毎晩（まいばん）、辞書を使（つか）いながら読みました。古（ふる）い英語（えいご）なので、読（よ）みにくいところがたくさんありました。", "file": "7732f5202b93eeac.mp3", "new": false}, {"sec": "故事", "text": "わからないところは、研究室で先生に聞きました。先生は、いつも詳しい説明をしてくれます。友達の真由は、「本当に真面目だね」と笑っていました。", "hint": "わからないところは、研究室（けんきゅうしつ）で先生（せんせい）に聞（き）きました。先生（せんせい）は、いつも詳しい説明（せつめい）をしてくれます。友達（ともだち）の真由（まゆ）は、「本当（ほんとう）に真面目だね」と笑（わら）っていました。", "file": "e467f0904ec62da1.mp3", "new": false}, {"sec": "故事", "text": "発表の日、私はとても緊張していました。うまくできるかどうか、心配でした。でも、発表は無事に終わりました。", "hint": "発表（はっぴょう）の日（ひ）、私（わたし）はとても緊張していました。うまくできるかどうか、心配（しんぱい）でした。でも、発表（はっぴょう）は無事（ぶじ）に終（お）わりました。", "file": "c85034a535b99cf4.mp3", "new": false}, {"sec": "故事", "text": "先生は「随分上手になりましたね」と言ってくれました。発表は九十点。「かなりいい点だ」と思って、うれしくなりました。", "hint": "先生（せんせい）は「随分上手（じょうず）になりましたね」と言（い）ってくれました。発表（はっぴょう）は九十（きゅうじゅっ）点。「かなりいい点（てん）だ」と思（おも）って、うれしくなりました。", "file": "12462d5e70d30d7a.mp3", "new": false}, {"sec": "故事", "text": "六月の土曜日、真由と駅前の本屋へ行きました。先月できた、新しい店です。店の前には、人がたくさん並んでいました。", "hint": "六月（ろくがつ）の土曜日（どようび）、真由（まゆ）と駅前（えきまえ）の本屋へ行（い）きました。先月（せんげつ）できた、新しい店（みせ）です。店（みせ）の前（まえ）には、人（ひと）がたくさん並んでいました。", "file": "4395603aee93fef5.mp3", "new": false}, {"sec": "故事", "text": "二階は外国の本のコーナーです。英語の小説が、棚にきれいに並べてありました。店員さんは「この棚の本は、どれでも二割引ですよ」と教えてくれました。", "hint": "二階（にかい）は外国（がいこく）の本（ほん）のコーナーです。英語（えいご）の小説（しょうせつ）が、棚（たな）にきれいに並べてありました。店員（てんいん）さんは「この棚（たな）の本（ほん）は、どれでも二割引（にわりびき）ですよ」と教（おし）えてくれました。", "file": "9ca47631031076e5.mp3", "new": false}, {"sec": "故事", "text": "そこで私は、ずっと探していた本を見つけました。佐藤先生が授業で話していた小説です。", "hint": "そこで私（わたし）は、ずっと探していた本（ほん）を見つけました。佐藤先生（さとうせんせい）が授業（じゅぎょう）で話（はな）していた小説（しょうせつ）です。", "file": "f2d98f252e0efb71.mp3", "new": false}, {"sec": "故事", "text": "私の夢は、イギリスに留学することです。真由のお兄さんは、去年アメリカに留学しました。真由は「大学のプログラムに申し込めば、お金も少し出るよ」と教えてくれました。", "hint": "私（わたし）の夢は、イギリスに留学することです。真由（まゆ）のお兄（にい）さんは、去年（きょねん）アメリカに留学（りゅうがく）しました。真由（まゆ）は「大学（だいがく）のプログラムに申（もう）し込（こ）めば、お金（かね）も少（すこ）し出（で）るよ」と教（おし）えてくれました。", "file": "ac8429d39b77f499.mp3", "new": false}, {"sec": "故事", "text": "「兄に聞きたいことがあったら、いつでも言ってね」。真由は優しい友達です。月曜日、授業の前に事務室へ行って、家族に見せるパンフレットをもらっておきました。「がんばれば、きっと大丈夫」と思いました。", "hint": "「兄（あに）に聞（き）きたいことがあったら、いつでも言（い）ってね」。真由（まゆ）は優（やさ）しい友達（ともだち）です。月曜日（げつようび）、授業（じゅぎょう）の前（まえ）に事務室（じむしつ）へ行（い）って、家族（かぞく）に見（み）せるパンフレットをもらっておきました。「がんばれば、きっと大丈夫（だいじょうぶ）」と思（おも）いました。", "file": "8eeb1cd5c17bc32c.mp3", "new": false}, {"sec": "故事", "text": "私の姉は二十八歳で、銀行で働いています。七月のある日曜日は、姉のお見合いの日でした。", "hint": "私（わたし）の姉（あね）は二十八歳（にじゅうはっさい）で、銀行（ぎんこう）で働いています。七月（しちがつ）のある日曜日（にちようび）は、姉（あね）のお見合いの日（ひ）でした。", "file": "003bd94b6fcecf18.mp3", "new": false}, {"sec": "故事", "text": "お見合いは、両親が決めました。二人は、姉に早く結婚してほしいと思っています。", "hint": "お見合（みあ）いは、両親が決（き）めました。二人（ふたり）は、姉（あね）に早（はや）く結婚してほしいと思（おも）っています。", "file": "0714368c73512e5f.mp3", "new": false}, {"sec": "故事", "text": "朝、姉は一時間も化粧をしていました。いつもはよく笑う姉が、その日はとても大人しかったです。なんだかおかしくて、私は笑ってしまいました。", "hint": "朝（あさ）、姉（あね）は一時間（いちじかん）も化粧をしていました。いつもはよく笑（わら）う姉（あね）が、その日（ひ）はとても大人しかったです。なんだかおかしくて、私（わたし）は笑（わら）ってしまいました。", "file": "dfc992077e0c86bc.mp3", "new": false}, {"sec": "故事", "text": "夜、帰ってきた姉の話では、相手は休みの日に山に登ったり、料理をしたりする人だったそうです。", "hint": "夜（よる）、帰（かえ）ってきた姉（あね）の話（はなし）では、相手（あいて）は休（やす）みの日（ひ）に山（やま）に登（のぼ）ったり、料理（りょうり）をしたりする人（ひと）だったそうです。", "file": "2f2f1d43bcc2638c.mp3", "new": false}, {"sec": "故事", "text": "でも、姉は私に小さい声で言いました。「実はね、私、恋人がいるの。相手の人に嘘はつきたくない」。そして、「来週、彼の都合がよければ、うちに呼ぶね」と言いました。", "hint": "でも、姉（あね）は私（わたし）に小（ちい）さい声（こえ）で言（い）いました。「実（じつ）はね、私（わたし）、恋人がいるの。相手（あいて）の人（ひと）に嘘はつきたくない」。そして、「来週（らいしゅう）、彼（かれ）の都合がよければ、うちに呼（よ）ぶね」と言（い）いました。", "file": "a8a13f64ffb20155.mp3", "new": false}, {"sec": "故事", "text": "「お父さん、考えを変えてくれるかな」と、姉は少し不安そうでした。両親が許してくれるかどうか、私にもわかりません。でも、姉には幸せになってほしいと思います。", "hint": "「お父（とう）さん、考（かんが）えを変えてくれるかな」と、姉（あね）は少（すこ）し不安（ふあん）そうでした。両親（りょうしん）が許（ゆる）してくれるかどうか、私（わたし）にもわかりません。でも、姉（あね）には幸（しあわ）せになってほしいと思（おも）います。", "file": "478000868c9e844a.mp3", "new": false}, {"sec": "故事", "text": "八月、夏休みに近くの幼稚園でボランティアをしました。いつか留学したいので、その前にいろいろな経験をした
