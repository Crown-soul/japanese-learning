c": "例句", "text": "おばあちゃんから電報が届きました。", "hint": "電報＝でんぽう", "file": "d5c9cadeeb241912.mp3"}, {"sec": "例句", "text": "父は大分元気になりました。", "hint": "大分＝だいぶ", "file": "55db712275216cce.mp3"}, {"sec": "例句", "text": "少し痩せてしまいました。", "hint": "痩せる＝やせる", "file": "69b98d197092d8aa.mp3"}, {"sec": "例句", "text": "来週、退院する予定です。", "hint": "予定＝よてい", "file": "d306ba66977c9bc4.mp3"}, {"sec": "例句", "text": "次の診察も予約しました。", "hint": "予約する＝よやくする", "file": "74e1746a99cab5f5.mp3"}, {"sec": "例句", "text": "家に戻ることができました。", "hint": "戻る＝もどる", "file": "f7e03482de532879.mp3"}, {"sec": "例句", "text": "息子の私は、本当に安心しました。", "hint": "息子＝むすこ", "file": "e03ddd62023a149b.mp3"}, {"sec": "例句", "text": "新しい町に引っ越しました。", "hint": "引っ越す＝ひっこす", "file": "0b773e95b7fb6c8a.mp3"}, {"sec": "例句", "text": "学生時代に同じ学校にいたことが分かりました。", "hint": "時代＝じだい", "file": "44d076bbba263f6a.mp3"}, {"sec": "例句", "text": "天気予報では雨と言っていました。", "hint": "天気予報＝てんきよほう", "file": "d264f35c7045885d.mp3"}, {"sec": "例句", "text": "新しい部屋の引き出しを開くと…。", "hint": "引き出し＝ひきだし", "file": "a6048534c54f149a.mp3"}, {"sec": "例句", "text": "引き出しを開くと、指輪が入っていました。", "hint": "開く＝ひらく", "file": "ee8cc215545f22c9.mp3"}, {"sec": "例句", "text": "引き出しはとても深かったです。", "hint": "深い＝ふかい", "file": "81ecf2bb1ff45e11.mp3"}, {"sec": "例句", "text": "奥に指輪が入っていました。", "hint": "指輪＝ゆびわ", "file": "fe2e9886a378fd21.mp3"}, {"sec": "例句", "text": "隣の人と知り合いました。", "hint": "知り合う＝しりあう", "file": "f7b9f24fc7b25834.mp3"}, {"sec": "例句", "text": "高校の先生に似ている気がしました。", "hint": "似る＝にる", "file": "0876af8093a59417.mp3"}, {"sec": "例句", "text": "すると、聞いてみたら本当に同じ学校でした。", "hint": "すると＝すると", "file": "02c9f0530e6905fd.mp3"}, {"sec": "例句", "text": "近くの売店で食料品を買いました。", "hint": "売店＝ばいてん", "file": "80d8e16432f7a924.mp3"}, {"sec": "例句", "text": "売店で食料品を買いました。", "hint": "食料品＝しょくりょうひん", "file": "40d986ea4aa39800.mp3"}, {"sec": "例句", "text": "店員さんはとても親切でした。", "hint": "店員＝てんいん", "file": "e956814c5d66b309.mp3"}, {"sec": "例句", "text": "新しい布団で早く寝ました。", "hint": "布団＝ふとん", "file": "a9d6706d8275c4ba.mp3"}, {"sec": "例句", "text": "新しいまくらで寝ました。", "hint": "まくら＝まくら", "file": "72eedcad142b07e7.mp3"}, {"sec": "例句", "text": "近所を散歩してみました。", "hint": "散歩する＝さんぽ", "file": "8b094ba835738e54.mp3"}, {"sec": "例句", "text": "珍しいカフェを見つけました。", "hint": "珍しい＝めずらしい", "file": "9357df84714acf2a.mp3"}, {"sec": "例句", "text": "店の中を回ってみました。", "hint": "回る＝まわる", "file": "a756831b74b060b1.mp3"}, {"sec": "例句", "text": "柔らかすぎるパンを売っていました。", "hint": "柔らかい＝やわらかい", "file": "026062a9e3783059.mp3"}, {"sec": "例句", "text": "ケーキを一つ注文しました。", "hint": "注文する＝ちゅうもんする", "file": "c4e5d681f04e6c8b.mp3"}, {"sec": "例句", "text": "半分に切ってもらいました。", "hint": "半分＝はんぶん", "file": "0738014ac57df9c8.mp3"}, {"sec": "例句", "text": "道の太い木の下にコインがありました。", "hint": "太い＝ふとい", "file": "5edf2072adf3b2cd.mp3"}, {"sec": "例句", "text": "小さいコインを拾いました。", "hint": "拾う＝ひろう", "file": "d06c333f00f0bc29.mp3"}, {"sec": "例句", "text": "猫は少し太ってしまったみたいです。", "hint": "太る＝ふとる", "file": "4c7e31e9bb6e7b4c.mp3"}, {"sec": "例句", "text": "水着を買いに行くことにしました。", "hint": "水着＝みずぎ", "file": "3ea28349f9cef184.mp3"}, {"sec": "例句", "text": "私に向いている色を選んでくれました。", "hint": "向く＝むく", "file": "572187fae92e15fc.mp3"}, {"sec": "例句", "text": "値段が普通の倍になっていました。", "hint": "倍＝ばい", "file": "a8f7bc1be922d717.mp3"}, {"sec": "例句", "text": "普通の道を歩いていました。", "hint": "普通＝ふつう", "file": "ef741dfcf99ff979.mp3"}, {"sec": "例句", "text": "床が少し汚れていました。", "hint": "汚れる＝よごれる", "file": "059468183dedfaf0.mp3"}, {"sec": "例句", "text": "引っ越しの時に床を汚してしまいました。", "hint": "汚す＝よごす", "file": "40fe7ffb4b2a9384.mp3"}, {"sec": "例句", "text": "りんごの皮を剥いて食べました。", "hint": "剥く＝むく", "file": "9c603c826416906e.mp3"}, {"sec": "例句", "text": "プレゼントを丁寧に包みました。", "hint": "包む＝つつむ", "file": "f5918fc536beebe5.mp3"}, {"sec": "例句", "text": "別の箱に入れました。", "hint": "別＝べつ", "file": "8ca66c204c975934.mp3"}, {"sec": "例句", "text": "指でリボンを結びました。", "hint": "指＝ゆび", "file": "5ea098d63e2df4c4.mp3"}, {"sec": "例句", "text": "引っ越す日は朝から忙しかったです。", "hint": "日＝ひ", "file": "a24001a60c949f8b.mp3"}, {"sec": "故事", "text": "先週の日曜日、家で父が急に倒れてしまいました。父の様子がおかしかったので、私はすぐに救急車を呼びました。父は自分の部屋の隅で倒れていました。", "hint": "先週（せんしゅう）の日曜日（にちようび）、家（いえ）で父（ちち）が急（きゅう）に倒れて（たおれて）しまいました。父（ちち）の様子（ようす）がおかしかったので、私（わたし）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びました。父（ちち）は自分（じぶん）の部屋（へや）の隅（すみ）で倒（たお）れていました。", "file": "847a4b020b7deeae.mp3"}, {"sec": "故事", "text": "病院に着くと、医者さんがすぐに検査をしてくれました。「なるほど、少し前から頭が痛かったんですね」と医者さんは言いました。父は我慢していたそうです。今日は注射をしなければならないと言われて、そのまましばらく入院することになりました。", "hint": "病院（びょういん）に着（つ）くと、医者（いしゃ）さんがすぐに検査（けんさ）をしてくれました。「なるほど、少（すこ）し前（まえ）から頭（あたま）が痛（いた）かったんですね」と医者（いしゃ）さんは言（い）いました。父（ちち）は我慢（がまん）していたそうです。今日（きょう）は注射（ちゅうしゃ）をしなければならないと言（い）われて、そのまましばらく入院（にゅういん）することになりました。", "file": "4407166e8e534fb4.mp3"}, {"sec": "故事", "text": "特別な部屋は空いていなかったので、父は普通の部屋に入ることになりました。私は一度家に戻って、入院の支度をしました。着替えや歯ブラシを用意して、家族は消化にいいお粥を炊いて持っていきました。", "hint": "特別（とくべつ）な部屋（へや）は空（あ）いていなかったので、父（ちち）は普通（ふつう）の部屋（へや）に入（はい）ることになりました。私（わたし）は一度（いちど）家（いえ）に戻（もど）って、入院（にゅういん）の支度（したく）をしました。着替（きが）えや歯（は）ブラシを用意（ようい）して、家族（かぞく）は消化（しょうか）にいいお粥（かゆ）を炊いて（たいて）持（も）っていきました。", "file": "5162a95d01613a97.mp3"}, {"sec": "故事", "text": "その夜、病室の電灯がつくと、父の顔色は少し良くなっているように見えました。看護師さんが「何を召し上がりますか」と優しく聞いてくれて、父は温いスープを一口飲みました。「これはちょっとぬるいね」と父は笑いました。看護師さんはベッドのシーツも取り替えてくれました。", "hint": "その夜（よる）、病室（びょうしつ）の電灯（でんとう）がつくと、父（ちち）の顔色（かおいろ）は少（すこ）し良（よ）くなっているように見（み）えました。看護師（かんごし）さんが「何（なに）を召し上がり（めしあがり）ますか」と優（やさ）しく聞（き）いてくれて、父（ちち）は温い（ぬるい）スープを一口（ひとくち）飲（の）みました。「これはちょっとぬるいね」と父（ちち）は笑（わら）いました。看護師（かんごし）さんはベッドのシーツも取り替えて（とりかえて）くれました。", "file": "e7a4fbbeab961bf4.mp3"}, {"sec": "故事", "text": "翌日、私はお見舞いに行きました。花屋で花を買って、病院の瓶に入れてあげました。それから、小さい人形も一つ持っていくと、父は子供みたいに喜んでくれました。看護師さんが部屋の床を掃いている間、私は読み終わった本を棚に戻しておきました。", "hint": "翌日（よくじつ）、私（わたし）はお見舞い（おみまい）に行（い）きました。花屋（はなや）で花（はな）を買（か）って、病院（びょういん）の瓶（びん）に入（い）れてあげました。それから、小（ちい）さい人形（にんぎょう）も一（ひと）つ持（も）っていくと、父（ちち）は子供（こども）みたいに喜（よろこ）んでくれました。看護師（かんごし）さんが部屋（へや）の床（ゆか）を掃いて（はいて）いる間（あいだ）、私（わたし）は読（よ）み終（お）わった本（ほん）を棚（たな）に戻して（もどして）おきました。", "file": "c5235bed43c5f84b.mp3"}, {"sec": "故事", "text": "薬はとても苦くて、父はいつも顔をしかめていました。傷に薬を塗ってもらってから、痛みは少しずつなくなっていきました。ただ、疲れは少し残っているようで、医者さんに「お酒は当分止めるように」と言われ、なるべく休んだ方がいいとも言われました。", "hint": "薬（くすり）はとても苦くて（にがくて）、父（ちち）はいつも顔（かお）をしかめていました。傷（きず）に薬（くすり）を塗って（ぬって）もらってから、痛（いた）みは少（すこ）しずつなくなっていきました。ただ、疲（つか）れは少（すこ）し残って（のこって）いるようで、医者（いしゃ）さんに「お酒（さけ）は当分（とうぶん）止める（やめる）ように」と言（い）われ、なるべく休（やす）んだ方（ほう）がいいとも言（い）われました。", "file": "3a4552e7ee41f60a.mp3"}, {"sec": "故事", "text": "入院している間、田舎のおばあちゃんから電報が届きました。「早く元気になりますように」と書いてありました。", "hint": "入院（にゅういん）している間（あいだ）、田舎（いなか）のおばあちゃんから電報（でんぽう）が届（とど）きました。「早（はや）く元気（げんき）になりますように」と書（か）いてありました。", "file": "3364ac3dfea608ab.mp3"}, {"sec": "故事", "text": "一週間後、父は大分元気になりました。少し痩せてしまいましたが、医者さんに「来週、退院する予定です」と言われました。次の診察も予約して、父はやっと家に戻ることができました。息子の私は、父が元気になった様子を見て、本当に安心しました。", "hint": "一週間後（いっしゅうかんご）、父（ちち）は大分（だいぶ）元気（げんき）になりました。少（すこ）し痩せて（やせて）しまいましたが、医者（いしゃ）さんに「来週（らいしゅう）、退院（たいいん）する予定（よてい）です」と言（い）われました。次（つぎ）の診察（しんさつ）も予約（よやく）して、父（ちち）はやっと家（いえ）に戻る（もどる）ことができました。息子（むすこ）の私（わたし）は、父（ちち）が元気（げんき）になった様子（ようす）を見（み）て、本当（ほんとう）に安心（あんしん）しました。", "file": "4dc46046baf3af09.mp3"}, {"sec": "故事", "text": "先月、私は新しい町に引っ越しました。引っ越す日は朝から忙しくて、天気予報では雨と言っていましたが、幸い晴れていました。", "hint": "先月（せんげつ）、私（わたし）は新（あたら）しい町（まち）に引っ越し（ひっこし）ました。引っ越す（ひっこす）日（ひ）は朝（あさ）から忙（いそが）しくて、天気予報（てんきよほう）では雨（あめ）と言（い）っていましたが、幸（さいわ）い晴（は）れていました。", "file": "d3d321acea93a8e5.mp3"}, {"sec": "故事", "text": "新しい部屋の引き出しを開くと、とても深くて、奥に前の人に忘れられた指輪が入っていました。", "hint": "新（あたら）しい部屋（へや）の引き出し（ひきだし）を開く（ひらく）と、とても深くて（ふかくて）、奥（おく）に前（まえ）の人（ひと）に忘（わす）れられた指輪（ゆびわ）が入（はい）っていました。", "file": "c57638b2ef409499.mp3"}, {"sec": "故事", "text": "荷物を運んでいる時、隣の人と知り合いました。その人は昔、私の高校の先生に似ている気がしました。すると、聞いてみたら本当に学生時代に同じ学校にいたことが分かりました。", "hint": "荷物（にもつ）を運（はこ）んでいる時（とき）、隣（となり）の人（ひと）と知り合いました（しりあいました）。その人（ひと）は昔（むかし）、私（わたし）の高校（こうこう）の先生（せんせい）に似て（にて）いる気（き）がしました。すると、聞（き）いてみたら本当（ほんとう）に学生時代（じだい）に同（おな）じ学校（がっこう）にいたことが分（わ）かりました。", "file": "b5b8d72dc75676cb.mp3"}, {"sec": "故事", "text": "荷物を片付けながら、近くの売店で食料品を買いました。店員さんはとても親切でした。夜は疲れたので、新しい布団とまくらで早く寝ました。", "hint": "荷物（にもつ）を片付（かたづ）けながら、近（ちか）くの売店（ばいてん）で食料品（しょくりょうひん）を買（か）いました。店員（てんいん）さんはとても親切（しんせつ）でした。夜（よる）は疲（つか）れたので、新（あたら）しい布団（ふとん）とまくらで早（はや）く寝（ね）ました。", "file": "79f1725a74c7465e.mp3"}, {"sec": "故事", "text": "次の日、近所を散歩してみました。普通の道を歩いていたら、珍しいカフェを見つけました。店の中を回ってみると、大きくて柔らかすぎるパンを売っていました。私はケーキを一つ注文して、店員さんに半分に切ってもらいました。", "hint": "次（つぎ）の日（ひ）、近所（きんじょ）を散歩（さんぽ）してみました。普通（ふつう）の道（みち）を歩（ある）いていたら、珍しい（めずらしい）カフェを見（み）つけました。店（みせ）の中（なか）を回って（まわって）みると、大（おお）きくて柔らかすぎる（やわらかすぎる）パンを売（う）っていました。私（わたし）はケーキを一（ひと）つ注文（ちゅうもん）して、店員（てんいん）さんに半分（はんぶん）に切（き）ってもらいました。", "file": "96f956a4da903018.mp3"}, {"sec": "故事", "text": "そこで、道の太い木の下に小さいコインが落ちているのを拾いました。隣の家の猫は少し太ってしまったみたいでした。", "hint": "そこで、道（みち）の太い（ふとい）木（き）の下（した）に小（ちい）さいコインが落（お）ちているのを拾いました（ひろいました）。隣（となり）の家（いえ）の猫（ねこ）は少（すこ）し太って（ふとって）しまったみたいでした。", "file": "b0ff808caf1958ce.mp3"}, {"sec": "故事", "text": "夏が近づいてきたので、水着を買いに行くことにしました。店員さんは私に向いている色を選んでくれました。会計の時、値段が普通の倍になっていることに店員さんが気づきました。", "hint": "夏（なつ）が近（ちか）づいてきたので、水着（みずぎ）を買（か）いに行（い）くことにしました。店員（てんいん）さんは私（わたし）に向いて（むいて）いる色（いろ）を選（えら）んでくれました。会計（かいけい）の時（とき）、値段（ねだん）が普通（ふつう）の倍（ばい）になっていることに店員（てんいん）さんが気（き）づきました。", "file": "d489fc03b842cd7f.mp3"}, {"sec": "故事", "text": "家に帰ると、床が少し汚れていました。引っ越しの時に汚してしまったようです。拭きながら、りんごの皮を剥いて食べました。", "hint": "家（いえ）に帰（かえ）ると、床（ゆか）が少（すこ）し汚れて（よごれて）いました。引（ひ）っ越（こ）しの時（とき）に汚して（よごして）しまったようです。拭（ふ）きながら、りんごの皮（かわ）を剥いて（むいて）食（た）べました。", "file": "6f5161823d311701.mp3"}, {"sec": "故事", "text": "最後に、遠くに住んでいる友達へ贈り物を送ることにしました。プレゼントを丁寧に包んで、別の箱に入れました。指でリボンを結びました。", "hint": "最後（さいご）に、遠（とお）くに住（す）んでいる友達（ともだち）へ贈（おく）り物（もの）を送（おく）ることにしました。プレゼントを丁寧（ていねい）に包んで（つつんで）、別（べつ）の箱（はこ）に入（い）れました。指（ゆび）でリボンを結（むす）びました。", "file": "9a82add95c21bbab.mp3"}];
const KEY = "audiocheck-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
let filter = "all";
let audio = new Audio();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function play(f){ audio.pause(); audio = new Audio("audio/"+f); audio.play(); }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let ok=0,ng=0;
  ITEMS.forEach((it,i)=>{
    const st = state[it.file];
    if(st==="ok") ok++; if(st==="ng") ng++;
    if(filter==="todo" && st) return;
    if(filter==="ng" && st!=="ng") return;
    const row = document.createElement("div");
    row.className = "row" + (st==="ok"?" done-ok":st==="ng"?" done-ng":"");
    row.innerHTML =
      '<span class="sec">'+it.sec+'</span>'+
      '<div class="grow"><div class="jp" lang="ja">'+esc(it.text)+'</div>'+
      '<div class="hint">應讀：'+esc(it.hint)+'</div></div>'+
      '<div class="acts">'+
      '<button data-p="'+i+'">▶</button>'+
      '<button data-ok="'+i+'" class="'+(st==="ok"?"on-ok":"")+'">✓</button>'+
      '<button data-ng="'+i+'" class="'+(st==="ng"?"on-ng":"")+'">✗</button>'+
      '</div>';
    list.appendChild(row);
  });
  document.getElementById("prog").textContent =
    "　已檢查 "+(ok+ng)+" / "+ITEMS.length+"（讀錯 "+ng+"）";
  const bad = ITEMS.filter(it=>state[it.file]==="ng");
  document.getElementById("out").value = bad.length
    ? bad.map(it=> it.sec==="單字"
        ? '"'+it.text+'": "'+it.hint+'",'
        : '// '+it.sec+'：'+it.text+'（應讀 '+it.hint+'）\n"": "",'
      ).join("\n")
    : "（目前沒有標記讀錯的）";
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

document.getElementById("list").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.p!=null) play(ITEMS[b.dataset.p].file);
  if(b.dataset.ok!=null){ const f=ITEMS[b.dataset.ok].file; state[f]=state[f]==="ok"?undefined:"ok"; save(); render(); }
  if(b.dataset.ng!=null){ const f=ITEMS[b.dataset.ng].file; state[f]=state[f]==="ng"?undefined:"ng"; save(); render(); }
});
document.querySelector(".bar").addEventListener("click",e=>{
  if(e.target.dataset.f){ filter=e.target.dataset.f; render(); }
  if(e.target.id==="reset" && confirm("清除所有檢查進度？")){ state={}; save(); render(); }
});
render();
</script>
</html>
