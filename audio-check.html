67bf.mp3"}, {"sec": "例句", "text": "これはちょっとぬるいね。", "hint": "温い＝ぬるい", "file": "5717005b82daf2f2.mp3"}, {"sec": "例句", "text": "シーツを取り替えてくれました。", "hint": "取り替える＝とりかえる", "file": "1401325b4afbebfb.mp3"}, {"sec": "例句", "text": "翌日、お見舞いに行きました。", "hint": "お見舞い＝おみまい", "file": "051b90dc47410aae.mp3"}, {"sec": "例句", "text": "花屋で花を買いました。", "hint": "花＝はな", "file": "b7a41554cd93ad7f.mp3"}, {"sec": "例句", "text": "病院の瓶に入れてあげました。", "hint": "瓶＝びん", "file": "651299a78aff5a8c.mp3"}, {"sec": "例句", "text": "小さい人形も持っていきました。", "hint": "人形＝にんぎょう", "file": "bb59c31be476d594.mp3"}, {"sec": "例句", "text": "看護師さんが床を掃いていました。", "hint": "掃く＝はく", "file": "42d01b3f8daf840d.mp3"}, {"sec": "例句", "text": "本を棚に戻しておきました。", "hint": "戻す＝もどす", "file": "d7b3e3c526c804ae.mp3"}, {"sec": "例句", "text": "薬はとても苦かったです。", "hint": "苦い＝にがい", "file": "f4bec9447bf063bf.mp3"}, {"sec": "例句", "text": "傷に薬を塗ってもらいました。", "hint": "塗る＝ぬる", "file": "d0307c91c93b6cf9.mp3"}, {"sec": "例句", "text": "痛みは少しずつなくなっていきました。", "hint": "なくなる＝なくなる", "file": "f7817e265bbf1753.mp3"}, {"sec": "例句", "text": "疲れは少し残っているようです。", "hint": "残る＝のこる", "file": "7048825c12b30e37.mp3"}, {"sec": "例句", "text": "お酒は当分止めるように言われました。", "hint": "止める＝やめる", "file": "b16600d7a2fd8648.mp3"}, {"sec": "例句", "text": "なるべく休んだ方がいいです。", "hint": "なるべく＝なるべく", "file": "8a2303b7628609c7.mp3"}, {"sec": "例句", "text": "なるほど、少し前から痛かったんですね。", "hint": "なるほど＝なるほど", "file": "434d5c1cb084b23d.mp3"}, {"sec": "例句", "text": "おばあちゃんから電報が届きました。", "hint": "電報＝でんぽう", "file": "d5c9cadeeb241912.mp3"}, {"sec": "例句", "text": "父は大分元気になりました。", "hint": "大分＝だいぶ", "file": "55db712275216cce.mp3"}, {"sec": "例句", "text": "少し痩せてしまいました。", "hint": "痩せる＝やせる", "file": "69b98d197092d8aa.mp3"}, {"sec": "例句", "text": "来週、退院する予定です。", "hint": "予定＝よてい", "file": "d306ba66977c9bc4.mp3"}, {"sec": "例句", "text": "次の診察も予約しました。", "hint": "予約する＝よやくする", "file": "74e1746a99cab5f5.mp3"}, {"sec": "例句", "text": "家に戻ることができました。", "hint": "戻る＝もどる", "file": "f7e03482de532879.mp3"}, {"sec": "例句", "text": "息子の私は、本当に安心しました。", "hint": "息子＝むすこ", "file": "e03ddd62023a149b.mp3"}, {"sec": "例句", "text": "新しい町に引っ越しました。", "hint": "引っ越す＝ひっこす", "file": "0b773e95b7fb6c8a.mp3"}, {"sec": "例句", "text": "学生時代に同じ学校にいたことが分かりました。", "hint": "時代＝じだい", "file": "44d076bbba263f6a.mp3"}, {"sec": "例句", "text": "天気予報では雨と言っていました。", "hint": "天気予報＝てんきよほう", "file": "d264f35c7045885d.mp3"}, {"sec": "例句", "text": "新しい部屋の引き出しを開くと…。", "hint": "引き出し＝ひきだし", "file": "a6048534c54f149a.mp3"}, {"sec": "例句", "text": "引き出しを開くと、指輪が入っていました。", "hint": "開く＝ひらく", "file": "ee8cc215545f22c9.mp3"}, {"sec": "例句", "text": "引き出しはとても深かったです。", "hint": "深い＝ふかい", "file": "81ecf2bb1ff45e11.mp3"}, {"sec": "例句", "text": "奥に指輪が入っていました。", "hint": "指輪＝ゆびわ", "file": "fe2e9886a378fd21.mp3"}, {"sec": "例句", "text": "隣の人と知り合いました。", "hint": "知り合う＝しりあう", "file": "f7b9f24fc7b25834.mp3"}, {"sec": "例句", "text": "高校の先生に似ている気がしました。", "hint": "似る＝にる", "file": "0876af8093a59417.mp3"}, {"sec": "例句", "text": "すると、聞いてみたら本当に同じ学校でした。", "hint": "すると＝すると", "file": "02c9f0530e6905fd.mp3"}, {"sec": "例句", "text": "近くの売店で食料品を買いました。", "hint": "売店＝ばいてん", "file": "80d8e16432f7a924.mp3"}, {"sec": "例句", "text": "売店で食料品を買いました。", "hint": "食料品＝しょくりょうひん", "file": "40d986ea4aa39800.mp3"}, {"sec": "例句", "text": "店員さんはとても親切でした。", "hint": "店員＝てんいん", "file": "e956814c5d66b309.mp3"}, {"sec": "例句", "text": "新しい布団で早く寝ました。", "hint": "布団＝ふとん", "file": "a9d6706d8275c4ba.mp3"}, {"sec": "例句", "text": "新しいまくらで寝ました。", "hint": "まくら＝まくら", "file": "72eedcad142b07e7.mp3"}, {"sec": "例句", "text": "近所を散歩してみました。", "hint": "散歩する＝さんぽする", "file": "8b094ba835738e54.mp3"}, {"sec": "例句", "text": "珍しいカフェを見つけました。", "hint": "珍しい＝めずらしい", "file": "9357df84714acf2a.mp3"}, {"sec": "例句", "text": "店の中を回ってみました。", "hint": "回る＝まわる", "file": "a756831b74b060b1.mp3"}, {"sec": "例句", "text": "柔らかすぎるパンを売っていました。", "hint": "柔らかい＝やわらかい", "file": "026062a9e3783059.mp3"}, {"sec": "例句", "text": "ケーキを一つ注文しました。", "hint": "注文する＝ちゅうもんする", "file": "c4e5d681f04e6c8b.mp3"}, {"sec": "例句", "text": "半分に切ってもらいました。", "hint": "半分＝はんぶん", "file": "0738014ac57df9c8.mp3"}, {"sec": "例句", "text": "道の太い木の下にコインがありました。", "hint": "太い＝ふとい", "file": "5edf2072adf3b2cd.mp3"}, {"sec": "例句", "text": "小さいコインを拾いました。", "hint": "拾う＝ひろう", "file": "d06c333f00f0bc29.mp3"}, {"sec": "例句", "text": "猫は少し太ってしまったみたいです。", "hint": "太る＝ふとる", "file": "4c7e31e9bb6e7b4c.mp3"}, {"sec": "例句", "text": "水着を買いに行くことにしました。", "hint": "水着＝みずぎ", "file": "3ea28349f9cef184.mp3"}, {"sec": "例句", "text": "私に向いている色を選んでくれました。", "hint": "向く＝むく", "file": "572187fae92e15fc.mp3"}, {"sec": "例句", "text": "値段が普通の倍になっていました。", "hint": "倍＝ばい", "file": "a8f7bc1be922d717.mp3"}, {"sec": "例句", "text": "普通の道を歩いていました。", "hint": "普通＝ふつう", "file": "ef741dfcf99ff979.mp3"}, {"sec": "例句", "text": "床が少し汚れていました。", "hint": "汚れる＝よごれる", "file": "059468183dedfaf0.mp3"}, {"sec": "例句", "text": "引っ越しの時に床を汚してしまいました。", "hint": "汚す＝よごす", "file": "40fe7ffb4b2a9384.mp3"}, {"sec": "例句", "text": "りんごの皮を剥いて食べました。", "hint": "剥く＝むく", "file": "9c603c826416906e.mp3"}, {"sec": "例句", "text": "プレゼントを丁寧に包みました。", "hint": "包む＝つつむ", "file": "f5918fc536beebe5.mp3"}, {"sec": "例句", "text": "別の箱に入れました。", "hint": "別＝べつ", "file": "8ca66c204c975934.mp3"}, {"sec": "例句", "text": "指でリボンを結びました。", "hint": "指＝ゆび", "file": "5ea098d63e2df4c4.mp3"}, {"sec": "例句", "text": "引っ越す日は朝から忙しかったです。", "hint": "日＝ひ", "file": "a24001a60c949f8b.mp3"}, {"sec": "例句", "text": "眠りが浅くて、何度も目が覚めました。", "hint": "浅い＝あさい", "file": "460399a2bce34e9a.mp3"}, {"sec": "例句", "text": "引っ越しの日は本当に暑かったです。", "hint": "暑い＝あつい", "file": "dd9d3070a651eb00.mp3"}, {"sec": "例句", "text": "この部屋は壁が粗いです。", "hint": "粗い＝あらい", "file": "b44ade6829156241.mp3"}, {"sec": "例句", "text": "玄関の暗号を手帳にメモしておきました。", "hint": "暗号＝あんごう", "file": "afcc30d19624f9df.mp3"}, {"sec": "例句", "text": "いくら安くても、栄養がなければ体に悪いです。", "hint": "いくら＝いくら", "file": "0d15ff0337de5ccd.mp3"}, {"sec": "例句", "text": "大家さんに野菜の炒め方を教えてもらいました。", "hint": "炒める＝いためる", "file": "8e0da6c7816a56e3.mp3"}, {"sec": "例句", "text": "一般に危ないと言われる場所は避けています。", "hint": "一般＝いっぱん", "file": "a57c7917cab79cc0.mp3"}, {"sec": "例句", "text": "取れたボタンを糸と針で直しました。", "hint": "糸＝いと", "file": "199e6171e873f803.mp3"}, {"sec": "例句", "text": "カレンダーを掛けるために、壁に釘を打ちました。", "hint": "打つ＝うつ", "file": "2675289db7aed53b.mp3"}, {"sec": "例句", "text": "二人で記念の写真を写しました。", "hint": "写す＝うつす", "file": "900c5decf4ed6099.mp3"}, {"sec": "例句", "text": "この気持ちは永遠に消えません。", "hint": "永遠＝えいえん", "file": "180178dabf695c01.mp3"}, {"sec": "例句", "text": "弁当ばかりでは栄養が足りません。", "hint": "栄養＝えいよう", "file": "5d0f4eea8e344ec1.mp3"}, {"sec": "例句", "text": "二日おきに猫に餌をやっています。", "hint": "餌＝えさ", "file": "bec866e76aa2e9bd.mp3"}, {"sec": "例句", "text": "大家さんのおかげで食事がよくなりました。", "hint": "おかげ＝おかげ", "file": "2b66cab16138cd25.mp3"}, {"sec": "例句", "text": "この薬は一日おきに飲んでください。", "hint": "おき＝おき", "file": "58597837bd7aece4.mp3"}, {"sec": "例句", "text": "大家さんは怒らないで、優しく言ってくれました。", "hint": "怒る＝おこる", "file": "faf3ae504d69fc4f.mp3"}, {"sec": "例句", "text": "大家さんのお宅で料理をご馳走しました。", "hint": "お宅＝おたく", "file": "4d0f41576a13829a.mp3"}, {"sec": "例句", "text": "「合格、おめでとうございます」と言われました。", "hint": "おめでとうございます＝おめでとうございます", "file": "33570c2352f73e8d.mp3"}, {"sec": "例句", "text": "汗でひどい格好になってしまいました。", "hint": "格好＝かっこう", "file": "68a51e194b6bd760.mp3"}, {"sec": "例句", "text": "その話を聞いて少し悲しかったです。", "hint": "悲しい＝かなしい", "file": "56f295fbe5523f02.mp3"}, {"sec": "例句", "text": "包丁を使うときは気をつけてください。", "hint": "気＝き", "file": "f6896ee8f000205b.mp3"}, {"sec": "例句", "text": "帰りに記念の写真を写しました。", "hint": "記念＝きねん", "file": "ea5b214b392cd280.mp3"}, {"sec": "例句", "text": "窓が大きくて気分のいい部屋です。", "hint": "気分＝きぶん", "file": "08e31b0135c1800c.mp3"}, {"sec": "例句", "text": "別れても、気持ちは消えません。", "hint": "気持ち＝きもち", "file": "f187277251d54b37.mp3"}, {"sec": "例句", "text": "学生の部屋探しは競争が激しいです。", "hint": "競争＝きょうそう", "file": "fcf36938447d8a13.mp3"}, {"sec": "例句", "text": "料理に興味が出てきました。", "hint": "興味＝きょうみ", "file": "5b557d42a37f4e2d.mp3"}, {"sec": "例句", "text": "壁は粗いです。けれども、気分のいい部屋です。", "hint": "けれども＝けれども", "file": "14d3334ce08190f8.mp3"}, {"sec": "例句", "text": "大家さんは好意で野菜を分けてくれます。", "hint": "好意＝こうい", "file": "5b35d15719a6e5ec.mp3"}, {"sec": "例句", "text": "お礼に大家さんに手料理をご馳走しました。", "hint": "ご馳走する＝ごちそうする", "file": "ef37f1eddf7a6dfe.mp3"}, {"sec": "例句", "text": "この部屋が借りられて、運がよかったです。", "hint": "この＝この", "file": "1a1725ddab404b97.mp3"}, {"sec": "例句", "text": "揺れがあまりに怖くて、体が動きませんでした。", "hint": "怖い＝こわい", "file": "d0ace4e9a116a635.mp3"}, {"sec": "例句", "text": "壁にカレンダーを掛けます。", "hint": "掛ける＝かける", "file": "7ab52d327fd9f2f1.mp3"}, {"sec": "例句", "text": "駅の角を曲がって、まっすぐ行きます。", "hint": "角＝かど", "file": "e03c64bc3d6b1925.mp3"}, {"sec": "例句", "text": "夕飯はコンビニの弁当か缶詰でした。", "hint": "缶詰＝かんづめ", "file": "b9b33f8afa830b8f.mp3"}, {"sec": "例句", "text": "地震で電気が消えてしまいました。", "hint": "消える＝きえる", "file": "78cdfd896d759620.mp3"}, {"sec": "例句", "text": "近所にはスーパーも図書館もあります。", "hint": "近所＝きんじょ", "file": "480eb33c42aa06b0.mp3"}, {"sec": "例句", "text": "この町で一人で下宿することにしました。", "hint": "下宿する＝げしゅくする", "file": "18b6708925a74f2a.mp3"}, {"sec": "例句", "text": "この頃は卒業のことばかり考えています。", "hint": "この頃＝このごろ", "file": "0e2f50e2b98ba93c.mp3"}, {"sec": "例句", "text": "さっき駅で先生に会いました。", "hint": "さっき＝さっき", "file": "17acb80deb5fc66f.mp3"}, {"sec": "例句", "text": "その言葉で幸せな気持ちになりました。", "hint": "幸せ＝しあわせ", "file": "f84e5ae8dc4c0e4e.mp3"}, {"sec": "例句", "text": "この一年しっかり勉強しました。", "hint": "しっかり＝しっかり", "file": "71b2627df547ffae.mp3"}, {"sec": "例句", "text": "母は電話でずいぶん心配していました。", "hint": "心配する＝しんぱいする", "file": "7ceac6d476a61d84.mp3"}, {"sec": "例句", "text": "忘れないように、すぐメモしておきました。", "hint": "すぐ＝すぐ", "file": "97f1db9349c1a91c.mp3"}, {"sec": "例句", "text": "要らない物を捨てて、荷物が少なくなりました。", "hint": "捨てる＝すてる", "file": "fee7d692fcac6fc8.mp3"}, {"sec": "例句", "text": "それで、この町での生活が始まりました。", "hint": "それで＝それで", "file": "651d56bd86dbc5ed.mp3"}, {"sec": "例句", "text": "料理は楽しいです。それに、体にもいいです。", "hint": "それに＝それに", "file": "33cb65b4b0301f22.mp3"}, {"sec": "例句", "text": "新しい生活も楽しみです。", "hint": "楽しみ＝たのしみ", "file": "ada61ae6e8f0ec25.mp3"}, {"sec": "例句", "text": "作ることを楽しむようになりました。", "hint": "楽しむ＝たのしむ", "file": "5c0efdbb2efdf9a2.mp3"}, {"sec": "例句", "text": "静かな道を通って五分で着きます。", "hint": "通る＝とおる", "file": "0034f618ce9d8ec9.mp3"}, {"sec": "例句", "text": "眠たくて目を閉じたのに、眠れませんでした。", "hint": "眠たい＝ねむたい", "file": "0a088b8eb61b1b98.mp3"}, {"sec": "例句", "text": "大家さんと田舎の墓参りに行きました。", "hint": "墓＝はか", "file": "61956a34311a7117.mp3"}, {"sec": "例句", "text": "指を切ってしまい、恥ずかしかったです。", "hint": "恥ずかしい＝はずかしい", "file": "48c4696ab3d73134.mp3"}, {"sec": "例句", "text": "東京の会社で働くことになりました。", "hint": "働く＝はたらく", "file": "c281d8050b465866.mp3"}, {"sec": "例句", "text": "久しぶりに友達に会いました。", "hint": "久しぶり＝ひさしぶり", "file": "2f2cbfefd2061796.mp3"}, {"sec": "例句", "text": "大家さんは朗らかな人です。", "hint": "朗らか＝ほがらか", "file": "71fa2424f21441af.mp3"}, {"sec": "例句", "text": "はじめは真似をするだけでした。", "hint": "真似＝まね", "file": "263bb608cb77f827.mp3"}, {"sec": "例句", "text": "窓を開けたまま寝てしまいました。", "hint": "まま＝まま", "file": "35d44304c1efda14.mp3"}, {"sec": "例句", "text": "自分で作った物を食べると満足できます。", "hint": "満足＝まんぞく", "file": "f778de333182af60.mp3"}, {"sec": "例句", "text": "自分でも矛盾していると思います。", "hint": "矛盾＝むじゅん", "file": "7d2f35e09969515a.mp3"}, {"sec": "例句", "text": "隣の人が迷惑していたらしいです。", "hint": "迷惑する＝めいわくする", "file": "c7dc8994c3c4998e.mp3"}, {"sec": "例句", "text": "大家さんは優しく言ってくれました。", "hint": "優しい＝やさしい", "file": "c9eb08009edffe0a.mp3"}, {"sec": "例句", "text": "二人で食べる夕飯はおいしいです。", "hint": "夕飯＝ゆうはん", "file": "f519c5b34ab6faa8.mp3"}, {"sec": "例句", "text": "二人の夕飯は愉快な時間です。", "hint": "愉快＝ゆかい", "file": "6921c9219530ca28.mp3"}, {"sec": "例句", "text": "部屋の鍵が少し緩くて心配です。", "hint": "緩い＝ゆるい", "file": "821d11c936f551b2.mp3"}, {"sec": "例句", "text": "夜、部屋が急に大きく揺れました。", "hint": "揺れる＝ゆれる", "file": "ed868f130a0d8807.mp3"}, {"sec": "例句", "text": "危ないと言われる場所は避けています。", "hint": "避ける＝さける", "file": "47eed8cce4ab2db0.mp3"}, {"sec": "例句", "text": "荷物が減って、掃除も楽になりました。", "hint": "楽＝らく", "file": "f29ea59b4e985f93.mp3"}, {"sec": "例句", "text": "古いですが立派な家が建っています。", "hint": "立派＝りっぱ", "file": "b9555be77be4033e.mp3"}, {"sec": "例句", "text": "大家さんと別れるのは寂しいです。", "hint": "別れる＝わかれる", "file": "a694483cfb41e3c3.mp3"}, {"sec": "例句", "text": "この家は家賃も割合に安いです。", "hint": "割合に＝わりあいに", "file": "0df5ec92d60a5948.mp3"}, {"sec": "故事", "text": "先週の日曜日、家で父が急に倒れてしまいました。父の様子がおかしかったので、私はすぐに救急車を呼びました。父は自分の部屋の隅で倒れていました。", "hint": "先週（せんしゅう）の日曜日（にちようび）、家（いえ）で父（ちち）が急（きゅう）に倒れて（たおれて）しまいました。父（ちち）の様子（ようす）がおかしかったので、私（わたし）はすぐに救急車（きゅうきゅうしゃ）を呼（よ）びました。父（ちち）は自分（じぶん）の部屋（へや）の隅（すみ）で倒（たお）れていました。", "file": "847a4b020b7deeae.mp3"}, {"sec": "故事", "text": "病院に着くと、医者さんがすぐに検査をしてくれました。「なるほど、少し前から頭が痛かったんですね」と医者さんは言いました。父は我慢していたそうです。今日は注射をしなければならないと言われて、そのまましばらく入院することになりました。", "hint": "病院（びょういん）に着（つ）くと、医者（いしゃ）さんがすぐに検査（けんさ）をしてくれました。「なるほど、少（すこ）し前（まえ）から頭（あたま）が痛（いた）かったんですね」と医者（いしゃ）さんは言（い）いました。父（ちち）は我慢（がまん）していたそうです。今日（きょう）は注射（ちゅうしゃ）をしなければならないと言（い）われて、そのまましばらく入院（にゅういん）することになりました。", "file": "4407166e8e534fb4.mp3"}, {"sec": "故事", "text": "特別な部屋は空いていなかったので、父は普通の部屋に入ることになりました。私は一度家に戻って、入院の支度をしました。着替えや歯ブラシを用意して、家族は消化にいいお粥を炊いて持っていきました。", "hint": "特別（とくべつ）な部屋（へや）は空（あ）いていなかったので、父（ちち）は普通（ふつう）の部屋（へや）に入（はい）ることになりました。私（わたし）は一度（いちど）家（いえ）に戻（もど）って、入院（にゅういん）の支度（したく）をしました。着替（きが）えや歯（は）ブラシを用意（ようい）して、家族（かぞく）は消化（しょうか）にいいお粥（かゆ）を炊いて（たいて）持（も）っていきました。", "file": "5162a95d01613a97.mp3"}, {"sec": "故事", "text": "その夜、病室の電灯がつくと、父の顔色は少し良くなっているように見えました。看護師さんが「何を召し上がりますか」と優しく聞いてくれて、父は温いスープを一口飲みました。「これはちょっとぬるいね」と父は笑いました。看護師さんはベッドのシーツも取り替えてくれました。", "hint": "その夜（よる）、病室（びょうしつ）の電灯（でんとう）がつくと、父（ちち）の顔色（かおいろ）は少（すこ）し良（よ）くなっているように見（み）えました。看護師（かんごし）さんが「何（なに）を召し上がり（めしあがり）ますか」と優（やさ）しく聞（き）いてくれて、父（ちち）は温い（ぬるい）スープを一口（ひとくち）飲（の）みました。「これはちょっとぬるいね」と父（ちち）は笑（わら）いました。看護師（かんごし）さんはベッドのシーツも取り替えて（とりかえて）くれました。", "file": "e7a4fbbeab961bf4.mp3"}, {"sec": "故事", "text": "翌日、私はお見舞いに行きました。花屋で花を買って、病院の瓶に入れてあげました。それから、小さい人形も一つ持っていくと、父は子供みたいに喜んでくれました。看護師さんが部屋の床を掃いている間、私は読み終わった本を棚に戻しておきました。", "hint": "翌日（よくじつ）、私（わたし）はお見舞い（おみまい）に行（い）きました。花屋（はなや）で花（はな）を買（か）って、病院（びょういん）の瓶（びん）に入（い）れてあげました。それから、小（ちい）さい人形（にんぎょう）も一（ひと）つ持（も）っていくと、父（ちち）は子供（こども）みたいに喜（よろこ）んでくれました。看護師（かんごし）さんが部屋（へや）の床（ゆか）を掃いて（はいて）いる間（あいだ）、私（わたし）は読（よ）み終（お）わった本（ほん）を棚（たな）に戻して（もどして）おきました。", "file": "3ddd661abb2df634.mp3"}, {"sec": "故事", "text": "薬はとても苦くて、父はいつも顔をしかめていました。傷に薬を塗ってもらってから、痛みは少しずつなくなっていきました。ただ、疲れは少し残っているようで、医者さんに「お酒は当分止めるように」と言われ、なるべく休んだ方がいいとも言われました。", "hint": "薬（くすり）はとても苦くて（にがくて）、父（ちち）はいつも顔（かお）をしかめていました。傷（きず）に薬（くすり）を塗って（ぬって）もらってから、痛（いた）みは少（すこ）しずつなくなっていきました。ただ、疲（つか）れは少（すこ）し残って（のこって）いるようで、医者（いしゃ）さんに「お酒（さけ）は当分（とうぶん）止める（やめる）ように」と言（い）われ、なるべく休（やす）んだ方（ほう）がいいとも言（い）われました。", "file": "3a4552e7ee41f60a.mp3"}, {"sec": "故事", "text": "入院している間、田舎のおばあちゃんから電報が届きました。「早く元気になりますように」と書いてありました。", "hint": "入院（にゅういん）している間（あいだ）、田舎（いなか）のおばあちゃんから電報（でんぽう）が届（とど）きました。「早（はや）く元気（げんき）になりますように」と書（か）いてありました。", "file": "3364ac3dfea608ab.mp3"}, {"sec": "故事", "text": "一週間後、父は大分元気になりました。少し痩せてしまいましたが、医者さんに「来週、退院する予定です」と言われました。次の診察も予約して、父はやっと家に戻ることができました。息子の私は、父が元気になった様子を見て、本当に安心しました。", "hint": "一週間後（いっしゅうかんご）、父（ちち）は大分（だいぶ）元気（げんき）になりました。少（すこ）し痩せて（やせて）しまいましたが、医者（いしゃ）さんに「来週（らいしゅう）、退院（たいいん）する予定（よてい）です」と言（い）われました。次（つぎ）の診察（しんさつ）も予約（よやく）して、父（ちち）はやっと家（いえ）に戻る（もどる）ことができました。息子（むすこ）の私（わたし）は、父（ちち）が元気（げんき）になった様子（ようす）を見（み）て、本当（ほんとう）に安心（あんしん）しました。", "file": "4dc46046baf3af09.mp3"}, {"sec": "故事", "text": "先月、私は新しい町に引っ越しました。引っ越す日は朝から忙しくて、天気予報では雨と言っていましたが、幸い晴れていました。", "hint": "先月（せんげつ）、私（わたし）は新（あたら）しい町（まち）に引っ越し（ひっこし）ました。引っ越す（ひっこす）日（ひ）は朝（あさ）から忙（いそが）しくて、天気予報（てんきよほう）では雨（あめ）と言（い）っていましたが、幸（さいわ）い晴（は）れていました。", "file": "d3d321acea93a8e5.mp3"}, {"sec": "故事", "text": "新しい部屋の引き出しを開くと、とても深くて、奥に前の人に忘れられた指輪が入っていました。", "hint": "新（あたら）しい部屋（へや）の引き出し（ひきだし）を開く（ひらく）と、とても深くて（ふかくて）、奥（おく）に前（まえ）の人（ひと）に忘（わす）れられた指輪（ゆびわ）が入（はい）っていました。", "file": "c57638b2ef409499.mp3"}, {"sec": "故事", "text": "荷物を運んでいる時、隣の人と知り合いました。その人は昔、私の高校の先生に似ている気がしました。すると、聞いてみたら本当に学生時代に同じ学校にいたことが分かりました。", "hint": "荷物（にもつ）を運（はこ）んでいる時（とき）、隣（となり）の人（ひと）と知り合いました（しりあいました）。その人（ひと）は昔（むかし）、私（わたし）の高校（こうこう）の先生（せんせい）に似て（にて）いる気（き）がしました。すると、聞（き）いてみたら本当（ほんとう）に学生時代（じだい）に同（おな）じ学校（がっこう）にいたことが分（わ）かりました。", "file": "b5b8d72dc75676cb.mp3"}, {"sec": "故事", "text": "荷物を片付けながら、近くの売店で食料品を買いました。店員さんはとても親切でした。夜は疲れたので、新しい布団とまくらで早く寝ました。", "hint": "荷物（にもつ）を片付（かたづ）けながら、近（ちか）くの売店（ばいてん）で食料品（しょくりょうひん）を買（か）いました。店員（てんいん）さんはとても親切（しんせつ）でした。夜（よる）は疲（つか）れたので、新（あたら）しい布団（ふとん）とまくらで早（はや）く寝（ね）ました。", "file": "79f1725a74c7465e.mp3"}, {"sec": "故事", "text": "次の日、近所を散歩してみました。普通の道を歩いていたら、珍しいカフェを見つけました。店の中を回ってみると、大きくて柔らかすぎるパンを売っていました。私はケーキを一つ注文して、店員さんに半分に切ってもらいました。", "hint": "次（つぎ）の日（ひ）、近所（きんじょ）を散歩（さんぽ）してみました。普通（ふつう）の道（みち）を歩（ある）いていたら、珍しい（めずらしい）カフェを見（み）つけました。店（みせ）の中（なか）を回って（まわって）みると、大（おお）きくて柔らかすぎる（やわらかすぎる）パンを売（う）っていました。私（わたし）はケーキを一（ひと）つ注文（ちゅうもん）して、店員（てんいん）さんに半分（はんぶん）に切（き）ってもらいました。", "file": "96f956a4da903018.mp3"}, {"sec": "故事", "text": "そこで、道の太い木の下に小さいコインが落ちているのを拾いました。隣の家の猫は少し太ってしまったみたいでした。", "hint": "そこで、道（みち）の太い（ふとい）木（き）の下（した）に小（ちい）さいコインが落（お）ちているのを拾いました（ひろいました）。隣（となり）の家（いえ）の猫（ねこ）は少（すこ）し太って（ふとって）しまったみたいでした。", "file": "b0ff808caf1958ce.mp3"}, {"sec": "故事", "text": "夏が近づいてきたので、水着を買いに行くことにしました。店員さんは私に向いている色を選んでくれました。会計の時、値段が普通の倍になっていることに店員さんが気づきました。", "hint": "夏（なつ）が近（ちか）づいてきたので、水着（みずぎ）を買（か）いに行（い）くことにしました。店員（てんいん）さんは私（わたし）に向いて（むいて）いる色（いろ）を選（えら）んでくれました。会計（かいけい）の時（とき）、値段（ねだん）が普通（ふつう）の倍（ばい）になっていることに店員（てんいん）さんが気（き）づきました。", "file": "d489fc03b842cd7f.mp3"}, {"sec": "故事", "text": "家に帰ると、床が少し汚れていました。引っ越しの時に汚してしまったようです。拭きながら、りんごの皮を剥いて食べました。", "hint": "家（いえ）に帰（かえ）ると、床（ゆか）が少（すこ）し汚れて（よごれて）いました。引（ひ）っ越（こ）しの時（とき）に汚して（よごして）しまったようです。拭（ふ）きながら、りんごの皮（かわ）を剥いて（むいて）食（た）べました。", "file": "6f5161823d311701.mp3"}, {"sec": "故事", "text": "最後に、遠くに住んでいる友達へ贈り物を送ることにしました。プレゼントを丁寧に包んで、別の箱に入れました。指でリボンを結びました。", "hint": "最後（さいご）に、遠（とお）くに住（す）んでいる友達（ともだち）へ贈（おく）り物（もの）を送（おく）ることにしました。プレゼントを丁寧（ていねい）に包んで（つつんで）、別（べつ）の箱（はこ）に入（い）れました。指（ゆび）でリボンを結（むす）びました。", "file": "9a82add95c21bbab.mp3"}, {"sec": "故事", "text": "四月、私は大学に通うために、生まれた町を出て、一人で下宿することにした。駅の角を曲がって静かな道を通って五分のところに、古いが立派な家が建っている。近所にスーパーも図書館もあり、家賃も割合に安い。部屋探しは競争が激しく、この部屋が借りられたのは運がよかった。", "hint": "四月（しがつ）、私（わたし）は大学（だいがく）に通（かよ）うために、生（う）まれた町（まち）を出（で）て、一人（ひとり）で下宿することにした。駅（えき）の角を曲（ま）がって静（しず）かな道（みち）を通って五分（ごふん）のところに、古（ふる）いが立派な家（いえ）が建（た）っている。近所にスーパーも図書館（としょかん）もあり、家賃（やちん）も割合に安（やす）い。部屋探（へやさが）しは競争が激（はげ）しく、この部屋（へや）が借（か）りられたのは運（うん）がよかった。", "file": "72d72d2a976c0fba.mp3"}, {"sec": "故事", "text": "大家さんは玄関の暗号を教えてくれた。忘れないように、私はすぐ手帳にメモしておいた。部屋の鍵は少し緩くて、壁も粗い。けれども、窓が大きくて気分のいい部屋だ。カレンダーを掛けるために、壁に釘を打った。ボタンが取れたシャツは、糸と針で自分で直した。", "hint": "大家（おおや）さんは玄関（げんかん）の暗号を教（おし）えてくれた。忘（わす）れないように、私（わたし）はすぐ手帳（てちょう）にメモしておいた。部屋（へや）の鍵（かぎ）は少（すこ）し緩くて、壁（かべ）も粗い。けれども、窓（まど）が大（おお）きくて気分のいい部屋（へや）だ。カレンダーを掛けるために、壁（かべ）に釘（くぎ）を打った。ボタンが取（と）れたシャツは、糸と針（はり）で自分（じぶん）で直（なお）した。", "file": "048bc8e79e7cb42a.mp3"}, {"sec": "故事", "text": "引っ越しの日は本当に暑くて、シャツも髪も汗でひどい格好になった。夜、窓を開けたまま寝てしまった。眠たくて目を閉じたのに、眠りが浅く、何度も起きた。朝、玄関のドアを開けたら、大家さんが外に立っていた。「よく眠れた？」と笑って聞かれ、久しぶりに家族以外の人と挨拶をした。それで、この町の生活が始まった。", "hint": "引（ひ）っ越（こ）しの日（ひ）は本当（ほんとう）に暑くて、シャツも髪（かみ）も汗（あせ）でひどい格好になった。夜（よる）、窓（まど）を開（あ）けたまま寝（ね）てしまった。眠たくて目（め）を閉（と）じたのに、眠（ねむ）りが浅く、何度（なんど）も起（お）きた。朝（あさ）、玄関（げんかん）のドアを開（あ）けたら、大家（おおや）さんが外（そと）に立（た）っていた。「よく眠（ねむ）れた？」と笑（わら）って聞（き）かれ、久しぶりに家族（かぞく）以外（いがい）の人（ひと）と挨拶（あいさつ）をした。それで、この町（まち）の生活（せいかつ）が始（はじ）まった。", "file": "9b6d5ce44027b52e.mp3"}, {"sec": "故事", "text": "下宿を始めたころ、料理ができなかった。夕飯はコンビニの弁当か缶詰。いくら安くても栄養が足りない。朗らかな大家さんは「それじゃ体に悪いわよ」と笑った。そして台所で野菜の炒め方を教えてもらった。", "hint": "下宿を始（はじ）めたころ、料理（りょうり）ができなかった。夕飯はコンビニの弁当（べんとう）か缶詰。いくら安（やす）くても栄養が足（た）りない。朗らかな大家（おおや）さんは「それじゃ体（からだ）に悪（わる）いわよ」と笑（わら）った。そして台所（だいどころ）で野菜（やさい）の炒め方を教（おし）えてもらった。", "file": "5ff1e237af9d2a1e.mp3"}, {"sec": "故事", "text": "はじめは真似をするだけで、包丁の持ち方も変だった。音楽を聞きながら料理をしていたら、指を切ってしまい恥ずかしかった。大家さんは怒らないで、「気をつけて」と優しく言ってくれた。今は一人で作れるようになった。大家さんの猫に二日おきに餌をやる仕事も任された。", "hint": "はじめは真似をするだけで、包丁（ほうちょう）の持（も）ち方（かた）も変（へん）だった。音楽（おんがく）を聞（き）きながら料理（りょうり）をしていたら、指（ゆび）を切（き）ってしまい恥ずかしかった。大家（おおや）さんは怒らないで、「気をつけて」と優しく言（い）ってくれた。今（いま）は一人（ひとり）で作（つく）れるようになった。大家（おおや）さんの猫（ねこ）に二日（ふつか）おきに餌をやる仕事（しごと）も任（まか）された。", "file": "37e26bfa53ebcb2c.mp3"}, {"sec": "故事", "text": "夜遅くまで音楽を聞いていたので、隣の人が迷惑していたらしい。静かな町がいいと言ったのに、一番うるさいのは私だ。矛盾していると思う。それでも大家さんは好意で野菜を分けてくれる。おかげで食事はよくなった。", "hint": "夜（よる）遅（おそ）くまで音楽（おんがく）を聞（き）いていたので、隣（となり）の人（ひと）が迷惑していたらしい。静（しず）かな町（まち）がいいと言（い）ったのに、一番（いちばん）うるさいのは私（わたし）だ。矛盾していると思（おも）う。それでも大家（おおや）さんは好意で野菜（やさい）を分（わ）けてくれる。おかげで食事（しょくじ）はよくなった。", "file": "192275b5ea2ee9e2.mp3"}, {"sec": "故事", "text": "お礼に大家さんのお宅で料理をご馳走した。料理に興味が出て、作ることを楽しむようになった。それに、自分で作った物を食べると満足できる。二人の夕飯は愉快な時間だ。", "hint": "お礼（れい）に大家（おおや）さんのお宅で料理（りょうり）をご馳走した。料理（りょうり）に興味が出（で）て、作（つく）ることを楽しむようになった。それに、自分（じぶん）で作（つく）った物（もの）を食（た）べると満足できる。二人（ふたり）の夕飯は愉快な時間（じかん）だ。", "file": "329b8324380e0acf.mp3"}, {"sec": "故事", "text": "十一月のある夜、部屋が急に大きく揺れた。棚の本が落ちて、電気も消えてしまった。あまりに怖くて体が動かなかった。さっきまで笑っていたのに、と思った。母は電話で今にも泣きそうな声を出し、ずいぶん心配していた。それから、一般に危ないと言われる場所は避けるようにしている。", "hint": "十一月（じゅういちがつ）のある夜（よる）、部屋（へや）が急（きゅう）に大（おお）きく揺れた。棚（たな）の本（ほん）が落（お）ちて、電気（でんき）も消えてしまった。あまりに怖くて体（からだ）が動（うご）かなかった。さっきまで笑（わら）っていたのに、と思（おも）った。母（はは）は電話（でんわ）で今（いま）にも泣（な）きそうな声（こえ）を出（だ）し、ずいぶん心配していた。それから、一般に危（あぶ）ないと言（い）われる場所（ばしょ）は避けるようにしている。", "file": "74a8b521e602317d.mp3"}, {"sec": "故事", "text": "春、大家さんに誘われ田舎の墓参りに行った。ご主人は十年前に亡くなったそうだ。「別れても、気持ちは永遠に消えないのよ」と大家さんは静かに言った。少し悲しかったが、その言葉で幸せな気持ちにもなった。帰りに二人で記念の写真を写した。この写真を見るたびに、この町を思い出すだろう。", "hint": "春（はる）、大家（おおや）さんに誘（さそ）われ田舎（いなか）の墓参（まい）りに行（い）った。ご主人（しゅじん）は十年前（じゅうねんまえ）に亡（な）くなったそうだ。「別れても、気持ちは永遠に消えないのよ」と大家（おおや）さんは静（しず）かに言（い）った。少（すこ）し悲しかったが、その言葉（ことば）で幸せな気持ちにもなった。帰（かえ）りに二人（ふたり）で記念の写真（しゃしん）を写した。この写真（しゃしん）を見（み）るたびに、この町（まち）を思（おも）い出（だ）すだろう。", "file": "cef1739fa0568ee8.mp3"}, {"sec": "故事", "text": "この頃は卒業のことばかり考えている。この一年しっかり勉強したおかげで、東京の会社で働くことになった。電話で「おめでとうございます」と言われ、涙が出た。要らない物を捨てて荷物が少なくなり、掃除も楽になった。大家さんと別れるのは寂しい。けれども、新しい生活も楽しみだ。", "hint": "この頃は卒業（そつぎょう）のことばかり考（かんが）えている。この一年（いちねん）しっかり勉強（べんきょう）したおかげで、東京（とうきょう）の会社（かいしゃ）で働くことになった。電話（でんわ）で「おめでとうございます」と言（い）われ、涙（なみだ）が出（で）た。要（い）らない物（もの）を捨てて荷物（にもつ）が少（すく）なくなり、掃除（そうじ）も楽になった。大家（おおや）さんと別れるのは寂（さび）しい。けれども、新（あたら）しい生活（せいかつ）も楽しみだ。", "file": "95c843fb09be95d9.mp3"}];
const KEY = "audiocheck-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
let filter = "all";
let audio = new Audio();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function play(f){ audio.pause(); audio = new Audio("audio/"+f); audio.play(); }

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let ok=0,ng=0;
  ITEMS.forEach((it,i)=>{
    const st = state[it.file];
    if(st==="ok") ok++; if(st==="ng") ng++;
    if(filter==="todo" && st) return;
    if(filter==="ng" && st!=="ng") return;
    const row = document.createElement("div");
    row.className = "row" + (st==="ok"?" done-ok":st==="ng"?" done-ng":"");
    row.innerHTML =
      '<span class="sec">'+it.sec+'</span>'+
      '<div class="grow"><div class="jp" lang="ja">'+esc(it.text)+'</div>'+
      '<div class="hint">應讀：'+esc(it.hint)+'</div></div>'+
      '<div class="acts">'+
      '<button data-p="'+i+'">▶</button>'+
      '<button data-ok="'+i+'" class="'+(st==="ok"?"on-ok":"")+'">✓</button>'+
      '<button data-ng="'+i+'" class="'+(st==="ng"?"on-ng":"")+'">✗</button>'+
      '</div>';
    list.appendChild(row);
  });
  document.getElementById("prog").textContent =
    "　已檢查 "+(ok+ng)+" / "+ITEMS.length+"（讀錯 "+ng+"）";
  const bad = ITEMS.filter(it=>state[it.file]==="ng");
  document.getElementById("out").value = bad.length
    ? bad.map(it=> it.sec==="單字"
        ? '"'+it.text+'": "'+it.hint+'",'
        : '// '+it.sec+'：'+it.text+'（應讀 '+it.hint+'）\n"": "",'
      ).join("\n")
    : "（目前沒有標記讀錯的）";
}
function esc(s){ return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

document.getElementById("list").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.p!=null) play(ITEMS[b.dataset.p].file);
  if(b.dataset.ok!=null){ const f=ITEMS[b.dataset.ok].file; state[f]=state[f]==="ok"?undefined:"ok"; save(); render(); }
  if(b.dataset.ng!=null){ const f=ITEMS[b.dataset.ng].file; state[f]=state[f]==="ng"?undefined:"ng"; save(); render(); }
});
document.querySelector(".bar").addEventListener("click",e=>{
  if(e.target.dataset.f){ filter=e.target.dataset.f; render(); }
  if(e.target.id==="reset" && confirm("清除所有檢查進度？")){ state={}; save(); render(); }
});
render();
</script>
</html>
